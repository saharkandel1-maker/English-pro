<style>
:root{--bg:#080C14;--card:#0F1623;--c2:#18233B;--bd:#1E2D45;--tx:#E8EFF8;--mu:#8091AF;--teal:#00D4A8;--red:#FF5C5C;--ok:#0F3A31;--bad:#3A1818;--gold:#F0A500}
:root[data-theme=light]{--bg:#F0F4FA;--card:#fff;--c2:#E6ECF6;--bd:#D5DEEC;--tx:#14203A;--mu:#5B6B88;--ok:#D5F5EC;--bad:#FFE0E0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Arial,sans-serif;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 12px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 7px;font-size:11px;font-weight:700}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--teal)}
h2{font-size:21px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g .card{margin:0;text-align:center}
.g b{display:block;margin:6px 0 2px;font-size:15px}
small,.mu{color:var(--mu);font-size:12px}
.num{font-size:30px;font-weight:900;color:var(--teal)}
.pill{background:rgba(255,255,255,.16);padding:6px 12px;border-radius:20px;font-size:13px}
.btn{display:block;width:100%;background:var(--teal);color:#04120F;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;margin-top:8px}
.btn.s{background:var(--c2);color:var(--tx)}
.row{display:flex;gap:8px}
.opt{display:block;width:100%;text-align:start;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:9px;font-size:16px}
.opt.good{border-color:var(--teal);background:var(--ok)}
.opt.bad{border-color:var(--red);background:var(--bad)}
.q{font-size:18px;line-height:1.55;text-align:start}
.q2{font-size:15px;line-height:1.5;margin-bottom:8px;text-align:start}
.pass{max-height:34vh;overflow:auto;text-align:start;font-size:14px;line-height:1.6;white-space:pre-line}
.bar{flex:1;height:8px;background:var(--c2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{background:var(--c2);color:var(--tx);border:0;border-radius:50%;width:34px;height:34px;font-size:15px;flex:none}
.ex{border-radius:14px;padding:12px 14px;margin:4px 0 8px;line-height:1.5;font-size:14px;border:1px solid var(--bd)}
.ex.w{background:var(--bad);border-color:var(--red)}
.ex.r{background:var(--ok);border-color:var(--teal)}
.fc{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fc .w{font-size:36px;font-weight:900;color:var(--teal);direction:ltr}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:800}
.tag.g{background:var(--ok);color:var(--teal)}
.tag.r{background:var(--bad);color:var(--red)}
.seg{display:flex;gap:8px;margin:12px 0}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:14px}
.seg button.on{border-color:var(--teal);color:var(--teal)}
.ro{padding:9px 12px;border-radius:10px;margin:5px 0;border:1px solid var(--bd);font-size:14px;text-align:start}
.ro.good{border-color:var(--teal);background:var(--ok)}
.ro.bad{border-color:var(--red);background:var(--bad)}
.tm{background:var(--c2);padding:5px 10px;border-radius:14px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
textarea{width:100%;height:110px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:12px;direction:ltr;margin-bottom:6px}
.warn{background:var(--bad);border:1px solid var(--red);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}
.star{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;margin-top:12px}
.star.on{border-color:var(--gold);color:var(--gold)}
details summary{cursor:pointer}
</style></head><body>

","stubborn","cheerful","timid"],"k":1,"e":"stubborn = עקשן. \"refused no matter what\" = עקשנות.","df":"easy"},{"i":"sc4","t":"sc","q":"The school offered extra credit as an _____ for students to participate in the science fair.","o":["obstacle","incentive","restriction","penalty"],"k":1,"e":"incentive = תמריץ. extra credit = פרס שמעודד השתתפות.","df":"easy"},{"i":"sc5","t":"sc","q":"Regular exercise is _____ to both physical and mental health.","o":["harmful","neutral","beneficial","irrelevant"],"k":2,"e":"beneficial = מועיל. exercise = בריאותי ומיטיב.","df":"easy"},{"i":"sc6","t":"sc","q":"The old building fell into disrepair because the owners chose to _____ it for years.","o":["restore","maintain","neglect","demolish"],"k":2,"e":"neglect = להזניח. \"fell into disrepair\" = תוצאה של הזנחה.","df":"easy"},{"i":"sc7","t":"sc","q":"Her _____ nature made her popular among colleagues; she always greeted everyone warmly.","o":["hostile","amiable","distant","formal"],"k":1,"e":"amiable = ידידותי. \"greeted warmly, popular\" = אדם נעים.","df":"easy"},{"i":"sc8","t":"sc","q":"The company needed a _____ financial plan that could survive sudden market changes.","o":["fragile","robust","simple","temporary"],"k":1,"e":"robust = חסון/עמיד. \"survive sudden changes\" = צריך להיות חזק.","df":"easy"},{"i":"sc9","t":"sc","q":"The _____ noise from the construction site made it impossible to concentrate.","o":["occasional","incessant","distant","brief"],"k":1,"e":"incessant = תמידי/בלתי פוסק. \"impossible to concentrate\" = רעש רציף.","df":"easy"},{"i":"sc10","t":"sc","q":"The new legislation was designed to _____ citizens from unnecessary bureaucratic restrictions.","o":["restrict","burden","liberate","confuse"],"k":2,"e":"liberate = לשחרר. \"free from restrictions\" = שחרור.","df":"easy"},{"i":"sc11","t":"sc","q":"Although she agreed with the proposal in theory, she was _____ to commit funding without more data.","o":["eager","reluctant","proud","certain"],"k":1,"e":"\"Although\" = ניגוד. תומכת בתיאוריה אבל מהססת בפועל. reluctant = מהסס.","df":"medium"},{"i":"sc12","t":"sc","q":"The professor asked the student to _____ on her argument rather than simply restating it.","o":["simplify","ignore","elaborate","repeat"],"k":2,"e":"elaborate = לפרט/להרחיב. \"rather than restating\" = להוסיף פירוט.","df":"medium"},{"i":"sc13","t":"sc","q":"The essay lacked _____, with ideas jumping randomly between topics without logical connection.","o":["coherence","enthusiasm","brevity","length"],"k":0,"e":"coherence = לכידות/קישור לוגי. \"jumping randomly\" = חסר קשר לוגי.","df":"medium"},{"i":"sc14","t":"sc","q":"The organization actively _____ stricter environmental regulations to protect natural habitats.","o":["opposes","ignores","advocates","contradicts"],"k":2,"e":"advocate = לתמוך/לקדם. \"actively\" + \"protect\" = תמיכה פעילה.","df":"medium"},{"i":"sc15","t":"sc","q":"The editor removed three paragraphs that were _____, repeating information already covered.","o":["concise","redundant","accurate","essential"],"k":1,"e":"redundant = מיותר/חוזר על עצמו. \"repeating information already covered\" = עודף.","df":"medium"},{"i":"sc16","t":"sc","q":"If the dispute continues to _____, it could destabilize relations between the two countries.","o":["diminish","escalate","resolve","fade"],"k":1,"e":"escalate = להסלים. \"destabilize\" = תוצאה של החמרה.","df":"medium"},{"i":"sc17","t":"sc","q":"The advertisement was _____, implying health benefits that the product could not actually provide.","o":["transparent","deceptive","accurate","creative"],"k":1,"e":"deceptive = מתעתע. \"implying benefits it could not provide\" = הטעייה.","df":"medium"},{"i":"sc18","t":"sc","q":"Young entrepreneurs often _____ the strategies of successful industry leaders hoping to replicate their success.","o":["criticize","ignore","emulate","invent"],"k":2,"e":"emulate = לחקות לשם השוואה. \"hoping to replicate success\" = חיקוי.","df":"medium"},{"i":"sc19","t":"sc","q":"Misinformation has become increasingly _____ on social media, affecting millions of users daily.","o":["rare","absent","prevalent","harmless"],"k":2,"e":"prevalent = נפוץ/שכיח. \"millions affected daily\" = שכיח מאוד.","df":"medium"},{"i":"sc20","t":"sc","q":"The company moved quickly to _____ the gap in the market before competitors could respond.","o":["abandon","ignore","exploit","close"],"k":2,"e":"exploit = לנצל. \"moved quickly to take advantage\" = ניצול הזדמנות.","df":"medium"},{"i":"sc21","t":"sc","q":"His _____ display of wealth — designer suits, a luxury car, a massive mansion — alienated his more modest colleagues.","o":["humble","ostentatious","generous","practical"],"k":1,"e":"ostentatious = ראוותני/מתרברב. \"designer suits, luxury car, mansion\" = ראווה מוגזמת.","df":"hard"},{"i":"sc22","t":"sc","q":"The _____ activist campaigned tirelessly for human rights, devoting every weekend and holiday to the cause.","o":["indifferent","zealous","passive","reluctant"],"k":1,"e":"zealous = קנאי/נלהב מאוד. \"tirelessly... every weekend and holiday\" = מסירות עצומה.","df":"hard"},{"i":"sc23","t":"sc","q":"Attention to the smallest details has always been the _____ of her architectural work.","o":["flaw","hallmark","failure","coincidence"],"k":1,"e":"hallmark = סימן היכר. \"always been\" = מאפיין עקבי.","df":"hard"},{"i":"sc24","t":"sc","q":"There is an _____ tension between protecting individual privacy and ensuring collective security.","o":["external","inherent","obvious","minimal"],"k":1,"e":"inherent = מובנה/טבוע. \"always exists by nature\" = חלק מהמבנה.","df":"hard"},{"i":"sc25","t":"sc","q":"All attempts to negotiate a ceasefire proved _____, as both sides refused every compromise offered.","o":["successful","futile","promising","decisive"],"k":1,"e":"futile = חסר תועלת/לשווא. \"both sides refused every compromise\" = כישלון מוחלט.","df":"hard"},{"i":"sc26","t":"sc","q":"Conspiracy theories have been allowed to _____ unchecked on platforms with minimal content moderation.","o":[  : the more choices people were given, the less satisfied they were with their selection.","o":["solution","paradox","trend","example"],"k":1,"e":"paradox = פרדוקס. \"more choices → less satisfaction\" = מצב שנראה סותר הגיון.","df":"hard"},{"i":"sc34","t":"sc","q":"Fame in the age of social media is often _____, with celebrities rising to prominence and fading within months.","o":["lasting","permanent","ephemeral","growing"],"k":2,"e":"ephemeral = חולף/קצר-מועד. \"rising and fading within months\" = זמני.","df":"hard"},{"i":"sc35","t":"sc","q":"The journalist's _____ investigation, spanning five years and three continents, finally exposed the corruption scheme.","o":["brief","relentless","casual","ineffective"],"k":1,"e":"relentless = בלתי נלאה. \"five years, three continents\" = מאמץ בלתי פוסק.","df":"hard"},{"i":"sc36","t":"sc","q":"The government's decision to cut welfare spending served only to _____ the growing inequality between rich and poor.","o":["reduce","resolve","exacerbate","ignore"],"k":2,"e":"exacerbate = להחמיר. \"served only to worsen\" = החמרת הפערים.","df":"hard"},{"i":"sc37","t":"sc","q":"New DNA evidence finally _____ the man who had spent twenty years in prison for a crime he did not commit.","o":["condemn","implicate","vindicate","prosecute"],"k":2,"e":"vindicate = לזכות/לצדק. \"DNA evidence proving innocence\" = זיכוי.","df":"hard"},{"i":"sc38","t":"sc","q":"Despite suffering severe floods three years in a row, the _____ community rebuilt each time, emerging stronger than before.","o":["vulnerable","resilient","passive","isolated"],"k":1,"e":"resilient = עמיד/בעל חוסן. \"rebuilt each time, emerging stronger\" = חוסן.","df":"hard"},{"i":"sc39","t":"sc","q":"The new food safety regulations were among the most _____ ever introduced, requiring testing at every stage of production.","o":["lenient","stringent","optional","vague"],"k":1,"e":"stringent = מחמיר/קפדני. \"most ever... testing at every stage\" = דרישות קפדניות.","df":"hard"},{"i":"sc40", מם.","df":"hard"},{"i":"sc47","t":"sc","q":"The _____ athlete excelled in three different sports, adapting her technique effortlessly to each discipline.","o":["specialized","versatile","average","rigid"],"k":1,"e":"versatile = רב-תכליתי/גמיש. \"excelled in three sports\" = יכולת רחבה.","df":"medium"},{"i":"sc48","t":"sc","q":"In a surprising statement, the senator moved to _____ the positions he had championed throughout his career.","o":["support","repudiate","promote","develop"],"k":1,"e":"repudiate = לדחות/לכפור. \"moved against positions he had championed\" = דחייה בפומבי.","df":"hard"},{"i":"sc49","t":"sc","q":"The documentary exposed the _____ effects of the misinformation campaign, which had quietly undermined public trust for years.","o":["beneficial","harmless","pernicious","trivial"],"k":2,"e":"pernicious = מזיק בצורה חמורה/קטלני. \"quietly undermined for years\" = נזק עמוק.","df":"hard"},{"i":"sc50","t":"sc","q":"The _____ author published over forty novels in thirty years, making her one of the most productive writers of her generation.","o":["selective","prolific","cautious","mediocre"],"k":1,"e":"prolific = פורה/פולט הרבה. \"forty novels in thirty years\" = תפוקה עצומה.","df":"hard"},{"i":"sc81","t":"sc","q":"Employees are expected to ___ to the company's code of conduct.","o":["adhere","ignore","violate","oppose"],"k":0,"e":"adhere = לדבוק/לציית","df":"easy"},{"i":"sc82","t":"sc","q":"The new apartment provided ___ space for the family of four.","o":["ample","insufficient","scarce","inadequate"],"k":0,"e":"ample = מספיק/שפע","df":"easy"},{"i":"sc83","t":"sc","q":"She appreciated his ___ — he always told her the truth.","o":["candor","deception","vagueness","flattery"],"k":0,"e":"candor = כנות","df":"easy"},{"i":"sc84","t":"sc","q":"His ___ back pain prevented him from sitting for long periods.","o":["chronic","occasional","brief","temporary"],"k":0,"e":"chronic = כרוני/מתמשך","df":"easy"},{"i":"sc85","t":"sc","q":"Drivers must ___ with traffic laws o ed in the 16th century.","The Mona Lisa was painted before the 16th century."],"k":1,"e":"Active → Passive. אותה משמעות, מבנה שונה. תשובה 1 הופכת צייר לנצייר.","df":"easy"},{"i":"rs6","t":"rst","q":"ORIGINAL: \"It is not uncommon for researchers to revise their initial findings.\"","o":["Researchers rarely revise their findings.","Researchers sometimes revise their initial results.","Revising findings is unusual in research.","Researchers always revise their initial findings."],"k":1,"e":"\"Not uncommon\" = שלילה כפולה = שכיח. \"sometimes/often\" = הניסוח הנכון.","df":"medium"},{"i":"rs7","t":"rst","q":"ORIGINAL: \"Only if funding is secured will the project proceed.\"","o":["The project proceeds regardless of funding.","Funding is sufficient for the project.","The project requires funding as a prerequisite.","Funding has already been secured."],"k":2,"e":"\"Only if X, Y\" = Y לא יקרה בלי X. מימון הכרחי להמשך.","df":"medium"},{"i":"rs8","t":"rst","q":"ORIGINAL: \"While the results were promising, they were far from conclusive.\"","o":["Results were both promising and conclusive.","The results offered hope but lacked finality.","Results were neither promising nor conclusive.","Results were conclusive despite being unpromising."],"k":1,"e":"\"While X, far from Y\" = מבטיח אבל לא מוכח. ניגוד בין שני חלקי המשפט.","df":"medium"},{"i":"rs9","t":"rst","q":"ORIGINAL: \"The findings were by no means insignificant.\"","o":["The findings were trivial.","The findings had no measurable impact.","The findings were actually quite important.","The findings were difficult to interpret."],"k":2,"e":"\"By no means\" + \"insignificant\" = שלילה כפולה = משמעותי מאוד.","df":"medium"},{"i":"rs10","t":"rst","q":"ORIGINAL: \"Unless the deadline is extended, the team cannot complete the project.\"","o":["The team will complete it regardless.","Extending the deadline guarantees completion.","Without an extension, completion is impossible.","The deadline has already been extended."],"k":2,"e":"\"Unless X, Y\" = אם X לא מתרחש → Y. Extension = תנאי הכרחי.","df":"medium"},{"i":"rs11","t":"rst","q":"ORIGINAL: \"For all its flaws, the system has served its purpose effectively.\"","o":["The system is flawless and effective.","Flaws have prevented the system from working.","Despite its problems, the system has worked well.","The purpose of the system has changed over time."],"k":2,"e":"\"For all its flaws\" = למרות כל פגמיה. ניגוד: פגמים + אפקטיביות.","df":"medium"},{"i":"rs12","t":"rst","q":"ORIGINAL: \"Scarcely any of the delegates supported the motion.\"","o":["Most delegates supported the motion.","All delegates rejected the motion.","Very few delegates supported the motion.","Delegates were evenly divided on the motion."],"k":2,"e":"\"Scarcely any\" = כמעט אף אחד. very few = הניסוח הנכון.","df":"medium"},{"i":"rs13","t":"rst","q":"ORIGINAL: \"The committee was no less than unanimous in its decision.\"","o":["The committee was almost unanimous.","There was significant disagreement.","Every single member agreed.","A majority voted in favor."],"k":2,"e":"\"No less than unanimous\" = מחזק אחדות מוחלטת. \"every member agreed\" = הניסוח הנכון.","df":"hard"},{"i":"rs14","t":"rst","q":"ORIGINAL: \"Only when trust is established can genuine cooperation begin.\"","o":["Cooperation always leads to trust.","Trust and cooperation develop simultaneously.","Genuine cooperation requires prior trust.","Trust develops as a result of cooperation."],"k":2,"e":"\"Only when X, Y\" = Y מותנה ב-X. אמון הוא תנאי מוקדם לשיתוף פעולה.","df":"hard"},{"i":"rs15","t":"rst","q":"ORIGINAL: \"Few, if any, exceptions to this principle have ever been documented.\"","o":["Many exceptions have been documented.","Exceptions are common but undocumented.","Almost no exceptions have been found.","The principle has no documented applications."],"k":2,"e":"\"Few, if any\" = מעט, אם בכלל. כמעט אין = the correct interpretation.","df":"hard"},{"i":"rs16","t":"rst","q":"ORIGINAL: \"Provided that all parties consent, the agreement may be renegotiated.\"","o":["Renegotiation is possible without consent.","All parties have already consented.","Renegotiation depends on universal agreement.","Consent prevents renegotiation."],"k":2,"e":"\"Provided that X\" = בתנאי ש-X. הסכמה של כולם = תנאי לניהול משא ומתן.","df":"hard"},{"i":"rs17","t":"rst","q":"ORIGINAL: \"The new regulations did not go unnoticed by industry leaders.\"","o":["Industry leaders were unaware of the regulations.","The regulations were hidden from industry.","Industry leaders took note of the new regulations.","The regulations had no impact on industry."],"k":2,"e":"\"Did not go unnoticed\" = שלילה כפולה = הבחינו. \"took note\" = הניסוח הנכון.","df":"hard"},{"i":"rs18","t":"rst","q":"ORIGINAL: \"The proposal was accepted by none but the most senior officials.\"","o":["All officials accepted the proposal.","Only senior officials rejected it.","Only the most senior officials approved it.","Senior officials refused to review the proposal."],"k":2,"e":"\"None but X\" = רק X. exclusive = only the most senior.","df":"hard"},{"i":"rs19","t":"rst","q":"ORIGINAL: \"The study's conclusions were not entirely without merit.\"","o":["The study had no merit whatsoever.","Conclusions were completely worthless.","The study had at least some value.","The study was entirely meritorious."],"k":2,"e":"\"Not entirely without merit\" = לא לגמרי חסר ערך = יש בו ערך מסוים. \"at least some value\".","df":"hard"},{"i":"rs20","t":"rst","q":"ORIGINAL: \"Had the warning been issued earlier, the damage could have been averted.\"","o":["The early warning prevented the damage.","Earlier warnings always avert damage.","The late warning contributed to the damage occurring.","Damage was prevented despite the late warning."],"k":2,"e":"עבר-עתיד היפותטי: \"Had X, could Y\" = X לא קרה → Y קרה. אזהרה מאוחרת = נזק.","df":"hard"},{"i":"rs21","t":"rst","q":"ORIGINAL: \"It is by no means certain that the proposed solution will prove effective.\"","o":["The solution is guaranteed to be effective.","The solution is definitely not effective.","There is genuine uncertainty about the solution's effectiveness.","The solution has already proven effective."],"k":2,"e":"\"By no means certain\" = בשום אופן לא בטוח = יש ספק. \"genuine uncertainty\" = הניסוח הנכון.","df":"hard"},{"i":"rs22","t":"rst","q":"ORIGINAL: \"The treaty was ratified by all member states, without a single abstention.\"","o":["Some states abstained from ratifying.","A majority ratified despite abstentions.","Every member state ratified the treaty.","The treaty was signed but not ratified."],"k":2,"e":"\"All... without a single abstention\" = unanimity. \"every member state\" = הניסוח הנכון.","df":"hard"},{"i":"rs23","t":"rst","q":"ORIGINAL: \"The longer the delay in treatment, the more severe the consequences tend to be.\"","o":["Treatment delays have no measurable effect.","Severe consequences lead to delayed treatment.","Treatment delays are associated with worse outcomes.","Immediate treatment always prevents severe consequences."],"k":2,"e":"\"The longer X, the more Y\" = קשר ישיר בין עיכוב לחומרה. \"associated with worse outcomes\".","df":"hard"},{"i":"rs24","t":"rst","q":"ORIGINAL: \"The evidence presented was not insufficient to establish a reasonable doubt.\"","o":["The evidence was insufficient.","There was no reasonable doubt.","The evidence was sufficient to raise doubt.","The evidence established guilt beyond doubt."],"k":2,"e":"\"Not insufficient\" = שלילה כפולה = sufficient. \"was sufficient to raise doubt\" = הניסוח הנכון.","df":"hard"},{"i":"rc1a","t":"rc","q":"According to the passage, what is the PRIMARY reason people procrastinate?","o":["Poor organization skills","Lack of intelligence","Desire for emotional comfort in the short term","Insufficient motivation"],"k":2,"e":"הפסקה השנייה: \"choosing immediate emotional comfort over future benefit\" = הסיבה העיקרית.","df":"easy","pid":"p1"},{"i":"rc1b","t":"rc","q":"Why, according to the passage, do motivational approaches often fail with chronic procrastinators?","o":["They are too complex to implement","They increase emotional discomfort associated with the task","They focus on the wrong goals","They require too much time"],"k":1,"e":"פסקה 3: \"increases the emotional discomfort... making avoidance more tempting\".","df":"medium","pid":"p1"},{"i":"rc1c","t":"rc","q":"The neuroimaging studies mentioned in the passage suggest that procrastination may be partly explained by:","o":["A lack of willpower and discipline","Differences in brain structure and connectivity","Poor educational background","Excess motivation leading to paralysis"],"k":1,"e":"פסקה 4: larger amygdala + weaker connections = \"genuine neurological roots\".","df":"medium","pid":"p1"},{"i":"rc1d","t":"rc","q":"The author's tone toward procrastinators can best be described as:","o":["Critical and judgmental","Sympathetic and scientific","Indifferent and detached","Humorous and dismissive"],"k":1,"e":"שפת הקטע: \"not a character flaw\", \"compassionate interventions\", מסגור כבעיה נוירולוגית = אמפתי ומדעי.","df":"hard","pid":"p1"},{"i":"rc1e","t":"rc","q":"Which of the following best describes the passage's main argument?","o":["Procrastination should be treated as a moral failing","Procrastination is fundamentally a time management issue","Procrastination is an emotional and neurological phenomenon requiring compassionate approaches","Procrastination cannot be overcome regardless of strategy"],"k":2,"e":"הטיעון המרכזי: emotion regulation + neurological roots → need for compassionate interventions.","df":"hard","pid":"p1"},{"i":"rc2a","t":"rc","q":"What was the original reason for diverting the rivers that fed the Aral Sea?","o":["To provide drinking water for growing cities","To generate hydroelectric power","To irrigate cotton fields for export","To control seasonal flooding"],"k":2,"e":"פסקה 1: \"divert rivers to irrigate vast cotton fields... cotton was a valuable export crop\".","df":"easy","pid":"p2"},{"i":"rc2b","t":"rc","q":"According to the passage, which of the following was NOT a direct consequence of the Aral Sea shrinking?","o":["Destruction of the fishing industry","Spread of toxic dust across the region","An increase in cotton production","Changes to the local climate"],"k":2,"e":"הקטע אינו מציין שייצור הכותנה גדל. ההפך — מדבר על נזק. \"NOT a consequence\".","df":"medium","pid":"p2"},{"i":"rc2c","t":"rc","q":"The word \"severing\" in the first paragraph most nearly means:","o":["Connecting","Measuring","Cutting off","Polluting"],"k":2,"e":"\"severing the sea from its primary water sources\" = cutting off = הפרדה מוחלטת.","df":"medium","pid":"p2"},{"i":"rc2d","t":"rc","q":"The author describes rusting fishing boats as \"a haunting symbol\" primarily to:","o":["Highlight the economic costs to fishermen","Emphasize the visual contrast between past productivity and present desolation","Criticize the fishing industry for overexploitation","Suggest that the sea could be restored to its former state"],"k":1,"e":"\"Rusting boats in salt desert\" = ניגוד בין עבר (40,000 ton industry) להווה (מדבר מלח). visual symbol of destruction.","df":"hard","pid":"p2"},{"i":"rc2e","t":"rc","q":"The passage implies which of the following about the restoration of the Aral Sea?","o":["Full restoration is achievable with sufficient international funding","The northern section has recovered fully while the southern is recovering slowly","Partial recovery is possible in some areas but complete restoration is unlikely","Restoration efforts have been entirely unsuccessful"],"k":2,"e":"פסקה 4: צפון התאושש חלקית, דרום \"may be permanently lost\". תשובה 2 מגזימה, תשובה 4 לא נכון.","df":"hard","pid":"p2"},{"i":"rc3a","t":"rc","q":"According to the passage, what is the central assumption of classical economic theory?","o":["People are primarily motivated by altruism","Humans make rational decisions to maximize their welfare","Economic systems naturally tend toward equality","Markets are governed by predictable psychological forces"],"k":1,"e":"פסקה 1: \"rational actors who consistently make decisions that maximize their own welfare\".","df":"easy","pid":"p3"},{"i":"rc3b","t":"rc","q":"According to the passage, \"loss aversion\" refers to the tendency to:","o":["Avoid any decision that involves risk","Feel losses more intensely than equivalent gains","Prefer smaller certain gains over larger uncertain ones","Overestimate the probability of negative outcomes"],"k":1,"e":"פסקה 2: \"pain of losing... twice as intensely as... pleasure of gaining something equivalent\".","df":"medium","pid":"p3"},{"i":"rc3c","t":"rc","q":"The experiment with the \"90 percent survival rate\" and \"10 percent mortality rate\" is used to illustrate:","o":["That people are unable to understand statistics","That presentation of information affects decisions independently of content","That medical decisions are uniquely prone to irrationality","That rational deliberation is impossible under time pressure"],"k":1,"e":"פסקה 3: same info, different frame → different choices. \"framing effect\" = presentation matters.","df":"medium","pid":"p3"},{"i":"rc3d","t":"rc","q":"Which of the following best represents the critics' concern about \"nudging\" as described in the passage?","o":["Nudges are too subtle to influence behavior effectively","Nudges may replace individual choice with government mandates","Nudges assume authority to guide decisions that may serve interests other than the individual's","Nudges are only effective in low-stakes decisions"],"k":2,"e":"פסקה 5: \"paternalistic\" + \"exploited by corporations/governments for purposes that do not align with citizens\".","df":"hard","pid":"p3"},{"i":"rc3e","t":"rc","q":"The passage suggests that the central tension in behavioral economics is between:","o":["Individual freedom and government regulation","Evidence of human irrationality and the question of who should correct it","Classical and modern economic theory","Psychological research and practical application"],"k":1,"e":"פסקה 5 האחרונה: \"people are not fully rational\" + \"who has authority and legitimacy to guide\" = התח הליבה.","df":"hard","pid":"p3"},{"i":"rs45","t":"rst","q":"ORIGINAL: \"The committee postponed the vote until more information was available.\"","o":["\"The vote was cast without sufficient information.\"","\"The committee delayed the decision, waiting to gather additional data.\"","\"The committee permanently cancelled the vote.\"","\"More information caused the committee to change its decision.\""],"k":1,"e":"postponed = דחה; until more information = עד לאיסוף מידע נוסף","df":"easy"},{"i":"rs46","t":"rst","q":"ORIGINAL: \"While most students found the exam easy, a few struggled to complete it.\"","o":["\"All students found the exam equally challenging.\"","\"No student was able to complete the exam in time.\"","\"The majority had no difficulty, though a small number found it hard.\"","\"A few students completed the exam while most failed.\""],"k":2,"e":"While = ניגוד. רוב = קל; מיעוט = קשה","df":"easy"},{"i":"rs47","t":"rst","q":"ORIGINAL: \"The new policy is not without its critics.\"","o":["\"The new policy has no critics.\"","\"Everyone supports the new policy.\"","\"The new policy faces some opposition.\"","\"Critics created the new policy.\""],"k":2,"e":"not without critics = יש לה מבקרים. שלילה כפולה = חיוב","df":"easy"},{"i":"rs48","t":"rst","q":"ORIGINAL: \"Should the temperature drop below zero, the experiment must be halted.\"","o":["\"The experiment was halted because temperatures rose.\"","\"If temperatures fall below freezing, the experiment must stop.\"","\"The experiment can continue regardless of temperature.\"","\"Temperatures below zero improve the experiment's results.\""],"k":1,"e":"Should = IF. תנאי: טמפרטורה נמוכה → עצירת הניסוי","df":"easy"},{"i":"rs49","t":"rst","q":"ORIGINAL: \"The CEO's resignation was announced without prior warning.\"","o":["\"The CEO planned the resignation months in advance.\"","\"Workers were notified before the CEO resigned.\"","\"The CEO left the position suddenly, with no advance notice.\"","\"The CEO was fired due to poor performance.\""],"k":2,"e":"without prior warning = ללא התראה מוקדמת = פתאומי","df":"easy"},{"i":"rs50","t":"rst","q":"ORIGINAL: \"The novel received mixed reviews — praised for its originality but criticized for its pacing.\"","o":["\"The novel was universally praised by critics.\"","\"Critics loved the pacing but found the novel unoriginal.\"","\"The novel was condemned for both its style and content.\"","\"Critics admired its fresh ideas but found the tempo problematic.\""],"k":3,"e":"mixed = מעורב. praised for originality vs criticized for pacing","df":"easy"},{"i":"rs51","t":"rst","q":"ORIGINAL: \"The vast majority of respondents expressed satisfaction with the new service.\"","o":["\"Most people were unhappy with the new service.\"","\"Respondents were evenly divided about the service.\"","\"An overwhelming proportion of those surveyed reported being pleased with the service.\"","\"A small minority of respondents found the service satisfactory.\""],"k":2,"e":"vast majority = רוב עצום = מרבית המשיבים היו שבעי רצון","df":"medium"},{"i":"rs52","t":"rst","q":"ORIGINAL: \"As long as profits remain high, shareholders will not demand changes in management.\"","o":["\"Shareholders always demand management changes regardless of profits.\"","\"High profits guarantee permanent satisfaction among shareholders.\"","\"Shareholders will only push for leadership changes if financial performance declines.\"","\"Management changes cause profits to remain high.\""],"k":2,"e":"As long as = בתנאי ש. רווחים גבוהים → אין לחץ לשינויים","df":"medium"},{"i":"rs53","t":"rst","q":"ORIGINAL: \"One cannot deny that the policy had unintended effects.\"","o":["\"The policy had no unintended effects.\"","\"It is impossible to acknowledge the policy's unintended effects.\"","\"The policy undeniably produced consequences its designers did not foresee.\"","\"The designers intended all the effects of the policy.\""],"k":2,"e":"cannot deny = לא ניתן להכחיש = יש אפקטים לא מכוונים","df":"medium"},{"i":"rs54","t":"rst","q":"ORIGINAL: \"The senator's support for the bill was conditional on amendments to the tax provisions.\"","o":["\"The senator voted against the bill due to tax concerns.\"","\"The senator agreed to back the legislation only if changes were made to the tax clauses.\"","\"The senator demanded the entire tax section be removed.\"","\"The bill was amended without the senator's input.\""],"k":1,"e":"conditional on = מותנה ב = יתמוך רק אם יתוקן","df":"medium"},{"i":"rs55","t":"rst","q":"ORIGINAL: \"The medicine is effective against the virus, yet it carries significant risks for elderly patients.\"","o":["\"The drug works equally well for all age groups.\"","\"The risks outweigh the benefits for all patients.\"","\"While the drug treats the virus, it poses notable dangers to older individuals.\"","\"Elderly patients benefit more from the drug than younger patients.\""],"k":2,"e":"yet = ניגוד. יעיל ← אבל → סיכון לקשישים","df":"medium"},{"i":"rs56","t":"rst","q":"ORIGINAL: \"Only a fraction of applicants are selected for the highly competitive program.\"","o":["\"All qualified applicants are accepted into the program.\"","\"Most applicants are admitted to the competitive program.\"","\"The selection process accepts applicants without any competition.\"","\"A very small percentage of those who apply are ultimately chosen.\""],"k":3,"e":"only a fraction = רק חלק קטן = מיעוט מועמדים מתקבל","df":"medium"},{"i":"rs57","t":"rst","q":"ORIGINAL: \"Unless the team receives additional funding, the project will be cancelled.\"","o":["\"The project will proceed regardless of funding levels.\"","\"Additional funding has already been secured for the team.\"","\"The project's continuation depends on securing further financial support.\"","\"The team chose to cancel the project voluntarily.\""],"k":2,"e":"Unless = אלא אם כן. ללא מימון → ביטול","df":"medium"},{"i":"rs58","t":"rst","q":"ORIGINAL: \"Her reluctance to accept the position stemmed from concerns about the long commute.\"","o":["\"She eagerly accepted the job offer despite the travel time.\"","\"The commute was her primary reason for hesitating to take the job.\"","\"She was excited about the position but worried about salary.\"","\"The employer refused to accommodate her commuting concerns.\""],"k":1,"e":"reluctance stemmed from = חוסר רצון נבע מ = הסיבה להיסוס היא הנסיעה","df":"medium"},{"i":"rs59","t":"rst","q":"ORIGINAL: \"It is not inconceivable that the findings could reshape the entire field.\"","o":["\"It is impossible that the findings will have any impact.\"","\"The findings are completely unrelated to the field's development.\"","\"There is a genuine possibility that the results could fundamentally change the discipline.\"","\"Reshaping the field would be inconceivable under any circumstances.\""],"k":2,"e":"not inconceivable = לא בלתי ניתן לדמיון = אפשרי","df":"hard"},{"i":"rs60","t":"rst","q":"ORIGINAL: \"The administration touted the policy as a success, notwithstanding mounting evidence to the contrary.\"","o":["\"Evidence confirmed the administration's claims about the policy.\"","\"The policy was quietly dropped following critical evidence.\"","\"Despite increasing proof of failure, officials continued to celebrate the policy.\"","\"The administration acknowledged the evidence and reversed the policy.\""],"k":2,"e":"notwithstanding evidence to the contrary = למרות ראיות הפוכות = המשיכו לטעון להצלחה","df":"hard"},{"i":"rs61","t":"rst","q":"ORIGINAL: \"Scarcely a week passes without a new study questioning the effectiveness of the treatment.\"","o":["\"Weekly studies consistently confirm the treatment's effectiveness.\"","\"Research on the treatment's effectiveness is conducted rarely.\"","\"Almost every week, new research emerges that challenges how well the treatment works.\"","\"No studies have questioned the treatment's effectiveness.\""],"k":2,"e":"scarcely a week without = כמעט כל שבוע = תדיר מאוד","df":"hard"},{"i":"rs62","t":"rst","q":"ORIGINAL: \"Only by acknowledging the underlying causes can policymakers hope to develop lasting solutions.\"","o":["\"Solutions can be found without identifying the root causes.\"","\"Policymakers have already acknowledged and resolved the underlying issues.\"","\"Lasting solutions require that those in power first recognize the root causes.\"","\"Acknowledging causes is sufficient to solve the problem.\""],"k":2,"e":"Only by = רק על ידי. הכרה בסיבות = תנאי לפתרון","df":"hard"},{"i":"rs63","t":"rst","q":"ORIGINAL: \"The author's detractors claim her success owes more to marketing than to literary merit.\"","o":["\"The author's supporters argue that marketing is irrelevant to her success.\"","\"Critics say her commercial success is driven by promotion rather than the quality of her writing.\"","\"The author rejected marketing campaigns in favor of literary quality.\"","\"Marketing agencies credit the author's talent for boosting sales.\""],"k":1,"e":"detractors = מבקרים; owes more to marketing than merit = הצלחה שיווקית לא ספרותית","df":"hard"},{"i":"rs64","t":"rst","q":"ORIGINAL: \"The inspector found no evidence that was inconsistent with the initial report.\"","o":["\"The inspector discovered evidence contradicting the first report.\"","\"The inspector found no evidence of any kind.\"","\"All evidence uncovered was compatible with what the original report had stated.\"","\"The initial report was found to be entirely inaccurate.\""],"k":2,"e":"no evidence inconsistent with = לא מצא ראיות שסותרות = הכל תואם לדוח הראשון","df":"hard"},{"i":"rs65","t":"rst","q":"ORIGINAL: \"Although the intervention reduced crime rates in targeted areas, displacement effects were observed in neighboring zones.\"","o":["\"Crime rates decreased uniformly across all areas studied.\"","\"No measurable change in ented.\"","\"The warning signs were misinterpreted as signs of stability.\""],"k":2,"e":"Had ... been heeded = אילו ... שמו לב = תנאי עבר בלתי אפשרי","df":"hard"},{"i":"rs94","t":"rst","q":"ORIGINAL: \"The prime minister's statement was deliberately vague, leaving room for multiple interpretations.\"","o":["\"The prime minister's statement was precise and left no room for doubt.\"","\"The vague statement caused immediate panic among investors.\"","\"The premier intentionally chose ambiguous language, allowing the statement to be understood in more than one way.\"","\"Multiple interpretations made the statement impossible to act upon.\""],"k":2,"e":"deliberately vague = מכוון להיות מעורפל = השאיר מקום לפרשנויות","df":"hard"},{"i":"rs95","t":"rst","q":"ORIGINAL: \"The panel found no reason to doubt that the data was collected without bias.\"","o":["\"The panel concluded that the data was biased.\"","\"The panel raised serious doubts about the integrity of the data.\"","\"According to the panel, the data appeared to have been gathered objectively.\"","\"Bias in data collection was the panel's primary concern.\""],"k":2,"e":"no reason to doubt = אין סיבה לפקפק = הנתונים נאספו ללא הטיה","df":"hard"},{"i":"rs96","t":"rst","q":"ORIGINAL: \"Despite its global reach, the organization struggled to maintain coherent messaging across its many regional offices.\"","o":["\"The organization's global presence enabled consistent communication across all offices.\"","\"Regional offices had no difficulty aligning with the organization's central messaging.\"","\"Although the organization operated internationally, it found it hard to keep its communication consistent in different locations.\"","\"The organization reduced its global reach to improve messaging coherence.\""],"k":2,"e":"Despite global reach = למרות הנוכחות הגלובלית ← אבל → קושי בעקביות","df":"hard"},{"i":"rs97","t":"rst","q":"ORIGINAL: \"Only a fraction of the land designated for conservation has actually been protected.\" .","df":"easy"},{"i":"rs194","t":"rst","q":"\"As long as the weather holds, the festival will go ahead as planned.\"","o":["The festival will take place as scheduled if the weather stays fine.","The weather will hold only if the festival goes ahead.","The festival will go ahead whatever the weather.","The festival is cancelled because the weather is bad."],"k":0,"e":"as long as = כל עוד: תנאי.","df":"easy"},{"i":"rs195","t":"rst","q":"\"Unless the tenants object, the landlord will proceed with the repairs.\"","o":["The landlord will not repair if the tenants do not object.","The tenants will object if the landlord repairs.","The landlord will carry out the repairs if the tenants do not object.","The landlord will repair only after the tenants object."],"k":2,"e":"unless = if not.","df":"medium"},{"i":"rs196","t":"rst","q":"\"On condition that she apologizes, the committee will reconsider her case.\"","o":["The committee will review her case only if she says sorry.","She will apologize once the committee reconsiders.","The committee will reconsider her case even if she refuses to apologize.","The committee has already apologized to her."],"k":0,"e":"on condition that = בתנאי ש.","df":"medium"},{"i":"rs197","t":"rst","q":"\"Supposing the loan were refused, what would you do?\"","o":["What would be your course of action if the bank turned down the loan?","The loan will be refused, so what will you do?","Why was the loan refused?","What did you do when the loan was refused?"],"k":0,"e":"supposing = נניח ש: תנאי היפותטי.","df":"medium"},{"i":"rs198","t":"rst","q":"\"It was the manager, not the clerk, who approved the refund.\"","o":["Both the manager and the clerk approved the refund.","The clerk did not approve the refund; the manager did.","The clerk approved the refund, not the manager.","Neither the manager nor the clerk approved the refund."],"k":1,"e":"משפט מודגש (cleft): מי שאישר הוא המנהל.","df":"medium"},{"i":"rs199","t":"rst","q":"\"What really annoys me is the constant noise from the construction site.\"","o":["The construction site really annoys me because it is silent.","The continuous noise from the building site bothers me most.","The noise from the site pleases me.","I am annoyed by the construction site only at night."],"k":1,"e":"What-cleft = מה שמרגיז: הדגשת הרעש.","df":"medium"},{"i":"rs200","t":"rst","q":"\"It was not until 1969 that humans first walked on the moon.\"","o":["Humans did not walk on the moon before 1969.","Humans have never walked on the moon.","Humans first walked on the moon after 1969.","Humans walked on the moon in the years before 1969."],"k":0,"e":"It was not until = רק ב: לא קודם.","df":"easy"},{"i":"rs201","t":"rst","q":"\"All I want is a quiet place to study.\"","o":["I want a quiet place to do everything.","I want to study all quiet places.","The only thing I desire is somewhere peaceful to study.","I want everything except a quiet place to study."],"k":2,"e":"All I want = כל מה שאני רוצה = רק.","df":"medium"},{"i":"rs202","t":"rst","q":"\"The proposal is far from perfect, but it is a step in the right direction.\"","o":["The proposal is too distant to be considered.","The proposal is perfect and a step in the right direction.","The proposal is certainly flawed, yet it moves things forward.","The proposal is almost perfect and a step in the wrong direction."],"k":2,"e":"far from = רחוק מלהיות: פגום אך מתקדם.","df":"medium"},{"i":"rs203","t":"rst","q":"\"The result was anything but satisfactory.\"","o":["The result was highly unsatisfactory.","The result was extremely satisfactory.","The result was nothing at all.","The result was satisfactory in some ways."],"k":0,"e":"anything but = בכלל לא.","df":"medium"},{"i":"rs204","t":"rst","q":"\"Her performance was nothing short of miraculous.\"","o":["Her performance was not impressive at all.","Her performance was truly extraordinary.","Her performance was almost miraculous but fell short.","Her performance was short and miraculous."],"k":1,"e":"nothing short of = ממש, לא פחות מ.","df":"hard"},{"i":"rs205","t":"rst","q":"\"He is by no means indifferent to the suffering of refugees.\"","o":["He cares deeply about what refugees go through.","He is only slightly concerned about refugees.","He is a refugee himself.","He is completely unaffected by refugees."],"k":0,"e":"by no means indifferent = בשום אופן לא אדיש = אכפת לו.","df":"hard"},{"i":"rs206","t":"rst","q":"\"There is no denying that social media has changed how we communicate.\"","o":["Some deny that social media changed communication.","It cannot be said that we communicate on social media.","Social media denies how we communicate.","It is undeniable that social media has transformed communication."],"k":3,"e":"There is no denying = אין להכחיש.","df":"medium"},{"i":"rs207","t":"rst","q":"\"It is no use arguing with him; he never changes his mind.\"","o":["Arguing with him is pointless because he is stubborn.","He argues only when he changes his mind.","It is useful to argue with him because he changes his mind.","He never argues with anyone."],"k":0,"e":"It is no use + ing = אין טעם.","df":"medium"},{"i":"rs208","t":"rst","q":"\"I can't help feeling that we are being misled.\"","o":["I helped those who felt misled.","I refuse to feel that we are being misled.","I feel unable to help those who are misled.","I cannot avoid the sense that someone is deceiving us."],"k":3,"e":"can't help + ing = לא יכול שלא.","df":"hard"},{"i":"rs209","t":"rst","q":"\"The company can hardly afford to lose another major client.\"","o":["The company wants to lose another client.","Losing yet another big client would be very damaging for the company.","The company can easily afford to lose another client.","The company hardly has any clients."],"k":1,"e":"can hardly afford = בקושי יכולה להרשות לעצמה.","df":"hard"},{"i":"rs210","t":"rst","q":"\"She has yet to respond to our invitation.\"","o":["She invited us yet again.","She responded to our invitation long ago.","She will never respond to our invitation.","She still has not answered our invitation."],"k":3,"e":"have yet to = עדיין לא.","df":"medium"},{"i":"rs211","t":"rst","q":"\"The patient is on the verge of a complete recovery.\"","o":["The patient has fully recovered already.","The patient will relapse soon.","The patient is far from recovering.","The patient is very close to being fully healed."],"k":3,"e":"on the verge of = ממש על סף.","df":"medium"},{"i":"rs212","t":"rst","q":"\"The committee is bound to reject the proposal in its current form.\"","o":["The committee might approve the proposal.","The committee is tied to the proposal.","The committee will certainly turn down the proposal as it stands.","The committee is forced to accept the proposal."],"k":2,"e":"be bound to = בטוח ש.","df":"hard"},{"i":"rs213","t":"rst","q":"\"He is liable to lose his temper when criticized.\"","o":["He criticizes others who lose their temper.","He is legally responsible for his temper.","He tends to become angry when people criticize him.","He never loses his temper when criticized."],"k":2,"e":"be liable to = נוטה ל.","df":"hard"},{"i":"rs214","t":"rst","q":"\"The scheme is likely to benefit the elderly rather than the young.\"","o":["The scheme will help the elderly and young equally.","The scheme will benefit the young but not the elderly.","The scheme will probably help older people more than younger ones.","The scheme is unlikely to benefit anyone."],"k":2,"e":"rather than = ולא; likely = סביר.","df":"medium"},{"i":"rs215","t":"rst","q":"\"Far from being pleased, the owner was furious about the delay.\"","o":["The owner was extremely angry rather than happy about the delay.","The owner was mildly annoyed by the delay.","The owner was far away during the delay.","The owner was pleased and furious about the delay."],"k":0,"e":"Far from = רחוק מלהיות: ההפך.","df":"medium"},{"i":"rs216","t":"rst","q":"\"Not a single complaint was received after the new policy was introduced.\"","o":["The new policy produced no complaints at all.","Many complaints were received after the policy.","One complaint was received after the new policy.","The policy was introduced after a complaint."],"k":0,"e":"Not a single = אפילו לא אחד.","df":"easy"},{"i":"rs217","t":"rst","q":"\"Seldom has the stock market fallen so sharply in a single day.\"","o":["The market often falls this sharply in a single day.","The market fell sharply over a week.","The market has never fallen on any day.","The market has rarely dropped as steeply within one day as it did now."],"k":3,"e":"Seldom + inversion = לעיתים רחוקות.","df":"medium"},{"i":"rs218","t":"rst","q":"\"Scarcely had the meeting started when the fire alarm rang.\"","o":["The fire alarm sounded almost immediately after the meeting began.","The meeting was cancelled when the alarm rang.","The alarm rang long before the meeting started.","The meeting started after the alarm stopped."],"k":0,"e":"Scarcely...when = ממש כשהתחיל.","df":"medium"},{"i":"rs219","t":"rst","q":"\"On no account must the samples be exposed to direct sunlight.\"","o":["The samples should be left in sunlight on some occasions.","The samples must be kept in sunlight.","The samples have no account of sunlight.","The samples should never be left in direct sunlight."],"k":3,"e":"On no account = בשום אופן.","df":"hard"},{"i":"rs220","t":"rst","q":"\"At no point did the minister admit responsibility for the failure.\"","o":["The minister admitted failure but not at that point.","The minister admitted responsibility at one point.","The minister blamed himself repeatedly.","The minister never accepted blame for the failure."],"k":3,"e":"At no point + inversion = בשום שלב.","df":"medium"},{"i":"rs221","t":"rst","q":"\"In no way can the results be generalized to the whole population.\"","o":["The findings are valid for the whole population.","The findings cannot be applied to everyone.","The results generalize partially to the population.","The population cannot be measured at all."],"k":1,"e":"In no way = בשום אופן; generalize = להכליל.","df":"hard"},{"i":"rs222","t":"rst","q":"\"Such was the force of the explosion that windows shattered a mile away.\"","o":["The windows shattered because they were a mile long.","The explosion was weak, yet windows shattered.","Windows a mile away stopped the explosion.","The explosion was so powerful that windows broke from a great distance."],"k":3,"e":"Such was...that = כזה היה... ש: תוצאה.","df":"hard"},{"i":"rs223","t":"rst","q":"\"So severe was the drought that farmers abandoned their land.\"","o":["Farmers abandoned their land and caused the drought.","Farmers abandoned their land before the drought.","The drought was mild but farmers left anyway.","The drought was so harsh that farmers left their fields."],"k":3,"e":"So + adj + was = כה חמור... ש.","df":"hard"},{"i":"rs224","t":"rst","q":"\"Hardly anyone attended the lecture, which was poorly advertised.\"","o":["Nearly everyone attended the lecture.","Almost nobody came to the poorly publicized lecture.","The lecture was well advertised and well attended.","Hardly anyone advertised the lecture."],"k":1,"e":"hardly anyone = כמעט אף אחד.","df":"easy"},{"i":"rs225","t":"rst","q":"\"The professor, together with his assistants, was awarded the prize.\"","o":["The assistants gave the prize to the professor.","Only the professor received the prize.","The professor awarded the prize to his assistants.","The professor and his assistants all received the prize."],"k":3,"e":"together with = יחד עם: פרס לכולם.","df":"easy"},{"i":"rs226","t":"rst","q":"\"Neither the players nor the coach was satisfied with the outcome.\"","o":["Both the players and the coach were pleased.","Only the coach was satisfied.","The players were satisfied but the coach was not.","Nobody on the team was happy with the result."],"k":3,"e":"Neither...nor = לא זה ולא זה.","df":"easy"},{"i":"rs227","t":"rst","q":"\"Of the two proposals, the latter seems considerably more realistic.\"","o":["The first proposal appears more realistic than the second.","Both proposals seem equally unrealistic.","The second of the two proposals appears much more practical.","The latter proposal was written later and is longer."],"k":2,"e":"the latter = האחרון מבין השניים.","df":"medium"},{"i":"rs228","t":"rst","q":"\"The decline in sales can be attributed to the rise of online shopping.\"","o":["Online shopping has no effect on sales.","Online shopping has caused sales to fall.","Sales have risen thanks to online shopping.","The rise of online shopping resulted from declining sales."],"k":1,"e":"attributed to = מיוחס ל: סיבה.","df":"medium"},{"i":"rs229","t":"rst","q":"\"The delay stems from a lack of coordination between departments.\"","o":["The departments caused no delay.","Coordination between departments created the delay.","The departments failed to coordinate, and this led to the delay.","The delay caused departments to coordinate poorly."],"k":2,"e":"stem from = נובע מ.","df":"medium"},{"i":"rs230","t":"rst","q":"\"Their success was largely due to luck rather than skill.\"","o":["They succeeded purely because of skill.","Luck prevented them from succeeding.","They succeeded mostly by chance and not through ability.","They succeeded equally through luck and skill."],"k":2,"e":"due to = בגלל; rather than = ולא.","df":"medium"},{"i":"rs231","t":"rst","q":"\"The more you postpone the decision, the harder it will become.\"","o":["You should postpone the decision until it is hard.","The decision becomes harder once it is made.","Delaying the decision will make it easier.","Delaying the decision will make it more difficult."],"k":3,"e":"The more...the harder = ככל ש... כך קשה יותר.","df":"easy"},{"i":"rs232","t":"rst","q":"\"He is not as young as he used to be, and he tires more easily.\"","o":["He is younger than he used to be.","His youth has faded, so he gets exhausted more quickly than before.","He tires less easily than before.","He used to tire easily, but now he is young."],"k":1,"e":"not as...as = פחות מ.","df":"easy"},{"i":"rs233","t":"rst","q":"\"Despite having studied for weeks, she failed to pass the exam.\"","o":["She did not pass the exam even though she had prepared for weeks.","She passed the exam because she studied for weeks.","She did not study for weeks and failed.","She failed because the exam lasted weeks."],"k":0,"e":"Despite + having p.p. = למרות שלמדה.","df":"medium"},{"i":"rs234","t":"rst","q":"\"In spite of the fact that prices have soared, demand remains strong.\"","o":["Prices soared because demand remained strong.","Demand fell because prices soared.","Prices have remained stable and so has demand.","Demand is still high even though prices have risen sharply."],"k":3,"e":"In spite of the fact that = למרות ש.","df":"medium"},{"i":"rs235","t":"rst","q":"\"While some critics praised the novel, others dismissed it as shallow.\"","o":["Critics praised the novel after dismissing it.","All critics praised the novel as deep.","Critics were divided: some admired the book and some found it superficial.","Some critics wrote the novel, others dismissed it."],"k":2,"e":"While = ואילו: ניגוד בין דעות.","df":"medium"},{"i":"rs236","t":"rst","q":"\"Try as he might, he could not open the jammed door.\"","o":["He opened the door with a lot of effort.","He did not try to open the door.","The door opened because he was strong.","However hard he tried, the stuck door would not open."],"k":3,"e":"Try as he might = ככל שניסה: ויתור.","df":"hard"},{"i":"rs237","t":"rst","q":"\"Strange as it may seem, the best results came from the cheapest method.\"","o":["The strange method was cheap and ineffective.","It is strange that the cheapest method produced poor results.","Although it sounds odd, the least expensive approach gave the best outcomes.","The best results were achieved by the most expensive method."],"k":2,"e":"Adj + as it may seem = אף כי נראה מוזר.","df":"hard"},{"i":"rs238","t":"rst","q":"\"Whatever the outcome, we will respect the court's ruling.\"","o":["The court will respect our outcome.","We will challenge the ruling whatever happens.","We will accept the court's decision no matter what it is.","We will respect the ruling only if we win."],"k":2,"e":"Whatever = לא משנה מה: ויתור.","df":"medium"},{"i":"rs239","t":"rst","q":"\"No matter how carefully you plan, something is bound to go wrong.\"","o":["Careful planning ensures that nothing goes wrong.","Nothing will go wrong if you are careless.","Even with careful planning, some problem will inevitably arise.","Planning causes things to go wrong."],"k":2,"e":"No matter how = לא משנה כמה.","df":"medium"},{"i":"rs240","t":"rst","q":"\"He apologized for having been rude, but she remained unconvinced.\"","o":["She apologized for being rude, but he was unconvinced.","He apologized and she forgave him immediately.","He refused to apologize for being rude.","He said sorry for his rudeness, yet she was not persuaded."],"k":3,"e":"apologize for having p.p. = התנצל על; but = ניגוד.","df":"medium"},{"i":"rs241","t":"rst","q":"\"Mary is thought to have finished the project ahead of schedule.\"","o":["Mary is expected to finish the project next week.","People believe Mary completed the project earlier than planned.","People know that Mary never finished the project.","Mary thought that she had finished the project late."],"k":1,"e":"is thought to have = מאמינים שעשתה.","df":"medium"},{"i":"rs242","t":"rst","q":"\"The proposal is expected to be approved by the board next month.\"","o":["The proposal is expected to expire next month.","The board approved the proposal last month.","The board is anticipated to give its approval next month.","The board expects to reject the proposal."],"k":2,"e":"passive of expect = צפוי ש.","df":"easy"},{"i":"rs243","t":"rst","q":"\"Not having received a reply, she wrote to them again.\"","o":["She received a reply and did not write again.","She wrote again after receiving a reply.","Since she had received no answer, she sent another letter.","She did not write because she had no reply."],"k":2,"e":"Not having p.p. = מכיוון שלא קיבלה.","df":"medium"},{"i":"rs244","t":"rst","q":"\"Having been warned about the storm, the sailors stayed in port.\"","o":["The sailors left port before the storm warning.","The storm began after the sailors stayed in port.","The sailors remained in the harbor because they had been told of the storm.","The sailors warned others about the storm and left."],"k":2,"e":"Having been p.p. = אחרי שהוזהרו: סיבה.","df":"medium"},{"i":"rs245","t":"rst","q":"\"The tenants had their apartment repainted after the flood.\"","o":["The tenants repainted their apartment themselves.","The flood repainted the apartment.","The tenants refused to repaint their apartment.","Someone else painted the tenants' apartment for them after the flood."],"k":3,"e":"have + object + p.p. = סיבתי: מישהו אחר עשה.","df":"hard"},{"i":"rs246","t":"rst","q":"\"I'd sooner walk than wait an hour for that bus.\"","o":["I walked because the bus came sooner.","I prefer to walk rather than wait an hour for the bus.","I would sooner wait an hour than walk.","I will wait an hour and then walk."],"k":1,"e":"would sooner = מעדיף.","df":"medium"},{"i":"rs247","t":"rst","q":"\"The government is reluctant to raise taxes, lest it lose public support.\"","o":["The government wants to lose public support.","The government raises taxes in order to lose support.","The government has lost support and so raised taxes.","The government avoids tax rises for fear of losing public backing."],"k":3,"e":"lest = פן, מחשש ש.","df":"hard"},{"i":"rs248","t":"rst","q":"\"She works day and night in order not to fall behind her colleagues.\"","o":["She works at night so that her colleagues fall behind.","She works constantly because she is behind her colleagues.","She works constantly so that she does not lag behind her coworkers.","She never works so as not to fall behind."],"k":2,"e":"in order not to = כדי שלא.","df":"medium"},{"i":"rs249","t":"rst","q":"\"Barely had the negotiations begun when both sides threatened to walk out.\"","o":["The negotiations ended before either side threatened to leave.","Both parties threatened to leave almost as soon as talks started.","Both sides stayed until the negotiations ended.","The sides began negotiating after threatening to walk out."],"k":1,"e":"Barely...when = כמעט מיד.","df":"hard"},{"i":"rs250","t":"rst","q":"\"Not once did the witness contradict her earlier statement.\"","o":["The witness contradicted her statement repeatedly.","The witness never made a statement.","The witness stayed consistent with her previous account throughout.","The witness contradicted her statement once."],"k":2,"e":"Not once + inversion = אף פעם לא.","df":"medium"},{"i":"rs251","t":"rst","q":"\"Were it not for the volunteers, the shelter would have closed years ago.\"","o":["The volunteers closed the shelter years ago.","The shelter stayed open although the volunteers left.","The shelter survived only thanks to the volunteers.","The shelter closed because of the volunteers."],"k":2,"e":"Were it not for = אלמלא: ללא המתנדבים היה נסגר.","df":"hard"},{"i":"rs252","t":"rst","q":"\"But for her quick thinking, the accident could have been far worse.\"","o":["The accident was worse because of her quick thinking.","Her quick thinking caused the accident.","She thought quickly but the accident was no worse.","Her fast reaction kept the accident from being more serious."],"k":3,"e":"But for = אלמלא: בזכותה לא החמיר.","df":"hard"},{"i":"rs253","t":"rst","q":"\"Nobody but the chairman knew the true reason for the merger.\"","o":["No one knew the chairman's reason.","Everyone except the chairman knew the reason.","The chairman did not know the reason for the merger.","Only the chairman was aware of why the companies merged."],"k":3,"e":"nobody but = רק מישהו אחד: היו\"ר בלבד.","df":"medium"},{"i":"rs254","t":"rst","q":"\"The lecture was far less engaging than the students had hoped.\"","o":["The students hoped for a shorter lecture.","The lecture was as engaging as expected.","The lecture was more engaging than the students hoped.","The students found the lecture much duller than they expected."],"k":3,"e":"far less...than = הרבה פחות מ.","df":"easy"},{"i":"rs255","t":"rst","q":"\"It remains to be seen whether the new treatment will prove effective.\"","o":["Nobody wants to see the new treatment.","It is still uncertain if the new therapy will work.","The new treatment will certainly fail.","The new treatment has proven effective."],"k":1,"e":"It remains to be seen = עוד נראה: אי ודאות.","df":"medium"},{"i":"rs256","t":"rst","q":"\"The evidence is at odds with the witness's version of events.\"","o":["The witness is at odds with the court.","The evidence contradicts what the witness described.","The evidence confirms the witness's version.","The witness has no version of events."],"k":1,"e":"at odds with = בסתירה ל.","df":"hard"},{"i":"rs257","t":"rst","q":"\"For all her talent, she has never won a major competition.\"","o":["Despite being so gifted, she has never taken a major title.","She won a major competition for her talent.","Because of her talent, she has won major competitions.","She has no talent and has never competed."],"k":0,"e":"For all = למרות כל: ניגוד.","df":"hard"},{"i":"rs258","t":"rst","q":"\"Central banks, having raised interest rates aggressively, are now thought to have contained inflation, although unemployment may yet rise as a delayed consequence.\"","o":["After sharply increasing rates, central banks are believed to have curbed inflation, but joblessness could still grow later as a result.","Because unemployment rose, central banks were forced to raise interest rates aggressively.","Central banks lowered rates sharply, so inflation is believed to have fallen and unemployment is certain to drop.","Central banks are believed to have failed to control inflation, and unemployment has already risen as a result."],"k":0,"e":"Participial phrase (having raised) + may yet = עדיין עלול; האינפלציה נבלמה, אבל האבטלה עלולה לעלות.","df":"hard"},{"i":"rs259","t":"rst","q":"\"The discovery that neurons can regenerate in adulthood overturned a dogma that had dominated neuroscience for decades.\"","o":["The dogma in neuroscience arose after neurons were found to regenerate in adulthood.","Neuroscientists had long known that neurons regenerate, but few believed it was important.","The finding that adult neurons regenerate confirmed a belief held in neuroscience for many years.","Learning that adult neurons can regrow refuted a long-standing belief that had prevailed in neuroscience."],"k":3,"e":"Nominalization + overturned = הפריך; האמונה הוותיקה הופרכה.","df":"medium"},{"i":"rs260","t":"rst","q":"\"Notwithstanding the considerable cost, the researchers deemed the experiment indispensable to validating their hypothesis.\"","o":["The researchers believed the experiment was affordable and helpful, but not essential, for their hypothesis.","Even though it was very expensive, the researchers considered the experiment essential for confirming their hypothesis.","The cost of the experiment was increased because the researchers needed to validate their hypothesis.","Because of the high cost, the researchers considered the experiment unnecessary for confirming their hypothesis."],"k":1,"e":"Notwithstanding = למרות; indispensable = הכרחי.","df":"medium"},{"i":"rs261","t":"rst","q":"\"Economists tend to attribute the stagnation of wages less to automation than to the declining bargaining power of workers.\"","o":["Economists usually see weaker worker bargaining power, rather than automation, as the main reason wages have stalled.","Economists agree that automation and bargaining power play no role in wage stagnation.","Economists generally blame automation more than workers' weakened bargaining power for stagnant wages.","Economists claim that wages stagnated because workers lost power to automation entirely."],"k":0,"e":"less X than Y = Y חשוב יותר; tend to = נוטים.","df":"hard"},{"i":"rs262","t":"rst","q":"\"Had the treaty been ratified earlier, the conflict might well have been averted.\"","o":["The conflict could probably have been avoided if the treaty had been approved sooner.","The conflict broke out because the treaty was ratified too early.","The conflict will probably be avoided if the treaty is ratified soon.","The treaty was ratified early, and so the conflict was avoided."],"k":0,"e":"תנאי סוג 3 הפוך (Had + Subject): לא אושרה בזמן ולכן נוצר סכסוך.","df":"medium"},{"i":"rs263","t":"rst","q":"\"Psychologists have long argued that people overestimate how much others notice their flaws, a bias known as the spotlight effect.\"","o":["Psychologists argue that others notice people's flaws far more than people expect.","Psychologists have maintained for a long time that individuals exaggerate how closely others observe their shortcomings.","Psychologists claim the spotlight effect makes people ignore their own flaws.","Psychologists recently discovered that people underestimate how much others notice their faults."],"k":1,"e":"overestimate = מעריכים ביתר; spotlight effect.","df":"medium"},{"i":"rs264","t":"rst","q":"\"Scarcely had the vaccine been approved when questions arose concerning its long-term efficacy.\"","o":["The vaccine was approved only after its long-term efficacy had been questioned.","Questions about the vaccine's lasting effectiveness appeared almost immediately after its approval.","The vaccine was approved without anyone ever questioning its efficacy.","Questions about the vaccine's efficacy were raised long before it was approved."],"k":1,"e":"Scarcely...when = ברגע ש; היפוך מוקדם.","df":"medium"},{"i":"rs265","t":"rst","q":"\"The defendant's lawyers contended that the evidence, having been obtained without a warrant, should be inadmissible in court.\"","o":["The defense admitted that the evidence was obtained without a warrant but accepted it in court.","The defense argued that evidence gathered with no warrant ought not to be accepted by the court.","The prosecution argued that the evidence was inadmissible because it lacked a warrant.","The lawyers claimed that a warrant was obtained after the evidence was presented."],"k":1,"e":"contended = טענו; having been obtained = הושג ללא צו.","df":"medium"},{"i":"rs266","t":"rst","q":"\"It is arguably the case that the printing press did more to democratize knowledge than any invention before the internet.\"","o":["The internet did more to democratize knowledge than the printing press ever could.","The printing press may well have spread knowledge to ordinary people more than any earlier invention except the internet.","The printing press definitely did more to spread knowledge than the internet did.","The printing press made knowledge more expensive until the internet appeared."],"k":1,"e":"arguably = ניתן לטעון; השוואה עד האינטרנט.","df":"hard"},{"i":"rs267","t":"rst","q":"\"Far from stifling innovation, stringent regulation can, under certain conditions, stimulate firms to develop cleaner technologies.\"","o":["Strict regulation usually stimulates innovation in every industry and under all conditions.","Strict rules do not necessarily hinder innovation; in some circumstances they push companies toward cleaner technology.","Strict regulation always prevents innovation because companies cannot afford cleaner technologies.","Firms develop cleaner technologies only when regulation is removed."],"k":1,"e":"Far from = ממש לא; תנאים מסוימים.","df":"hard"},{"i":"rs268","t":"rst","q":"\"The glacier's retreat, once attributed solely to natural cycles, is now widely ascribed to anthropogenic warming.\"","o":["The glacier has stopped retreating since human warming was acknowledged.","Scientists once blamed only natural cycles for the glacier's shrinking, but most now blame human-caused warming.","Scientists once blamed human warming for the glacier's shrinking but now blame natural cycles.","The glacier is retreating because of natural cycles, as most scientists have always agreed."],"k":1,"e":"once...now = שינוי בהסבר; anthropogenic = מעשה ידי אדם.","df":"hard"},{"i":"rs269","t":"rst","q":"\"No sooner had the company expanded abroad than it encountered unforeseen regulatory obstacles.\"","o":["The company never expanded abroad because of regulatory obstacles.","The company encountered obstacles abroad, which it had expected.","Immediately after expanding overseas, the company ran into legal hurdles it had not anticipated.","The company expanded abroad only after it overcame unforeseen regulatory obstacles."],"k":2,"e":"No sooner...than = מיד לאחר.","df":"medium"},{"i":"rs270","t":"rst","q":"\"Inflation erodes the purchasing power of savings unless interest rates keep pace with rising prices.\"","o":["Savings gain buying power whenever prices rise.","Inflation helps savings only if interest rates fall.","Savings lose buying power when inflation is not matched by interest rates.","Interest rates always rise faster than prices during inflation."],"k":2,"e":"unless = אלא אם; ריבית צריכה להדביק.","df":"easy"},{"i":"rs271","t":"rst","q":"\"The historian cautioned that sources written long after the events they describe should be treated with considerable skepticism.\"","o":["The historian argued that sources written during the events deserve skepticism.","The historian advised that late sources are the most reliable accounts of events.","The historian said all historical sources should be rejected as false.","The historian warned that accounts composed much later than the events deserve a high degree of doubt."],"k":3,"e":"cautioned = הזהיר; sources composed later.","df":"medium"},{"i":"rs272","t":"rst","q":"\"Although the algorithm performs impressively on familiar data, its accuracy deteriorates markedly when confronted with unfamiliar inputs.\"","o":["The algorithm performs equally well on familiar and ed it was too harsh.","Despite broad criticism that it was too mild, the tribunal's decision was confirmed by a small majority on appeal."],"k":3,"e":"though = אף ש; upheld = אושר; narrow margin = רוב קטן.","df":"medium"},{"i":"rs280","t":"rst","q":"\"Behavioral economists contend that consumers rarely behave as the rational agents that classical models presume them to be.\"","o":["Classical models claim consumers rarely act rationally, but behavioral economists disagree.","According to behavioral economists, shoppers seldom act with the logic that traditional models assume.","Behavioral economists believe consumers never make any decisions.","Behavioral economists contend that consumers always act rationally, as classical models predict."],"k":1,"e":"rarely = לעתים נדירות; presume = מניחים.","df":"medium"},{"i":"rs281","t":"rst","q":"\"The prolonged drought, compounded by poor water management, precipitated a crisis that few officials had foreseen.\"","o":["A long dry spell, made worse by bad water policy, triggered an emergency most officials had not predicted.","Good water management prevented the crisis that most officials had foreseen.","The crisis was foreseen by most officials and caused the drought.","The drought ended thanks to water management, avoiding a crisis."],"k":0,"e":"compounded = החמיר; precipitated = גרם; few had foreseen.","df":"hard"},{"i":"rs282","t":"rst","q":"\"By no means does correlation between two variables establish that one causes the other.\"","o":["A link between two variables always proves that one causes the other.","A link between two variables does not prove that one produces the other.","Two variables with no correlation prove that one causes the other.","Correlation sometimes establishes causation, but only by a slim margin."],"k":1,"e":"By no means = בשום אופן לא.","df":"easy"},{"i":"rs283","t":"rst","q":"\"The merger was ostensibly intended to achieve economies of scale, yet critics suspect it was motivated chiefly by a desire to eliminate competition.\"","o":["The merger was openly designed to remove rivals, and critics say it was meant to cut costs.","The merger was supposedly meant to cut costs through size, but critics believe its main aim was to remove rivals.","Critics agree that the merger was meant to achieve economies of scale.","The merger eliminated competition, so it failed to achieve economies of scale."],"k":1,"e":"ostensibly = לכאורה; yet = אך; chiefly = בעיקר.","df":"hard"},{"i":"rs284","t":"rst","q":"\"Hardly any of the participants reported side effects, which suggests, albeit tentatively, that the drug is well tolerated.\"","o":["Almost no participants reported side effects, which definitively proves the drug is safe.","Almost none of the participants reported side effects, which hints, though not conclusively, that the drug is tolerated well.","Many participants reported side effects, which proves that the drug is poorly tolerated.","Participants did not take the drug, so side effects could not be reported."],"k":1,"e":"Hardly any = כמעט אף אחד; albeit tentatively = אם כי בזהירות.","df":"hard"},{"i":"rs285","t":"rst","q":"\"Urbanization has accelerated so rapidly that infrastructure in many developing cities can no longer cope with demand.\"","o":["Infrastructure has developed faster than urbanization in poor cities.","Urbanization has stopped because infrastructure could not cope.","Cities in developing countries have grown so fast that their infrastructure is now overwhelmed.","Developing cities have grown slowly, so their infrastructure is more than adequate."],"k":2,"e":"so...that = תוצאה; לא עומדת בביקוש.","df":"medium"},{"i":"rs286","t":"rst","q":"\"The theory, first dismissed as implausible, gradually gained acceptance as supporting evidence accumulated.\"","o":["The theory was accepted at first but later rejected as evidence accumulated.","The theory gained acceptance even though evidence contradicted it.","The theory was always accepted because it was plausi
