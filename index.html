<style>
:root{--bg:#080C14;--card:#0F1623;--c2:#18233B;--bd:#1E2D45;--tx:#E8EFF8;--mu:#8091AF;--teal:#00D4A8;--red:#FF5C5C;--ok:#0F3A31;--bad:#3A1818;--gold:#F0A500}
:root[data-theme=light]{--bg:#F0F4FA;--card:#fff;--c2:#E6ECF6;--bd:#D5DEEC;--tx:#14203A;--mu:#5B6B88;--ok:#D5F5EC;--bad:#FFE0E0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Arial,sans-serif;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 12px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 7px;font-size:11px;font-weight:700}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--teal)}
h2{font-size:21px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g .card{margin:0;text-align:center}
.g b{display:block;margin:6px 0 2px;font-size:15px}
small,.mu{color:var(--mu);font-size:12px}
.num{font-size:30px;font-weight:900;color:var(--teal)}
.pill{background:rgba(255,255,255,.16);padding:6px 12px;border-radius:20px;font-size:13px}
.btn{display:block;width:100%;background:var(--teal);color:#04120F;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;margin-top:8px}
.btn.s{background:var(--c2);color:var(--tx)}
.row{display:flex;gap:8px}
.opt{display:block;width:100%;text-align:start;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:9px;font-size:16px}
.opt.good{border-color:var(--teal);background:var(--ok)}
.opt.bad{border-color:var(--red);background:var(--bad)}
.q{font-size:18px;line-height:1.55;text-align:start}
.q2{font-size:15px;line-height:1.5;margin-bottom:8px;text-align:start}
.pass{max-height:34vh;overflow:auto;text-align:start;font-size:14px;line-height:1.6;white-space:pre-line}
.bar{flex:1;height:8px;background:var(--c2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{background:var(--c2);color:var(--tx);border:0;border-radius:50%;width:34px;height:34px;font-size:15px;flex:none}
.ex{border-radius:14px;padding:12px 14px;margin:4px 0 8px;line-height:1.5;font-size:14px;border:1px solid var(--bd)}
.ex.w{background:var(--bad);border-color:var(--red)}
.ex.r{background:var(--ok);border-color:var(--teal)}
.fc{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fc .w{font-size:36px;font-weight:900;color:var(--teal);direction:ltr}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:800}
.tag.g{background:var(--ok);color:var(--teal)}
.tag.r{background:var(--bad);color:var(--red)}
.seg{display:flex;gap:8px;margin:12px 0}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:14px}
.seg button.on{border-color:var(--teal);color:var(--teal)}
.ro{padding:9px 12px;border-radius:10px;margin:5px 0;border:1px solid var(--bd);font-size:14px;text-align:start}
.ro.good{border-color:var(--teal);background:var(--ok)}
.ro.bad{border-color:var(--red);background:var(--bad)}
.tm{background:var(--c2);padding:5px 10px;border-radius:14px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
textarea{width:100%;height:110px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:12px;direction:ltr;margin-bottom:6px}
.warn{background:var(--bad);border:1px solid var(--red);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}
.star{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;margin-top:12px}
.star.on{border-color:var(--gold);color:var(--gold)}
details summary{cursor:pointer}
</style></head><body>

hose to _____ it for years.","o":["restore","maintain","neglect","demolish"],"k":2,"e":"neglect = להזניח. \"fell into disrepair\" = תוצאה של הזנחה.","df":"easy"},{"i":"sc7","t":"sc","q":"Her _____ nature made her popular among colleagues; she always greeted everyone warmly.","o":["hostile","amiable","distant","formal"],"k":1,"e":"amiable = ידידותי. \"greeted warmly, popular\" = אדם נעים.","df":"easy"},{"i":"sc8","t":"sc","q":"The company needed a _____ financial plan that could survive sudden market changes.","o":["fragile","robust","simple","temporary"],"k":1,"e":"robust = חסון/עמיד. \"survive sudden changes\" = צריך להיות חזק.","df":"easy"},{"i":"sc9","t":"sc","q":"The _____ noise from the construction site made it impossible to concentrate.","o":["occasional","incessant","distant","brief"],"k":1,"e":"incessant = תמידי/בלתי פוסק. \"impossible to concentrate\" = רעש רציף.","df":"easy"},{"i":"sc10","t":"sc","q":"The new legislation was designed to _____ citizens from unnecessary bureaucratic restrictions.","o":["restrict","burden","liberate","confuse"],"k":2,"e":"liberate = לשחרר. \"free from restrictions\" = שחרור.","df":"easy"},{"i":"sc11","t":"sc","q":"Although she agreed with the proposal in theory, she was _____ to commit funding without more data.","o":["eager","reluctant","proud","certain"],"k":1,"e":"\"Although\" = ניגוד. תומכת בתיאוריה אבל מהססת בפועל. reluctant = מהסס.","df":"medium"},{"i":"sc12","t":"sc","q":"The professor asked the student to _____ on her argument rather than simply restating it.","o":["simplify","ignore","elaborate","repeat"],"k":2,"e":"elaborate = לפרט/להרחיב. \"rather than restating\" = להוסיף פירוט.","df":"medium"},{"i":"sc13","t":"sc","q":"The essay lacked _____, with ideas jumping randomly between topics without logical connection.","o":["coherence","enthusiasm","brevity","length"],"k":0,"e":"coherence = לכידות/קישור לוגי. \"jumping randomly\" = חסר קשר לוגי.","df":"medium"},{"i":"sc14","t":"sc","q":"The organization actively _____ actical"],"k":1,"e":"ostentatious = ראוותני/מתרברב. \"designer suits, luxury car, mansion\" = ראווה מוגזמת.","df":"hard"},{"i":"sc22","t":"sc","q":"The _____ activist campaigned tirelessly for human rights, devoting every weekend and holiday to the cause.","o":["indifferent","zealous","passive","reluctant"],"k":1,"e":"zealous = קנאי/נלהב מאוד. \"tirelessly... every weekend and holiday\" = מסירות עצומה.","df":"hard"},{"i":"sc23","t":"sc","q":"Attention to the smallest details has always been the _____ of her architectural work.","o":["flaw","hallmark","failure","coincidence"],"k":1,"e":"hallmark = סימן היכר. \"always been\" = מאפיין עקבי.","df":"hard"},{"i":"sc24","t":"sc","q":"There is an _____ tension between protecting individual privacy and ensuring collective security.","o":["external","inherent","obvious","minimal"],"k":1,"e":"inherent = מובנה/טבוע. \"always exists by nature\" = חלק מהמבנה.","df":"hard"},{"i":"sc25","t":"sc","q":"All attempts to negotiate a ceasefire proved _____, as both sides refused every compromise offered.","o":["successful","futile","promising","decisive"],"k":1,"e":"futile = חסר תועלת/לשווא. \"both sides refused every compromise\" = כישלון מוחלט.","df":"hard"},{"i":"sc26","t":"sc","q":"Conspiracy theories have been allowed to _____ unchecked on platforms with minimal content moderation.","o":["decrease","proliferate","stabilize","vanish"],"k":1,"e":"proliferate = להתרבות/להתפשט. \"unchecked\" = ריבוי בלתי מרוסן.","df":"hard"},{"i":"sc27","t":"sc","q":"The researcher spent a decade analyzing an _____ 12th-century manuscript that virtually no other scholar had examined.","o":["famous","obscure","reliable","controversial"],"k":1,"e":"obscure = לא מוכר/שולי. \"virtually no other scholar examined\" = עמוק בשוליים.","df":"hard"},{"i":"sc28","t":"sc","q":"Rather than insisting on a perfect solution, the negotiators took a _____ approach, accepting the best available compromise.","o":["idealistic","impractical","pragmatic","stubborn"],"k":2,"e":"pragmatic = פרגמטי/מעשי. \"accepting best available compromise\" = גישה מעשית.","df":"hard"},{"i":"sc29","t":"sc","q":"Despite repeated setbacks, she remained _____ in her pursuit of justice, refusing to abandon the case.","o":["passive","tenacious","indifferent","careless"],"k":1,"e":"tenacious = עיקש/מתמיד. \"despite setbacks, refusing to abandon\" = עקשנות חיובית.","df":"hard"},{"i":"sc30","t":"sc","q":"The answer to the fundamental question of consciousness has proved _____, evading philosophers and scientists alike.","o":["obvious","simple","elusive","trivial"],"k":2,"e":"elusive = חמקמק/קשה להשגה. \"evading philosophers and scientists\" = לא ניתן לתפוס.","df":"hard"},{"i":"sc31","t":"sc","q":"The political situation remained _____, with sudden shifts in public opinion threatening to upend the fragile coalition.","o":["stable","predictable","volatile","unified"],"k":2,"e":"volatile = תנודתי/נפיץ. \"sudden shifts threatening\" = מצב לא יציב.","df":"hard"},{"i":"sc32","t":"sc","q":"The _____ scientist recorded every variable in precise detail, leaving nothing to chance or approximation.","o":["careless","meticulous","hasty","indifferent"],"k":1,"e":"meticulous = מדוקדק/קפדן. \"every variable in precise detail, nothing to chance\" = קפדנות.","df":"hard"},{"i":"sc33","t":"sc","q":"The study revealed an interesting _____ : the more choices people were given, the less satisfied they were with their selection.","o":["solution","paradox","trend","example"],"k":1,"e":"paradox = פרדוקס. \"more choices → less satisfaction\" = מצב שנראה סותר הגיון.","df":"hard"},{"i":"sc34","t":"sc","q":"Fame in the age of social media is often _____, with celebrities rising to prominence and fading within months.","o":["lasting","permanent","ephemeral","growing"],"k":2,"e":"ephemeral = חולף/קצר-מועד. \"rising and fading within months\" = זמני.","df":"hard"},{"i":"sc35","t":"sc","q":"The journalist's _____ investigation, spanning five years and three continents, finally exposed the corruption scheme.","o":["brief","relentless","casual","ineffective"],"k":1,"e":"relentless = בלתי נלאה. \"five years, three continents\" = מאמץ בלתי פוסק.","df":"hard"},{"i":"sc36","t":"sc","q":"The government's decision to cut welfare spending served only to _____ the growing inequality between rich and poor.","o":["reduce","resolve","exacerbate","ignore"],"k":2,"e":"exacerbate = להחמיר. \"served only to worsen\" = החמרת הפערים.","df":"hard"},{"i":"sc37","t":"sc","q":"New DNA evidence finally _____ the man who had spent twenty years in prison for a crime he did not commit.","o":["condemn","implicate","vindicate","prosecute"],"k":2,"e":"vindicate = לזכות/לצדק. \"DNA evidence proving innocence\" = זיכוי.","df":"hard"},{"i":"sc38","t":"sc","q":"Despite suffering severe floods three years in a row, the _____ community rebuilt each time, emerging stronger than before.","o":["vulnerable","resilient","passive","isolated"],"k":1,"e":"resilient = עמיד/בעל חוסן. \"rebuilt each time, emerging stronger\" = חוסן.","df":"hard"},{"i":"sc39","t":"sc","q":"The new food safety regulations were among the most _____ ever introduced, requiring testing at every stage of production.","o":["lenient","stringent","optional","vague"],"k":1,"e":"stringent = מחמיר/קפדני. \"most ever... testing at every stage\" = דרישות קפדניות.","df":"hard"},{"i":"sc40","t":"sc","q":"Unlike his gregarious colleagues who dominated every discussion, Professor Mercer was _____, speaking only when he had something essential to add.","o":["verbose","taciturn","arrogant","impatient"],"k":1,"e":"taciturn = שתקן/לקוני. \"speaking only when essential\" = מדבר מעט. contrast עם gregarious.","df":"hard"},{"i":"sc41","t":"sc","q":"The invention of the internet served as a _____ for the most dramatic transformation of communication in human history.","o":["barrier","catalyst","consequence","result"],"k":1,"e":"catalyst = זרז. \"served as a trigger for transformation\" = גורם מזרז.","df":"medium"},{"i":"sc42","t":"sc","q":"The ne e project proceed.\"","o":["The project proceeds regardless of funding.","Funding is sufficient for the project.","The project requires funding as a prerequisite.","Funding has already been secured."],"k":2,"e":"\"Only if X, Y\" = Y לא יקרה בלי X. מימון הכרחי להמשך.","df":"medium"},{"i":"rs8","t":"rst","q":"ORIGINAL: \"While the results were promising, they were far from conclusive.\"","o":["Results were both promising and conclusive.","The results offered hope but lacked finality.","Results were neither promising nor conclusive.","Results were conclusive despite being unpromising."],"k":1,"e":"\"While X, far from Y\" = מבטיח אבל לא מוכח. ניגוד בין שני חלקי המשפט.","df":"medium"},{"i":"rs9","t":"rst","q":"ORIGINAL: \"The findings were by no means insignificant.\"","o":["The findings were trivial.","The findings had no measurable impact.","The findings were actually quite important.","The findings were difficult to interpret."],"k":2,"e":"\"By no means\" + \"insignificant\" = שלילה כפולה = משמעותי מאוד.","df":"medium"},{"i":"rs10","t":"rst","q":"ORIGINAL: \"Unless the deadline is extended, the team cannot complete the project.\"","o":["The team will complete it regardless.","Extending the deadline guarantees completion.","Without an extension, completion is impossible.","The deadline has already been extended."],"k":2,"e":"\"Unless X, Y\" = אם X לא מתרחש → Y. Extension = תנאי הכרחי.","df":"medium"},{"i":"rs11","t":"rst","q":"ORIGINAL: \"For all its flaws, the system has served its purpose effectively.\"","o":["The system is flawless and effective.","Flaws have prevented the system from working.","Despite its problems, the system has worked well.","The purpose of the system has changed over time."],"k":2,"e":"\"For all its flaws\" = למרות כל פגמיה. ניגוד: פגמים + אפקטיביות.","df":"medium"},{"i":"rs12","t":"rst","q":"ORIGINAL: \"Scarcely any of the delegates supported the motion.\"","o":["Most delegates supported the motion.","All delegates rejected the motion.","Very tention\" = unanimity. \"every member state\" = הניסוח הנכון.","df":"hard"},{"i":"rs23","t":"rst","q":"ORIGINAL: \"The longer the delay in treatment, the more severe the consequences tend to be.\"","o":["Treatment delays have no measurable effect.","Severe consequences lead to delayed treatment.","Treatment delays are associated with worse outcomes.","Immediate treatment always prevents severe consequences."],"k":2,"e":"\"The longer X, the more Y\" = קשר ישיר בין עיכוב לחומרה. \"associated with worse outcomes\".","df":"hard"},{"i":"rs24","t":"rst","q":"ORIGINAL: \"The evidence presented was not insufficient to establish a reasonable doubt.\"","o":["The evidence was insufficient.","There was no reasonable doubt.","The evidence was sufficient to raise doubt.","The evidence established guilt beyond doubt."],"k":2,"e":"\"Not insufficient\" = שלילה כפולה = sufficient. \"was sufficient to raise doubt\" = הניסוח הנכון.","df":"hard"},{"i":"rc1a","t":"rc","q":"According to the passage, what is the PRIMARY reason people procrastinate?","o":["Poor organization skills","Lack of intelligence","Desire for emotional comfort in the short term","Insufficient motivation"],"k":2,"e":"הפסקה השנייה: \"choosing immediate emotional comfort over future benefit\" = הסיבה העיקרית.","df":"easy","pid":"p1"},{"i":"rc1b","t":"rc","q":"Why, according to the passage, do motivational approaches often fail with chronic procrastinators?","o":["They are too complex to implement","They increase emotional discomfort associated with the task","They focus on the wrong goals","They require too much time"],"k":1,"e":"פסקה 3: \"increases the emotional discomfort... making avoidance more tempting\".","df":"medium","pid":"p1"},{"i":"rc1c","t":"rc","q":"The neuroimaging studies mentioned in the passage suggest that procrastination may be partly explained by:","o":["A lack of willpower and discipline","Differences in brain structure and connectivity","Poor educational background","Excess motivation leading to paralysis"],"k":1,"e":"פסקה 4: larger amygdala + weaker connections = \"genuine neurological roots\".","df":"medium","pid":"p1"},{"i":"rc1d","t":"rc","q":"The author's tone toward procrastinators can best be described as:","o":["Critical and judgmental","Sympathetic and scientific","Indifferent and detached","Humorous and dismissive"],"k":1,"e":"שפת הקטע: \"not a character flaw\", \"compassionate interventions\", מסגור כבעיה נוירולוגית = אמפתי ומדעי.","df":"hard","pid":"p1"},{"i":"rc1e","t":"rc","q":"Which of the following best describes the passage's main argument?","o":["Procrastination should be treated as a moral failing","Procrastination is fundamentally a time management issue","Procrastination is an emotional and neurological phenomenon requiring compassionate approaches","Procrastination cannot be overcome regardless of strategy"],"k":2,"e":"הטיעון המרכזי: emotion regulation + neurological roots → need for compassionate interventions.","df":"hard","pid":"p1"},{"i":"rc2a","t":"rc","q":"What was the original reason for diverting the rivers that fed the Aral Sea?","o":["To provide drinking water for growing cities","To generate hydroelectric power","To irrigate cotton fields for export","To control seasonal flooding"],"k":2,"e":"פסקה 1: \"divert rivers to irrigate vast cotton fields... cotton was a valuable export crop\".","df":"easy","pid":"p2"},{"i":"rc2b","t":"rc","q":"According to the passage, which of the following was NOT a direct consequence of the Aral Sea shrinking?","o":["Destruction of the fishing industry","Spread of toxic dust across the region","An increase in cotton production","Changes to the local climate"],"k":2,"e":"הקטע אינו מציין שייצור הכותנה גדל. ההפך — מדבר על נזק. \"NOT a consequence\".","df":"medium","pid":"p2"},{"i":"rc2c","t":"rc","q":"The word \"severing\" in the first paragraph most nearly means:","o":["Connecting","Measuring","Cutting off","Polluting"],"k":2,"e":"\"severing the sea from its primary water sources\" = cutting off = הפ ":"rc","q":"The experiment with the \"90 percent survival rate\" and \"10 percent mortality rate\" is used to illustrate:","o":["That people are unable to understand statistics","That presentation of information affects decisions independently of content","That medical decisions are uniquely prone to irrationality","That rational deliberation is impossible under time pressure"],"k":1,"e":"פסקה 3: same info, different frame → different choices. \"framing effect\" = presentation matters.","df":"medium","pid":"p3"},{"i":"rc3d","t":"rc","q":"Which of the following best represents the critics' concern about \"nudging\" as described in the passage?","o":["Nudges are too subtle to influence behavior effectively","Nudges may replace individual choice with government mandates","Nudges assume authority to guide decisions that may serve interests other than the individual's","Nudges are only effective in low-stakes decisions"],"k":2,"e":"פסקה 5: \"paternalistic\" + \"exploited by corporations/governments for purposes that do not align with citizens\".","df":"hard","pid":"p3"},{"i":"rc3e","t":"rc","q":"The passage suggests that the central tension in behavioral economics is between:","o":["Individual freedom and government regulation","Evidence of human irrationality and the question of who should correct it","Classical and modern economic theory","Psychological research and practical application"],"k":1,"e":"פסקה 5 האחרונה: \"people are not fully rational\" + \"who has authority and legitimacy to guide\" = התח הליבה.","df":"hard","pid":"p3"},{"i":"rs45","t":"rst","q":"ORIGINAL: \"The committee postponed the vote until more information was available.\"","o":["\"The vote was cast without sufficient information.\"","\"The committee delayed the decision, waiting to gather additional data.\"","\"The committee permanently cancelled the vote.\"","\"More information caused the committee to change its decision.\""],"k":1,"e":"postponed = דחה; until more information = עד לאיסוף מידע נוס ,"df":"medium"},{"i":"rs55","t":"rst","q":"ORIGINAL: \"The medicine is effective against the virus, yet it carries significant risks for elderly patients.\"","o":["\"The drug works equally well for all age groups.\"","\"The risks outweigh the benefits for all patients.\"","\"While the drug treats the virus, it poses notable dangers to older individuals.\"","\"Elderly patients benefit more from the drug than younger patients.\""],"k":2,"e":"yet = ניגוד. יעיל ← אבל → סיכון לקשישים","df":"medium"},{"i":"rs56","t":"rst","q":"ORIGINAL: \"Only a fraction of applicants are selected for the highly competitive program.\"","o":["\"All qualified applicants are accepted into the program.\"","\"Most applicants are admitted to the competitive program.\"","\"The selection process accepts applicants without any competition.\"","\"A very small percentage of those who apply are ultimately chosen.\""],"k":3,"e":"only a fraction = רק חלק קטן = מיעוט מועמדים מתקבל","df":"medium"},{"i":"rs57","t":"rst","q":"ORIGINAL: \"Unless the team receives additional funding, the project will be cancelled.\"","o":["\"The project will proceed regardless of funding levels.\"","\"Additional funding has already been secured for the team.\"","\"The project's continuation depends on securing further financial support.\"","\"The team chose to cancel the project voluntarily.\""],"k":2,"e":"Unless = אלא אם כן. ללא מימון → ביטול","df":"medium"},{"i":"rs58","t":"rst","q":"ORIGINAL: \"Her reluctance to accept the position stemmed from concerns about the long commute.\"","o":["\"She eagerly accepted the job offer despite the travel time.\"","\"The commute was her primary reason for hesitating to take the job.\"","\"She was excited about the position but worried about salary.\"","\"The employer refused to accommodate her commuting concerns.\""],"k":1,"e":"reluctance stemmed from = חוסר רצון נבע מ = הסיבה להיסוס היא הנסיעה","df":"medium"},{"i":"rs59","t":"rst","q":"ORIGINAL: \"It is not inconceivable that the findings could reshape the entire field.\"","o":["\"It is impossible that the findings will have any impact.\"","\"The findings are completely unrelated to the field's development.\"","\"There is a genuine possibility that the results could fundamentally change the discipline.\"","\"Reshaping the field would be inconceivable under any circumstances.\""],"k":2,"e":"not inconceivable = לא בלתי ניתן לדמיון = אפשרי","df":"hard"},{"i":"rs60","t":"rst","q":"ORIGINAL: \"The administration touted the policy as a success, notwithstanding mounting evidence to the contrary.\"","o":["\"Evidence confirmed the administration's claims about the policy.\"","\"The policy was quietly dropped following critical evidence.\"","\"Despite increasing proof of failure, officials continued to celebrate the policy.\"","\"The administration acknowledged the evidence and reversed the policy.\""],"k":2,"e":"notwithstanding evidence to the contrary = למרות ראיות הפוכות = המשיכו לטעון להצלחה","df":"hard"},{"i":"rs61","t":"rst","q":"ORIGINAL: \"Scarcely a week passes without a new study questioning the effectiveness of the treatment.\"","o":["\"Weekly studies consistently confirm the treatment's effectiveness.\"","\"Research on the treatment's effectiveness is conducted rarely.\"","\"Almost every week, new research emerges that challenges how well the treatment works.\"","\"No studies have questioned the treatment's effectiveness.\""],"k":2,"e":"scarcely a week without = כמעט כל שבוע = תדיר מאוד","df":"hard"},{"i":"rs62","t":"rst","q":"ORIGINAL: \"Only by acknowledging the underlying causes can policymakers hope to develop lasting solutions.\"","o":["\"Solutions can be found without identifying the root causes.\"","\"Policymakers have already acknowledged and resolved the underlying issues.\"","\"Lasting solutions require that those in power first recognize the root causes.\"","\"Acknowledging causes is sufficient to solve the problem.\""],"k":2,"e":"Only by = רק על ידי. הכרה בסיבות = תנאי לפתרון","df":"hard"},{"i":"rs63","t":"rst","q":"ORIGINAL: \"The author's detractors claim her success owes more to marketing than to literary merit.\"","o":["\"The author's supporters argue that marketing is irrelevant to her success.\"","\"Critics say her commercial success is driven by promotion rather than the quality of her writing.\"","\"The author rejected marketing campaigns in favor of literary quality.\"","\"Marketing agencies credit the author's talent for boosting sales.\""],"k":1,"e":"detractors = מבקרים; owes more to marketing than merit = הצלחה שיווקית לא ספרותית","df":"hard"},{"i":"rs64","t":"rst","q":"ORIGINAL: \"The inspector found no evidence that was inconsistent with the initial report.\"","o":["\"The inspector discovered evidence contradicting the first report.\"","\"The inspector found no evidence of any kind.\"","\"All evidence uncovered was compatible with what the original report had stated.\"","\"The initial report was found to be entirely inaccurate.\""],"k":2,"e":"no evidence inconsistent with = לא מצא ראיות שסותרות = הכל תואם לדוח הראשון","df":"hard"},{"i":"rs65","t":"rst","q":"ORIGINAL: \"Although the intervention reduced crime rates in targeted areas, displacement effects were observed in neighboring zones.\"","o":["\"Crime rates decreased uniformly across all areas studied.\"","\"No measurable change in crime was detected in any area.\"","\"While the program succeeded locally, it pushed criminal activity into adjacent regions.\"","\"Neighboring zones benefited more from the intervention than targeted areas.\""],"k":2,"e":"Although = ניגוד. הצלחה מקומית ← אבל → דחיקת פשע לאזורים סמוכים","df":"hard"},{"i":"rs66","t":"rst","q":"ORIGINAL: \"The scientist spent three decades studying the migration patterns of monarch butterflies.\"","o":["\"The scientist studied butterflies for a short period.\"","\"Over thirty years, the researcher examined how monarch butterflies move.\"","\"Monarch butterflies studied the scientist's migration.\"","\"The scientist abandoned butterfly research after three decades.\""],"k":1,"e":"three decades = שלושים שנה; migration patterns = דפוסי נדידה","df":"easy"},{"i":"rs67","t":"rst","q":"ORIGINAL: \"The new regulation is not without merit.\"","o":["\"The regulation is entirely without merit.\"","\"Nobody supports the new regulation.\"","\"The regulation has some genuine value.\"","\"The regulation was created without any process.\""],"k":2,"e":"not without merit = יש לה ערך. שלילה כפולה = חיוב","df":"easy"},{"i":"rs68","t":"rst","q":"ORIGINAL: \"The film received rave reviews but failed to attract audiences.\"","o":["\"Critics and audiences both loved the film.\"","\"The film was both critically praised and commercially successful.\"","\"Although critics admired it, the film drew few viewers.\"","\"Neither critics nor audiences were impressed by the film.\""],"k":2,"e":"but = ניגוד. ביקורות מצוינות ← אבל → קהל קטן","df":"easy"},{"i":"rs69","t":"rst","q":"ORIGINAL: \"Provided that you submit your application on time, you will be considered.\"","o":["\"Late applications will be accepted without penalty.\"","\"You will only be considered if your application is submitted by the deadline.\"","\"Applications are considered regardless of when they are submitted.\"","\"Submitting early guarantees selection.\""],"k":1,"e":"Provided that = בתנאי ש = IF","df":"easy"},{"i":"rs70","t":"rst","q":"ORIGINAL: \"The museum exhibit was accessible to visitors of all ages.\"","o":["\"Only adults were permitted to visit the exhibit.\"","\"The exhibit was designed for children exclusively.\"","\"People of any age were able to enjoy the exhibit.\"","\"The exhibit required prior knowledge to be understood.\""],"k":2,"e":"accessible to all ages = זמין לכל הגילאים","df":"easy"},{"i":"rs71","t":"rst","q":"ORIGINAL: \"Nearly all participants completed the survey within ten minutes.\"","o":["\"All participants refused to complete the survey.\"","\"Most participants needed more than ten minutes.\"","\"The survey took the majority of participants approximately ten minutes or less.\"","\"Only a handful of participants finished the survey quickly.\""],"k":2,"e":"nearly all = כמעט כולם; within ten minutes = תוך עשר דקות","df":"easy"},{"i":"rs72","t":"rst","q":"ORIGINAL: \"The medication reduced symptoms quickly, though side effects were reported by some patients.\"","o":["\"The medication had no side effects.\"","\"No patients reported any reduction in symptoms.\"","\"While the drug worked fast, some people experienced adverse effects.\"","\"The medication was discontinued because of severe side effects.\""],"k":2,"e":"though = ניגוד. יעיל ← אבל → תופעות לוואי אצל כמה","df":"easy"},{"i":"rs73","t":"rst","q":"ORIGINAL: \"It is not unusual for first-year students to feel overwhelmed during exams.\"","o":["\"First-year students rarely feel stressed during exams.\"","\"Feeling overwhelmed during exams is a typical experience for new students.\"","\"Exam stress is unique to advanced students.\"","\"First-year students are always well-prepared for exams.\""],"k":1,"e":"not unusual = רגיל/שכיח. שלילה כפולה = חיוב","df":"easy"},{"i":"rs74","t":"rst","q":"ORIGINAL: \"While the government acknowledged the severity of the crisis, it offered no concrete solutions.\"","o":["\"The government denied the existence of a crisis.\"","\"The government proposed a detailed plan to address the crisis.\"","\"Although the authorities recognized how serious the situation was, they put forward no specific remedies.\"","\"The crisis was resolved because the government acknowledged it.\""],"k":2,"e":"While = ניגוד. הכרה בחומרה ← אבל → ללא פתרונות","df":"medium"},{"i":"rs75","t":"rst","q":"ORIGINAL: \"The policy was not without its unintended consequences.\"","o":["\"The policy produced exactly the intended outcomes.\"","\"No consequences resulted from the policy.\"","\"The policy generated effects that were not part of its original design.\"","\"The policy was designed specifically to cause disruption.\""],"k":2,"e":"not without unintended consequences = היו תוצאות לא מכוונות","df":"medium"},{"i":"rs76","t":"rst","q":"ORIGINAL: \"The vast majority of surveyed employees reported satisfaction with the new management structure.\"","o":["\"Almost no employees approved of the new management.\"","\"Employees were evenly split in their assessment of management.\"","\"An overwhelming proportion of workers expressed positive views about the restructuring.\"","\"A minority of employees were satisfied with the changes.\""],"k":2,"e":"vast majority = רוב עצום = מרבית העובדים היו שבעי רצון","df":"medium"},{"i":"rs77","t":"rst","q":"ORIGINAL: \"The deal will proceed only if all parties agree to the revised terms.\"","o":["\"The deal will go forward regardless of the parties' positions.\"","\"All parties have already agreed to the revised terms.\"","\"Agreement from every party on the updated conditions is the prerequisite for the deal to move forward.\"","\"The revised terms were rejected by all parties.\""],"k":2,"e":"only if = רק אם. הסכמה של כולם = תנאי להמשך","df":"medium"},{"i":"rs78","t":"rst","q":"ORIGINAL: \"Her reluctance to delegate authority contributed to the team's inefficiency.\"","o":["\"By delegating effectively, the leader improved team performance.\"","\"The team worked efficiently because the leader controlled all decisions.\"","\"Her unwillingness to share responsibility was a factor in the team's poor productivity.\"","\"Team members refused the authority offered to them.\""],"k":2,"e":"reluctance to delegate = חוסר רצון לאצול = תרם לחוסר יעילות","df":"medium"},{"i":"rs79","t":"rst","q":"ORIGINAL: \"The study's methodology was rigorous, yet its sample size was too small to be conclusive.\"","o":["\"The study was both methodologically sound and conclusive.\"","\"Poor methodology made the study's findings unreliable.\"","\"Although the research design was thorough, the limited number of participants prevented definitive conclusions.\"","\"A small sample size strengthened the study's conclusions.\""],"k":2,"e":"yet = ניגוד. מתודולוגיה חזקה ← אבל → מדגם קטן","df":"medium"},{"i":"rs80","t":"rst","q":"ORIGINAL: \"Barely any of the witnesses could describe the suspect accurately.\"","o":["\"All witnesses gave detailed and accurate descriptions.\"","\"Most witnesses provided useful descriptions of the suspect.\"","\"Almost none of those who saw the suspect were able to give a precise account of his appearance.\"","\"Witnesses refused to cooperate with the investigation.\""],"k":2,"e":"barely any = כמעט אף אחד לא","df":"medium"},{"i":"rs81","t":"rst","q":"ORIGINAL: \"Only by investing in early education can societies expect long-term economic benefits.\"","o":["\"Early education investment guarantees immediate economic returns.\"","\"Economic benefits can be achieved through various means, regardless of education.\"","\"Long-term economic gains require that societies prioritize investment in education at the earliest stages.\"","\"Early education is unnecessary for economic development.\""],"k":2,"e":"Only by = רק על ידי. השקעה בחינוך = תנאי לתוצאות ארוכות טווח","df":"medium"},{"i":"rs82","t":"rst","q":"ORIGINAL: \"The director's insistence on authenticity required months of additional research.\"","o":["\"The director ignored authenticity to save time.\"","\"The need for accuracy that the director demanded meant the project took significantly longer to prepare.\"","\"Months of research made authenticity unnecessary.\"","\"The additional research was considered excessive by the director.\""],"k":1,"e":"insistence on authenticity = דרישה לאותנטיות → חודשים של מחקר נוסף","df":"medium"},{"i":"rs83","t":"rst","q":"ORIGINAL: \"The attorney was not unconvinced by the evidence presented.\"","o":["\"The attorney found the evidence completely unconvincing.\"","\"The attorney had no opinion about the evidence.\"","\"The evidence made some impression on the attorney.\"","\"The attorney rejected the evidence as irrelevant.\""],"k":2,"e":"not unconvinced = לא לא משוכנע = כן משוכנע מעט. שלילה כפולה","df":"medium"},{"i":"rs84","t":"rst","q":"ORIGINAL: \"Although the initiative was well-funded, it failed to achieve its stated goals.\"","o":["\"The initiative succeeded due to its strong financial backing.\"","\"Insufficient funding was the primary reason for the initiative's failure.\"","\"Despite having adequate resources, the program did not accomplish what it set out to do.\"","\"The goals were achieved before the funding ran out.\""],"k":2,"e":"Although = ניגוד. מימון טוב ← אבל → כישלון להשיג מטרות","df":"medium"},{"i":"rs85","t":"rst","q":"ORIGINAL: \"The board did not dismiss the whistleblower's allegations without first conducting a thorough review.\"","o":["\"The board ignored the whistleblower's claims entirely.\"","\"A full investigation was carried out before the board decided what to do with the allegations.\"","\"The allegations were immediately dismissed as baseless.\"","\"The board rejected the whistleblower's claims after a brief review.\""],"k":1,"e":"not dismiss without first reviewing = לא דחה לפני בדיקה = בדקו תחילה","df":"hard"},{"i":"rs86","t":"rst","q":"ORIGINAL: \"The company's financial statements appeared healthy on the surface, yet concealed deep structural problems.\"","o":["\"The company's financial health was accurately reflected in its statements.\"","\"The structural problems were clearly disclosed in the financial reports.\"","\"Despite a favorable outward appearance, the company's finances masked serious underlying weaknesses.\"","\"The structural problems caused the financial statements to appear unhealthy.\""],"k":2,"e":"yet concealed = ניגוד. נראה בריא ← אבל → הסתיר בעיות עמוקות","df":"hard"},{"i":"rs87","t":"rst","q":"ORIGINAL: \"Scarcely a single dissenting voice was raised against the proposal during the committee meeting.\"","o":["\"Committee members vocally opposed the proposal.\"","\"A significant minority objected to the proposal during deliberations.\"","\"Almost no yal of him as volatile and dangerous.\"","o":["\"The defendant behaved erratically, confirming the prosecution's characterization.\"","\"The prosecution described the defendant as calm and composed.\"","\"The defendant's calm behavior during proceedings contradicted how the prosecution had described his personality.\"","\"Both sides agreed on the defendant's temperament.\""],"k":2,"e":"stood in stark contrast = עמד בניגוד חד. רגוע ← בניגוד ל → תיאור כנפיץ","df":"hard"},{"i":"rs92","t":"rst","q":"ORIGINAL: \"A negligible proportion of the budget was allocated to preventive health measures.\"","o":["\"Most of the health budget was directed toward prevention.\"","\"A large share of resources went toward preventive healthcare.\"","\"An insignificantly small percentage of funding was assigned to preventing illness.\"","\"The budget gave equal weight to preventive and reactive health spending.\""],"k":2,"e":"negligible proportion = חלק זניח = אחוז קטן מאוד","df":"hard"},{"i":"rs93","t":"rst","q":"ORIGINAL: \"Had the early warning signs been heeded, the collapse might have been averted.\"","o":["\"The collapse was inevitable regardless of any warning signs.\"","\"The warning signs were ignored but had no effect on the outcome.\"","\"If the initial indicators had been taken seriously, the disaster could potentially have been prevented.\"","\"The warning signs were misinterpreted as signs of stability.\""],"k":2,"e":"Had ... been heeded = אילו ... שמו לב = תנאי עבר בלתי אפשרי","df":"hard"},{"i":"rs94","t":"rst","q":"ORIGINAL: \"The prime minister's statement was deliberately vague, leaving room for multiple interpretations.\"","o":["\"The prime minister's statement was precise and left no room for doubt.\"","\"The vague statement caused immediate panic among investors.\"","\"The premier intentionally chose ambiguous language, allowing the statement to be understood in more than one way.\"","\"Multiple interpretations made the statement impossible to act upon.\""],"k":2,"e":"deliberately vague = מכוון להיות מעורפל = השאיר מקום לפרשנויות","df":"hard"},{"i":"rs95","t":"rst","q":"ORIGINAL: \"The panel found no reason to doubt that the data was collected without bias.\"","o":["\"The panel concluded that the data was biased.\"","\"The panel raised serious doubts about the integrity of the data.\"","\"According to the panel, the data appeared to have been gathered objectively.\"","\"Bias in data collection was the panel's primary concern.\""],"k":2,"e":"no reason to doubt = אין סיבה לפקפק = הנתונים נאספו ללא הטיה","df":"hard"},{"i":"rs96","t":"rst","q":"ORIGINAL: \"Despite its global reach, the organization struggled to maintain coherent messaging across its many regional offices.\"","o":["\"The organization's global presence enabled consistent communication across all offices.\"","\"Regional offices had no difficulty aligning with the organization's central messaging.\"","\"Although the organization operated internationally, it found it hard to keep its communication consistent in different locations.\"","\"The organization reduced its global reach to improve messaging coherence.\""],"k":2,"e":"Despite global reach = למרות הנוכחות הגלובלית ← אבל → קושי בעקביות","df":"hard"},{"i":"rs97","t":"rst","q":"ORIGINAL: \"Only a fraction of the land designated for conservation has actually been protected.\"","o":["\"All land designated for conservation is fully protected.\"","\"A large portion of conservation land has received adequate protection.\"","\"The actual level of protection given to conservation areas falls far short of what was officially designated.\"","\"Conservation land requires no active protection measures.\""],"k":2,"e":"only a fraction = רק חלק קטן מהשטח שיועד לשימור אכן הוגן","df":"hard"},{"i":"msc1","t":"mo","q":"The new regulation was met with _____ response from the business community, which had not been consulted.","o":["expected","unexpected","popular","professional"],"k":1,"e":"\"un-\" = שלילה. \"had not been consulted\" = לא :"msc149","t":"mo","q":"The ___ of the contract was a surprise to everyone.","o":["terminal","termination","terminator","terminate"],"k":1,"e":"שם עצם: termination = סיום.","df":"medium"},{"i":"msc150","t":"mo","q":"He was punished for his ___ behavior at the meeting.","o":["disruption","disruptive","disrupt","disruptively"],"k":1,"e":"תואר: disruptive = מפריע.","df":"medium"},{"i":"msc151","t":"mo","q":"The doctor's ___ was reassuring to the family.","o":["calmness","calm","calmly","calmer"],"k":0,"e":"שם עצם: calmness = שלווה.","df":"easy"},{"i":"msc152","t":"mo","q":"The ___ of the city's water supply is a serious health risk.","o":["polluter","pollution","pollute","polluted"],"k":1,"e":"שם עצם: pollution = זיהום.","df":"easy"},{"i":"msc153","t":"mo","q":"The ___ student impressed all of her teachers.","o":["diligent","dilute","diligently","diligence"],"k":0,"e":"תואר: diligent = חרוץ.","df":"easy"},{"i":"msc154","t":"mo","q":"Making ___ decisions under pressure is a skill.","o":["rationale","rationally","rational","ration"],"k":2,"e":"תואר: rational = רציונלי.","df":"easy"},{"i":"msc155","t":"mo","q":"The ___ weather ruined the harvest.","o":["seasoned","seasonal","unseasonable","season"],"k":2,"e":"un- = לא; מזג אוויר שאינו מתאים לעונה.","df":"hard"},{"i":"msc156","t":"mo","q":"The two leaders held a ___ meeting to discuss trade.","o":["cord","cordial","cordially","cordless"],"k":1,"e":"תואר: cordial = לבבי.","df":"medium"},{"i":"rc4a","t":"rc","q":"According to the passage, what did Herbert Simon predict?","o":["Digital platforms would disappear","Information abundance would make attention scarce","Attention would become cheaper over time","Organizations would ignore information"],"k":1,"e":"בפסקה הראשונה: wealth of information creates a poverty of attention.","df":"easy","pid":"p4"},{"i":"rc4b","t":"rc","q":"The word \"prophetic\" in the first paragraph most nearly means:","o":["Religiously motivated","Widely ignored","Accurately foretelling the future","Unne ","Young athletes","Construction workers only"],"k":1,"e":"פסקה 2.","df":"easy","pid":"p5"},{"i":"rc5d","t":"rc","q":"The word \"outweigh\" in the last sentence implies that:","o":["The costs equal the benefits","The measures have failed","The benefits are greater than the costs","The measures are free"],"k":2,"e":"outweigh = עולים על.","df":"medium","pid":"p5"},{"i":"rc5e","t":"rc","q":"The passage can best be described as:","o":["An explanation of a problem and proposed solutions","A scientific experiment report","A criticism of urban planners","A history of city design"],"k":0,"e":"בעיה (1), השלכות (2), פתרונות (3).","df":"medium","pid":"p5"},{"i":"rc6a","t":"rc","q":"Why does the passage mention names for local plants and traditional medicine?","o":["To illustrate the knowledge lost when a language dies","To argue against modern medicine","To explain how languages are written","To show that plants are rare"],"k":0,"e":"פסקה 1: דוגמאות לידע ייחודי שנעלם.","df":"medium","pid":"p6"},{"i":"rc6b","t":"rc","q":"According to some scholars, why do speakers abandon smaller languages?","o":["They dislike their traditions","They are forced by law","Dominant languages offer better education and jobs","Smaller languages are harder to learn"],"k":2,"e":"פסקה 2.","df":"easy","pid":"p6"},{"i":"rc6c","t":"rc","q":"The word \"futile\" in the second paragraph most nearly means:","o":["Costly","Dangerous","Popular","Pointless"],"k":3,"e":"futile = חסר תועלת.","df":"medium","pid":"p6"},{"i":"rc6d","t":"rc","q":"What does the example of Hebrew demonstrate?","o":["Governments should avoid language policy","Languages never die","A language can be revived when communities commit to it","Hebrew is easier than other languages"],"k":2,"e":"פסקה 3.","df":"medium","pid":"p6"},{"i":"rc6e","t":"rc","q":"Which statement would the author most likely agree with?","o":["Language loss is always harmless","Revival succeeds quickly","Revival is difficult but achievable with sustained effort","Only governments can save languages"],"k":2,"e":"success demands decades of sustained effort.","df":"hard","pid":"p6"}],"p":{"p1":{"title":"The Psychology of Procrastination","text":"Procrastination — the act of delaying or postponing tasks despite knowing that doing so will have negative consequences — is one of the most universally human experiences. While most people procrastinate occasionally, research suggests that approximately 20 percent of adults identify as chronic procrastinators, meaning the behavior significantly disrupts their daily lives and long-term goals.\n\nContrary to popular belief, procrastination is not simply a matter of poor time management or laziness. Psychologists increasingly frame it as an emotion regulation problem. When a task generates feelings of anxiety, boredom, self-doubt, or frustration, the human brain naturally seeks relief by directing attention elsewhere. Short-term mood repair — browsing social media, watching television, or engaging in any number of pleasant distractions — takes precedence over long-term productivity. The procrastinator is not choosing to be inefficient; rather, they are choosing immediate emotional comfort over future benefit.\n\nThis perspective helps explain why motivational approaches often fail. Telling chronic procrastinators to \"just start\" or reminding them of deadlines increases the emotional discomfort associated with the task, potentially making avoidance even more tempting. More effective strategies focus instead on reducing the emotional barriers. Breaking tasks into smaller, less threatening components, practicing self-compassion rather than harsh self-criticism, and creating environments with fewer competing distractions have all been shown to reduce procrastination behavior.\n\nRecent neuroimaging studies have added a biological dimension to this understanding. Researchers have observed that individuals who procrastinate more tend to have a larger amygdala — the brain region responsible for processing emotions and perceived threats — and weaker connections between the amygdala and the regions of the brain responsible for action and decision-making. This structural difference may make it harder for some people to override the impulse to avoid discomfort, suggesting that procrastination has genuine neurological roots rather than being a simple character flaw.\n\nUnderstanding procrastination in this nuanced way carries important implications. It shifts responsibility from moral failure to psychological and neurological reality, opening the door to more compassionate and evidence-based interventions."},"p2":{"title":"The Rise and Fall of the Aral Sea","text":"Once the fourth largest lake in the world, the Aral Sea, located between Kazakhstan and Uzbekistan, has undergone one of the most dramatic environmental transformations in recorded history. In the 1960s, Soviet central planners made the fateful decision to divert the two rivers that fed the sea — the Amu Darya and the Syr Darya — to irrigate vast cotton fields across Central Asia. The economic rationale was straightforward: cotton was a valuable export crop, and the region's flat terrain and abundant sunshine made it ideal for cultivation. What the planners failed to adequately consider were the long-term consequences of severing the sea from its primary water sources.\n\nThe results were catastrophic. By the 1980s, the sea had shrunk to roughly half its original surface area. By 2007, it had declined to only 10 percent of its former size, splitting into several disconnected smaller lakes. The fishing industry, which had once supported some 60,000 jobs and produced over 40,000 tons of fish annually, was completely destroyed. Rusting fishing boats became an eerie landmark in what had become a vast salt desert — a haunting symbol of one of the greatest ecological disasters of the 20th century.\n\nThe environmental consequences extended far beyond the loss of the fisheries. As the water retreated, it exposed the lakebed, which had accumulated decades of agricultural runoff containing pesticides, fertilizers, and heavy metals. Winds picked up this toxic residue and carried it across the region, contaminating soil and water for hundreds of kilometers. Rates of respiratory illness, cancer, and infant mortality in surrounding communities increased dramatically. The local climate also shifted, with summers becoming hotter and winters colder, as the sea's moderating influence disappeared.\n\nInternational efforts to restore the Aral Sea have achieved only partial success. Kazakhstan constructed the Kokaral Dam in 2005, partially restoring the smaller northern section of the sea. Water levels rose, salinity decreased, and fish populations began to return in that portion. However, the much larger southern section, primarily within Uzbekistan, has shown no comparable recovery and may be permanently lost. The case of the Aral Sea stands as one of the most instructive examples of how large-scale human intervention in natural systems, without adequate foresight, can produce irreversible and wide-reaching harm."},"p3":{"title":"Behavioral Economics and the Limits of Rational Choice","text":"Classical economic theory rests on a deceptively simple assumption: that human beings are rational actors who consistently make decisions that maximize their own welfare. This model, often called Homo Economicus, treats people as dispassionate calculators, weighing costs and benefits with mathematical precision before selecting the optimal course of action. For much of the 20th century, this framework dominated economic thought and shaped policy decisions across the globe.\n\nBeginning in the 1970s, however, psychologists Daniel Kahneman and Amos Tversky began publishing a series of studies that systematically challenged this premise. Their research demonstrated that human decision-making is riddled with predictable cognitive biases — consistent patterns of irrational behavior that deviate from what economic theory would predict. One of their most influential findings concerned what they called \"loss aversion\": the tendency for people to feel the pain of losing something approximately twice as intensely as they feel the pleasure of gaining something equivalent. Individuals will go to extraordinary lengths to avoid a loss that they would not make comparable efforts to achieve an equivalent gain.\n\nAnother major finding was the \"framing effect\" — the discovery that people's choices are powerfully influenced by how options are presented, rather than solely by the objective features of those options. In one classic experiment, participants were far more likely to choose a medical procedure described as having a \"90 percent survival rate\" than one described as having a \"10 percent mortality rate,\" even though the two descriptions are mathematically identical. The implication is uncomfortable: rational deliberation is perpetually vulnerable to superficial changes in language and presentation.\n\nThese discoveries gave birth to the field of behavioral economics, which seeks to incorporate realistic models of human psychology into economic analysis. Perhaps its most influential practical application has been the concept of \"nudging\" — designing choice architectures that guide people toward better decisions without restricting their freedom to choose otherwise. Placing healthier food options at eye level in a cafeteria, or making pension enrollment automatic rather than opt-in, exploits cognitive tendencies in ways that improve outcomes without coercion.\n\nCritics have raised important concerns about the nudging approach. Some argue that it is inherently paternalistic, assuming that policymakers know better than individuals what constitutes a good decision. Others worry about the potential for nudges to be exploited by corporations or governments for purposes that do not align with citizens' genuine interests. The debate reflects a fundamental tension in behavioral economics: the field is built on evidence that people are not fully rational, but must also grapple with the question of who has the authority and legitimacy to guide those imperfect judgments."},"p4":{"title":"The Economics of Attention","text":"In a world where information is abundant, attention has become the scarce resource. Economist Herbert Simon observed as early as 1971 that a wealth of information creates a poverty of attention, and he warned that organizations would need to allocate this limited resource carefully. Today, that warning seems prophetic. Digital platforms compete fiercely for the few seconds a user is willing to give, and many of them design their products to be as difficult to put down as possible.\n\nCritics argue that this competition does not merely waste time; it reshapes habits. Notifications, endless scrolling and autoplay features exploit psychological tendencies that evolved in a very different environment. Defenders of the industry reply that users remain free to leave at any moment, and that the same technologies connect people and spread knowledge at unprecedented speed.\n\nMost researchers occupy a middle ground. They accept that the tools are valuable but insist that the burden should not fall entirely on individuals. Just as food labels help consumers resist overeating, they suggest, transparent design standards could help users manage their own attention. Whether such regulation is practical, however, remains an open question."},"p5":{"title":"Why Cities Grow Hotter","text":"Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. Dark surfaces such as asphalt and rooftops absorb sunlight during the day and release it slowly at night, so the city never fully cools. In addition, the lack of vegetation reduces the natural cooling that occurs when plants release water vapor.\n\nThe consequences extend beyond discomfort. Higher temperatures raise electricity demand for air conditioning, which in turn increases emissions and worsens air quality. Elderly residents and people with chronic illness are especially vulnerable during heat waves, and studies link extreme urban heat to higher hospital admissions.\n\nPlanners have responded with several strategies. Reflective roofing materials send sunlight back into the atmosphere, while parks and street trees provide shade and moisture. Some cities have gone further, painting roads light colors or creating green roofs. Although these measures are not cheap, supporters argue that the long-term savings in energy and health costs outweigh the initial investment."},"p6":{"title":"The Fate of Dead Languages","text":"Of the roughly seven thousand languages spoken today, linguists estimate that nearly half could disappear by the end of the century. When the last fluent speaker of a language dies, a unique way of describing the world vanishes with them, including names for local plants, traditional medicine and oral histories that were never written down.\n\nSome scholars argue that this loss is a natural consequence of social change. Speakers abandon smaller languages for dominant ones because they offer better access to education and employment. From this perspective, preservation efforts may seem sentimental, even futile.\n\nHowever, recent revival projects suggest otherwise. Hebrew, once confined to prayer and scholarship, became a living national language within a few generations. Welsh and Maori have similarly regained speakers through immersion schools and public support. These examples show that decline is not inevitable when communities and governments commit resources, though success demands decades of sustained effort."}},"tips":[{"title":"שלילה כפולה","body":"\"Not without merit\" = יש ערך. שני שלילות = חיוב!"},{"title":"מסיחים פונטיים","body":"\"Mitigate\" vs \"Migrate\" -- נשמע דומה, משמעות שונה לגמרי."},{"title":"הקשר מכריע","body":"בהשלמת משפטים, חפש מילות ניגוד (although, despite) ומילות חיזוק (since, because)."},{"title":"Only if / Unless","body":"\"Only if X, Y\" = Y לא יקרה בלי X. \"Unless X, Y\" = אם X לא קורה, Y יקרה."},{"title":"None but / Scarcely","body":"\"None but the best\" = רק הטובים ביותר. \"Scarcely any\" = כמעט אף אחד."},{"title":"אסטרטגיית ביטול","body":"תחילה בטל תשובות ברורות שאינן נכונות. בדרך כלל ישארו 2 אפשרויות."},{"title":"For all its / Despite","body":"\"For all its flaws\" = למרות כל פגמיו. הפסקה עוברת לחיובי לאחר מכן."},{"title":"מורפמות: un-, in-, dis-","body":"מילה עם un/in/dis = שלילה. \"Unprecedented\" = חסר תקדים."}]};
const W=D.w,P=D.p,QS=D.q,$=s=>document.querySelector(s);
const WM={},WID={};W.forEach(w=>{WM[w.w.toLowerCase()]=w;WID[w.id]=w});
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mem={};let STOK=true;
const ST={g(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
try{localStorage.setItem('ep_t','1');STOK=localStorage.getItem('ep_t')==='1'}catch(e){STOK=false}
const fresh=()=>({cards:{},hist:[],streak:0,last:'',day:'',dn:0,sims:[],hard:{},wrong:{},seen:{}});
let S;try{S=JSON.parse(ST.g('ep14'))}catch(e){}
S=Object.assign(fresh(),S||{});
const save=()=>ST.s('ep14',JSON.stringify(S));
const td=()=>new Date().toDateString();
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const WT={easy:1,medium:1.5,hard:2};
const TN={sc:'השלמת משפטים',rst:'ניסוח מחדש',rc:'הבנת הנקרא',mo:'מבנה מילה'};
const DN={easy:'קל',medium:'בינוני',hard:'קשה'};
const TYPES=[['sc','השלמת משפטים','✍️'],['rst','ניסוח מחדש','🔁'],['rc','הבנת הנקרא','📖'],['mo','מבנה מילה','🔤'],['all','מעורב','🎲']];
let TMR,VQ=[],VI=0;
function V(h,keep){const m=$('#m'),y=m.scrollTop;m.innerHTML=h;m.scrollTop=keep?y:0}
function go(f){clearInterval(TMR);f()}
function nav(a){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.a===a))}
function ask(msg,yes,no){V(`<div class=card style="line-height:1.6">${msg}</div><button class=btn id=ay>כן</button><button class="btn s" id=an>ביטול</button>`);$('#ay').onclick=yes;$('#an').onclick=no}
function tick(){if(S.day!==td()){S.day=td();S.dn=0}S.dn++;if(S.last!==td()){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=td()}}
function streak(){const y=new Date(Date.now()-864e5).toDateString();return S.last===td()||S.last===y?S.streak:0}
function est(){const h=S.hist.slice(-80);if(h.length<10)return null;let a=0,b=0;h.forEach(r=>{const w=WT[r.d]||1.5;b+=w;if(r.ok)a+=w});return Math.round(50+100*a/b)}
function theme(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;ST.s('ep_th',t)}
const cnt=o=>Object.keys(o).length;

/* ---- מילים קשות ---- */
function qWord(q){if(q.t==='vq')return WID[q.wid];if(q.t!=='sc'&&q.t!=='mo')return null;return WM[String(q.o[q.k]||'').toLowerCase().trim()]||null}
function addHard(w,manual){const h=S.hard[w.id]||{n:0,ok:0};h.n++;h.ok=0;h.t=Date.now();if(manual)h.m=1;S.hard[w.id]=h}
function easeHard(w){const h=S.hard[w.id];if(!h)return;h.ok=(h.ok||0)+1;if(h.ok>=3&&!h.m)delete S.hard[w.id]}
function hardList(){return Object.keys(S.hard).map(id=>({w:WID[id],h:S.hard[id]})).filter(x=>x.w).sort((a,b)=>b.h.n-a.h.n||(b.h.t||0)-(a.h.t||0))}
function wq(w){const seen=new Set([w.d]),ds=[];for(const x of shuf(W.filter(z=>z.id!==w.id&&z.p===w.p)).concat(shuf(W))){if(ds.length>=3)break;if(x.id!==w.id&&!seen.has(x.d)){seen.add(x.d);ds.push(x.d)}}const o=shuf([w.d,...ds]);return{i:'vq_'+w.id,t:'vq',wid:w.id,q:'מה פירוש המילה: '+w.w+' ?',o,k:o.indexOf(w.d),e:w.w+' = '+w.d+(w.n?' · '+w.n:''),df:'medium'}}

/* ---- רישום תשובה ---- */
function rec(q,ok){
 const w=qWord(q);let note='';
 if(q.t==='vq'){if(w){if(ok)easeHard(w);else{addHard(w)}}tick();save();return ''}
 S.hist.push({t:q.t,ok:ok?1:0,d:q.df,i:q.i});if(S.hist.length>1000)S.hist.shift();
 S.seen[q.i]=(S.seen[q.i]||0)+1;
 if(!ok){const x=S.wrong[q.i]||{n:0};x.n++;x.s=0;S.wrong[q.i]=x;if(w){addHard(w);note=w.w}}
 else{const x=S.wrong[q.i];if(x){x.s=(x.s||0)+1;if(x.s>=2)delete S.wrong[q.i]}if(w)easeHard(w)}
 tick();save();return note}
function prio(pool,n){return pool.map(q=>[(S.wrong[q.i]?2:0)+(S.seen[q.i]?0:1)+Math.random()*.9,q]).sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1])}
function weak(){return TYPES.slice(0,4).map(t=>{const r=S.hist.filter(x=>x.t===t[0]),o=r.filter(x=>x.ok).length;return{t:t[0],label:t[1],ok:o,n:r.length,acc:r.length?o/r.length:null}}).filter(x=>x.n>=5).sort((a,b)=>a.acc-b.acc)}
function rowH(l,o,t,warn){return `<div style="margin:11px 0"><div style="display:flex;justify-content:space-between"><span>${l}${warn?' <span class="tag r">לשיפור</span>':''}</span><span class=mu>${o}/${t}${t?' · '+Math.round(o/t*100)+'%':''}</span></div><div class=bar><i style="width:${t?o/t*100:0}%;${warn?'background:var(--red)':''}"></i></div></div>`}

/* ---- בית ---- */
function home(){nav('home');const now=Date.now(),due=W.filter(w=>S.cards[w.id]&&S.cards[w.id].due<=now).length,e=est(),dn=S.day===td()?S.dn:0,k=Math.floor(now/864e5),wod=W[k%W.length],tip=D.tips[k%D.tips.length],wk=weak(),hn=hardList().length,wn=cnt(S.wrong);
V(`${STOK?'':'<div class=warn>⚠️ הדפדפן חוסם שמירה, ההתקדמות לא תישמר. פתח את האפליקציה ב-Safari רגיל או מהאייקון במסך הבית.</div>'}
<div class=card style="background:linear-gradient(135deg,#0b3d3a,#12305e);color:#fff;border:0"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="opacity:.75;font-size:13px">היי סהר 👋</div><h2 style="margin:2px 0">English Pro · אמירנט</h2></div><button class=x onclick="theme()">◐</button></div>
<div style="display:flex;gap:8px;margin-top:10px"><span class=pill>🔥 ${streak()} ימים</span><span class=pill>ציון משוער: ${e??'—'}</span></div>
<div style="opacity:.8;font-size:12px;margin:12px 0 5px">יעד יומי: ${Math.min(dn,10)}/10</div><div class=bar><i style="width:${Math.min(100,dn*10)}%"></i></div></div>
${wk.length&&wk[0].acc<.8?`<div class=card onclick="startP('${wk[0].t}')"><small>🎯 הכי כדאי לשפר</small><div style="font-weight:800;margin-top:3px">${wk[0].label} · דיוק ${Math.round(wk[0].acc*100)}%</div><div class=mu>לחץ לתרגול ממוקד</div></div>`:''}
<div class=g>
<div class=card onclick="go(vocab)"><div style="font-size:28px">📚</div><b>מילים</b><small>${due?due+' לחזרה':W.length+' מילים'}</small></div>
<div class=card onclick="go(prac)"><div style="font-size:28px">✏️</div><b>תרגול</b><small>${QS.length} שאלות</small></div>
<div class=card onclick="go(sim)"><div style="font-size:28px">⚡</div><b>סימולציה</b><small>23 שאלות · 30 דק׳</small></div>
<div class=card onclick="startP('mo')"><div style="font-size:28px">🔤</div><b>מבנה מילה</b><small>תחיליות וסיומות</small></div>
<div class=card onclick="go(hardw)"><div style="font-size:28px">🔥</div><b>מילים קשות</b><small>${hn} שמורות</small></div>
<div class=card onclick="startW()"><div style="font-size:28px">❗</div><b>שאלות שטעית</b><small>${wn} לחזרה</small></div></div>
<div class=card><small>💡 מילה יומית</small><div style="font-size:24px;font-weight:900;color:var(--teal);direction:ltr;text-align:left;margin:4px 0">${esc(wod.w)}</div><div class=mu>${esc(wod.d)}</div></div>
<div class=card><b>${esc(tip.title)}</b><div class=mu style="margin-top:4px;font-size:13px">${esc(tip.body)}</div></div>`)}

/* ---- מילים ---- */
function vocab(){nav('vocab');const now=Date.now(),due=W.filter(w=>S.cards[w.id]&&S.cards[w.id].due<=now).slice(0,30),nw=W.filter(w=>!S.cards[w.id]).slice(0,10),L=Object.values(S.cards).filter(c=>c.iv>=1).length,hn=hardList().length;
VQ=[...due,...nw];VI=0;
V(`<h2>מילים</h2><div class=card><div class=num>${L}<small> / ${W.length}</small></div><div class=mu>מילים שנלמדו</div><div class=bar style="margin-top:8px"><i style="width:${L/W.length*100}%"></i></div></div>
<div class=card>לחזרה עכשיו: <b>${due.length}</b> · חדשות: <b>${nw.length}</b></div>
${VQ.length?'<button class=btn onclick="card()">התחל ללמוד</button>':'<div class=card>סיימת הכל כרגע 🎉</div>'}
<button class="btn s" onclick="go(hardw)">🔥 מילים קשות (${hn})</button>`)}
function card(){if(VI>=VQ.length)return vocab();const w=VQ[VI],ex=w.x&&!/is an important vocabulary word/.test(w.x),hd=!!S.hard[w.id];
V(`<div class=top><button class=x onclick="go(vocab)">✕</button><div class=bar><i style="width:${VI/VQ.length*100}%"></i></div></div>
<div class="card fc" id=fc><div class=w>${esc(w.w)}</div><div class=mu>${esc(w.p)}</div>
<div id=bk style="display:none;margin-top:14px"><div style="font-size:22px;font-weight:800">${esc(w.d)}</div>${ex?`<div class=mu dir=ltr style="margin-top:8px">${esc(w.x)}</div>`:''}${w.m?`<div class=mu style="margin-top:6px">🧩 ${esc(w.m)}</div>`:''}${w.n?`<div class=mu style="margin-top:6px">💭 ${esc(w.n)}</div>`:''}</div>
<div class=mu id=hint style="margin-top:18px">לחץ כדי לראות תרגום</div>
<button class="star ${hd?'on':''}" id=st>${hd?'⭐ במילים קשות':'☆ סמן כמילה קשה'}</button></div>
<div class=row id=rt style="display:none"><button class="btn s" onclick="rate(0)">שוב</button><button class=btn onclick="rate(1)">טוב</button><button class="btn s" onclick="rate(2)">קל</button></div>`);
$('#fc').onclick=()=>{$('#bk').style.display='block';$('#hint').style.display='none';$('#rt').style.display='flex'};
$('#st').onclick=ev=>{ev.stopPropagation();const b=$('#st');if(S.hard[w.id]){delete S.hard[w.id];b.classList.remove('on');b.textContent='☆ סמן כמילה קשה'}else{addHard(w,true);b.classList.add('on');b.textContent='⭐ במילים קשות'}save()}}
function rate(r){const w=VQ[VI],c=S.cards[w.id]||{ef:2.5,iv:0,due:0,reps:0};
if(r===0){c.iv=0;c.ef=Math.max(1.3,c.ef-.2);c.due=Date.now()+6e5;VQ.push(w);addHard(w)}
else{c.iv=c.iv<1?(r===2?3:1):Math.round(c.iv*c.ef*(r===2?1.4:1));if(r===2)c.ef+=.1;c.due=Date.now()+c.iv*864e5;c.reps++;easeHard(w)}
S.cards[w.id]=c;tick();save();VI++;card()}
function hardw(){nav('vocab');const hs=hardList();
V(`<div class=top><button class=x onclick="go(vocab)">→</button><h2 style="margin:0">מילים קשות (${hs.length})</h2></div>
<div class=card><small>מילים שטעית בהן בתרגול או במבחן, מילים שדירגת "שוב", ומילים שסימנת ⭐. מילה שנוספה אוטומטית יוצאת מהרשימה אחרי 3 תשובות נכונות. מילה שסימנת ידנית נשארת עד שתסיר אותה.</small></div>
${hs.length?`<div class=row><button class=btn onclick="hardCards()">כרטיסיות</button><button class="btn s" onclick="hardQuiz()">חידון</button></div>`:'<div class=card>עוד אין מילים קשות 🎉</div>'}
<div style="height:10px"></div>
${hs.map(x=>`<div class=card style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div dir=ltr style="font-weight:800;color:var(--teal);font-size:18px;text-align:left">${esc(x.w.w)}${x.h.m?' ⭐':''}</div><div class=mu>${esc(x.w.d)}</div></div><div style="text-align:center;flex:none"><small>טעויות</small><div style="font-weight:800;margin-bottom:6px">${x.h.n}</div><button class=x onclick="rmHard('${x.w.id}')">✕</button></div></div>`).join('')}`)}
function rmHard(id){delete S.hard[id];save();hardw()}
function hardCards(){VQ=shuf(hardList().map(x=>x.w));VI=0;card()}
function hardQuiz(){quiz(shuf(hardList().map(x=>x.w)).slice(0,15).map(wq),false)}

/* ---- תרגול ---- */
function prac(){nav('prac');V(`<h2>תרגול</h2><div class=g>${TYPES.map(t=>`<div class=card onclick="startP('${t[0]}')"><div style="font-size:28px">${t[2]}</div><b>${t[1]}</b><small>${t[0]==='all'?QS.filter(q=>q.t!=='rc').length:QS.filter(q=>q.t===t[0]).length} שאלות</small></div>`).join('')}<div class=card onclick="startW()"><div style="font-size:28px">❗</div><b>שאלות שטעית</b><small>${cnt(S.wrong)} לחזרה</small></div></div><div class=mu>10 שאלות בכל סבב · שאלות שטעית בהן וכאלו שעוד לא ראית מופיעות קודם</div>`)}
function startP(t){nav('prac');let l;
if(t==='rc'){const ids=Object.keys(P),pid=ids.map(id=>[QS.filter(q=>q.pid===id&&S.wrong[q.i]).length+Math.random(),id]).sort((a,b)=>b[0]-a[0])[0][1];l=QS.filter(q=>q.pid===pid)}
else l=prio(t==='all'?QS.filter(q=>q.t!=='rc'):QS.filter(q=>q.t===t),10);
quiz(l,false)}
function startW(){nav('prac');const l=QS.filter(q=>S.wrong[q.i]);if(!l.length)return V(`<h2>שאלות שטעית</h2><div class=card>אין כרגע שאלות לחזרה 🎉<br><span class=mu>שאלות שתטעה בהן יישמרו כאן. שאלה יוצאת מהרשימה אחרי 2 תשובות נכונות ברצף.</span></div><button class=btn onclick="go(prac)">חזרה לתרגול</button>`);quiz(shuf(l).slice(0,10),false)}
function sim(){nav('sim');const b=S.sims.length?Math.max(...S.sims.map(s=>s.sc)):null;V(`<h2>סימולציית מבחן</h2><div class=card>23 שאלות · 30 דקות · הסברים רק בסוף, עם סקירה של כל השאלות והתשובות.<br><span class=mu>מבנה משוער בהשראת אמירנט, לא מבחן רשמי. הציון הוא הערכה גסה בלבד.</span></div>${b?`<div class=card>הציון הטוב ביותר: <b>${b}</b> · מבחנים: ${S.sims.length}</div>`:''}${S.sims.slice(-3).reverse().map(s=>`<div class=card>${esc(s.d)} · ציון ${s.sc} · ${s.ok}/${s.n}</div>`).join('')}<button class=btn onclick="startS()">התחל מבחן ⚡</button>`)}
function startS(){const by=(t,n)=>shuf(QS.filter(q=>q.t===t)).slice(0,n),pid=shuf(Object.keys(P))[0];quiz([...by('sc',10),...by('rst',4),...by('mo',4),...QS.filter(q=>q.pid===pid)],true)}

/* ---- סקירת שאלה ---- */
function rev(r,x){const q=r.q,pa=q.pid?P[q.pid]:null;
return `<div class=card><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap"><b>${x+1}.</b><span class="tag ${r.ok?'g':'r'}">${r.skip?'לא נענתה':r.ok?'נכון':'שגוי'}</span><span class=mu>${TN[q.t]||'חידון מילים'}${q.df&&q.t!=='vq'?' · '+DN[q.df]:''}</span></div>
${pa?`<details style="margin-bottom:8px"><summary class=mu>📖 ${esc(pa.title)} · הצג את הקטע</summary><div class=pass dir=auto style="margin-top:6px">${esc(pa.text)}</div></details>`:''}
<div class=q2 dir=auto>${esc(q.q)}</div>
${q.o.map((o,j)=>{const c=j===q.k?'good':(o===r.pick&&!r.ok?'bad':'');return `<div class="ro ${c}" dir=auto>${j===q.k?'✔ ':c==='bad'?'✖ ':''}${esc(o)}${c==='bad'?' <small>(התשובה שלך)</small>':''}</div>`}).join('')}
${r.skip?'<div class=mu>לא הספקת לענות על שאלה זו</div>':''}
${q.e?`<div class=mu style="margin-top:8px;line-height:1.5">💡 ${esc(q.e)}</div>`:''}</div>`}

/* ---- חידון / מבחן ---- */
function quiz(list,isSim){
let i=0;const res=[],t0=Date.now(),end=t0+30*6e4,added=[];clearInterval(TMR);
function fin(){clearInterval(TMR);
 if(isSim)for(let j=res.length;j<list.length;j++)res.push({q:list[j],ok:false,pick:null,skip:1});
 let a=0,b=0;const bt={},bd={};
 res.forEach(r=>{const w=WT[r.q.df]||1.5,t=r.q.t,d=r.q.df;b+=w;if(r.ok)a+=w;bt[t]=bt[t]||[0,0];bt[t][1]++;if(r.ok)bt[t][0]++;bd[d]=bd[d]||[0,0];bd[d][1]++;if(r.ok)bd[d][0]++});
 const okc=res.filter(r=>r.ok).length,sc=Math.round(50+100*(b?a/b:0)),sec=Math.round((Date.now()-t0)/1000),wl=res.filter(r=>!r.ok).map(r=>r.q);
 if(isSim){S.sims.push({d:new Date().toLocaleDateString('he-IL'),sc,ok:okc,n:res.length,by:bt,bd,sec});if(S.sims.length>30)S.sims.shift();tick();save()}
 function view(f,keep){const wn=res.length-okc,sh=res.map((r,x)=>({r,x})).filter(o=>f==='all'||!o.r.ok);
 V(`<h2>${isSim?'תוצאות המבחן':'סיכום תרגול'}</h2>
<div class=card style="text-align:center"><div class=num>${okc}/${res.length}</div>${isSim?`<div>ציון משוער: <b>${sc}</b></div><small>הערכה גסה בלבד · זמן ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</small>`:`<small>${res.length?Math.round(okc/res.length*100):0}% דיוק</small>`}</div>
<div class=card><b>פילוח לפי סוג שאלה</b>${TYPES.filter(t=>bt[t[0]]).map(t=>rowH(t[1],bt[t[0]][0],bt[t[0]][1],bt[t[0]][1]>=2&&bt[t[0]][0]/bt[t[0]][1]<.6)).join('')}${bt.vq?rowH('חידון מילים',bt.vq[0],bt.vq[1],false):''}
${Object.keys(bd).length>1?`<div style="height:8px"></div><b>לפי רמת קושי</b>${['easy','medium','hard'].filter(d=>bd[d]).map(d=>rowH(DN[d],bd[d][0],bd[d][1],false)).join('')}`:''}</div>
${added.length?`<div class=card>🔥 נוספו למילים קשות: <b dir=ltr>${added.map(esc).join(', ')}</b></div>`:''}
<div class=seg><button class="${f==='all'?'on':''}" onclick="__rv('all',1)">כל השאלות (${res.length})</button><button class="${f==='bad'?'on':''}" onclick="__rv('bad',1)">רק טעויות (${wn})</button></div>
${sh.map(o=>rev(o.r,o.x)).join('')||'<div class=card>אין טעויות 🎉</div>'}
${wn?`<button class=btn onclick="__rt()">תרגל את הטעויות (${Math.min(wn,10)})</button>`:''}
<button class="btn s" onclick="go(${isSim?'sim':'prac'})">${isSim?'חזרה':'תרגול נוסף'}</button><button class="btn s" onclick="go(home)">בית</button>`,keep)}
 window.__rv=view;window.__rt=()=>quiz(shuf(wl.filter(q=>q.t!=='vq')).slice(0,10),false);view('all',0)}
function show(){if(i>=list.length)return fin();const q=list[i],os=shuf(q.o.map((t,j)=>({t,j}))),pa=q.pid?P[q.pid]:null;let done=0;
V(`<div class=top><button class=x id=qx>✕</button><div class=bar><i style="width:${i/list.length*100}%"></i></div><span class=mu>${i+1}/${list.length}</span>${isSim?'<span class=tm id=tm></span>':''}</div>
${pa?`<div class="card pass" dir=auto><b>${esc(pa.title)}</b>\n${esc(pa.text)}</div>`:''}<div class="card q" dir=auto>${esc(q.q)}</div>
${os.map((o,n)=>`<button class=opt dir=auto data-n=${n}>${esc(o.t)}</button>`).join('')}<div id=ex></div><button class=btn id=nx style="display:none">${i+1<list.length?'הבא ←':'סיום'}</button>`);
$('#qx').onclick=()=>isSim?ask('לצאת מהמבחן? התשובות עד עכשיו לא יישמרו.',()=>{clearInterval(TMR);sim()},show):go(prac);
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=1;const n=+b.dataset.n,ok=os[n].j===q.k,note=rec(q,ok);if(note&&!added.includes(note))added.push(note);res.push({q,ok,pick:os[n].t});
 if(isSim){i++;return show()}
 document.querySelectorAll('.opt').forEach((x,m)=>{if(os[m].j===q.k)x.classList.add('good');else if(m===n)x.classList.add('bad')});
 $('#ex').innerHTML=`<div class="ex ${ok?'r':'w'}">${ok?'✅ נכון! ':'❌ לא נכון. '}${esc(q.e||'')}</div>${note?`<div class=mu style="margin:0 0 8px">🔥 "${esc(note)}" נשמרה במילים הקשות</div>`:''}`;
 const nx=$('#nx');nx.style.display='block';nx.onclick=()=>{i++;show()}})}
if(isSim)TMR=setInterval(()=>{const s=Math.max(0,Math.round((end-Date.now())/1000)),t=$('#tm');if(t)t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)fin()},500);
show()}

/* ---- התקדמות ---- */
function stats(){nav('stats');const h=S.hist,n=h.length,ok=h.filter(r=>r.ok).length,wk=weak(),w0=wk[0],hn=hardList().length,wn=cnt(S.wrong);
const byT=TYPES.slice(0,4).map(t=>{const r=h.filter(x=>x.t===t[0]);return rowH(t[1],r.filter(x=>x.ok).length,r.length,!!(w0&&w0.t===t[0]&&w0.acc<.8))}).join('');
const byD=['easy','medium','hard'].map(d=>{const r=h.filter(x=>x.d===d);return rowH(DN[d],r.filter(x=>x.ok).length,r.length,false)}).join('');
const ins=[];
if(n<10)ins.push('ענה על לפחות 10 שאלות כדי לקבל ניתוח אישי.');
else{
 if(w0&&w0.acc<.8)ins.push(`הנושא החלש ביותר: <b>${w0.label}</b> (${Math.round(w0.acc*100)}% דיוק).`);
 const e=h.filter(x=>x.d==='easy');if(e.length>=5&&e.filter(x=>x.ok).length/e.length<.75)ins.push('יש טעויות גם בשאלות קלות. כדאי לקרוא לאט יותר ולא למהר.');
 if(n>=40){const a=h.slice(-20),b=h.slice(-40,-20),pa=a.filter(x=>x.ok).length/20,pb=b.filter(x=>x.ok).length/20;ins.push(pa>pb+.05?'📈 הדיוק ב-20 השאלות האחרונות עלה לעומת הקודמות.':pa<pb-.05?'📉 הדיוק ב-20 השאלות האחרונות ירד לעומת הקודמות.':'הדיוק יציב ב-40 השאלות האחרונות.')}
 if(!ins.length)ins.push('אין כרגע נקודת חולשה בולטת. המשך לתרגל.')}
if(hn)ins.push(`🔥 ${hn} מילים קשות מחכות לחזרה.`);
if(wn)ins.push(`❗ ${wn} שאלות שטעית בהן מחכות לחזרה.`);
const bs=S.sims.length?Math.max(...S.sims.map(s=>s.sc)):null;
V(`<h2>התקדמות</h2><div class=g><div class=card><div class=num>${n}</div><small>שאלות נענו</small></div><div class=card><div class=num>${n?Math.round(ok/n*100):0}%</div><small>דיוק</small></div></div>
<div class=card><b>מה לשפר</b>${ins.map(t=>`<div style="margin-top:8px;line-height:1.5;font-size:14px">• ${t}</div>`).join('')}
${w0&&w0.acc<.8?`<button class=btn onclick="startP('${w0.t}')">תרגל: ${w0.label}</button>`:''}
${wn?`<button class="btn s" onclick="startW()">תרגל שאלות שטעית</button>`:''}${hn?`<button class="btn s" onclick="go(hardw)">מילים קשות (${hn})</button>`:''}</div>
<div class=card><b>לפי סוג שאלה</b>${byT}</div><div class=card><b>לפי רמת קושי</b>${byD}</div>
<div class=card><b>מבחנים אחרונים</b>${bs?`<div class=mu style="margin-top:4px">הטוב ביותר: ${bs}</div>`:''}${S.sims.length?S.sims.slice(-8).reverse().map(s=>`<div class=mu style="margin-top:6px">${esc(s.d)} · ציון ${s.sc} · ${s.ok}/${s.n}</div>`).join(''):'<div class=mu>עוד לא נעשו מבחנים</div>'}</div>
<button class="btn s" onclick="backup()">גיבוי ושחזור נתונים</button>
<button class="btn s" onclick="ask('למחוק את כל ההתקדמות, כולל מילים קשות וטעויות?',()=>{S=fresh();save();stats()},stats)">איפוס התקדמות</button>`)}
function backup(){V(`<div class=top><button class=x onclick="go(stats)">→</button><h2 style="margin:0">גיבוי ושחזור</h2></div>
<div class=card><small>העתק את הטקסט ושמור אותו (למשל בהערות). כך אפשר לשחזר את ההתקדמות גם אחרי מעבר לכתובת אחרת.</small></div>
<textarea id=bk readonly>${esc(JSON.stringify(S))}</textarea><button class=btn id=cp>העתק</button>
<h2 style="margin-top:18px">שחזור</h2><textarea id=rs placeholder="הדבק כאן גיבוי"></textarea><button class="btn s" id=rb>שחזר</button><div id=msg class=mu style="margin-top:8px"></div>`);
$('#cp').onclick=()=>{const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}try{document.execCommand('copy')}catch(e){}$('#msg').textContent='הועתק. אם לא עבד, לחץ לחיצה ארוכה על הטקסט ובחר העתק.'};
$('#rb').onclick=()=>{try{const o=JSON.parse($('#rs').value);if(!o||typeof o!=='object'||!o.cards)throw 0;S=Object.assign(fresh(),o);save();$('#msg').textContent='שוחזר ✅'}catch(e){$('#msg').textContent='הטקסט לא תקין'}}}

try{const t=ST.g('ep_th');if(t)document.documentElement.dataset.theme=t}catch(e){}
home();
</script></body></html>
