ition from the ruling party.\"","o":["The amendment was rejected because of the ruling party's vehement opposition.","The ruling party ratified the amendment even though it limited its opponents.","The amendment expanding executive authority was ratified with the ruling party's strong support.","Although the governing party strongly opposed it, the amendment limiting presidential emergency powers was approved."],"k":3,"e":"curtails = מצמצם; vehement = עז; despite.","df":"hard"},{"i":"rs298","t":"rst","q":"\"Contrary to popular belief, sleep deprivation does not merely impair alertness; it also undermines the consolidation of memories.\"","o":["Popular belief correctly holds that sleep deprivation damages memory but not alertness.","Lack of sleep affects alertness only and has no effect on memory, as many believe.","Lack of sleep does more than reduce attentiveness, as it also weakens memory formation, unlike what many assume.","Sleep deprivation strengthens memory consolidation while reducing alertness."],"k":2,"e":"not merely...also; Contrary to = בניגוד.","df":"medium"},{"i":"rs299","t":"rst","q":"\"Having amassed considerable wealth through speculation, the banker was widely suspected of having exploited privileged information.\"","o":["The banker was proven to have lost his fortune by using privileged information.","Few people suspected that the banker had access to privileged information.","The banker was admired for amassing wealth without speculation.","Many suspected that the banker had used insider knowledge to build up a large fortune by speculating."],"k":3,"e":"Perfect participle; exploited privileged information = ניצל מידע פנים.","df":"hard"},{"i":"rs300","t":"rst","q":"\"The negotiators reached an impasse, as neither side was willing to relinquish its claim to the disputed territory.\"","o":["The talks stalled because one side demanded the other's territory.","The talks stalled because both parties refused to give up their claim to the contested land.","The negotiators reached an impasse after dividing the disputed land.","The talks succeeded because both parties gave up their claim to the territory."],"k":1,"e":"impasse = קיפאון; relinquish = לוותר.","df":"medium"},{"i":"rs301","t":"rst","q":"\"Technological progress, far from guaranteeing prosperity, may exacerbate existing disparities when its benefits are unevenly distributed.\"","o":["New technology does not ensure wealth and can widen current inequalities if its gains are not shared evenly.","Uneven distribution of benefits is impossible with technological progress.","Disparities increase only when technology is not progressing.","New technology guarantees prosperity and narrows disparities when its benefits are spread."],"k":0,"e":"far from = רחוק מ; exacerbate = להחמיר.","df":"hard"},{"i":"rs302","t":"rst","q":"\"A rise in the minimum wage need not lead to job losses, since higher pay can reduce turnover and boost productivity.\"","o":["Job losses cause the minimum wage to rise since turnover is high.","Higher pay reduces productivity and so leads to job losses.","Raising the minimum wage will inevitably cause job losses despite productivity gains.","Increasing the lowest legal pay does not have to cost jobs, because better wages may cut staff departures and raise output."],"k":3,"e":"need not = לא בהכרח; since = מכיוון ש.","df":"medium"},{"i":"rs303","t":"rst","q":"\"Researchers have yet to determine whether the observed correlation reflects a genuine causal relationship or merely a statistical artifact.\"","o":["Researchers refuse to study whether the correlation is causal.","Researchers have determined that the correlation is a genuine causal relationship.","It has not yet been established whether the link found is truly causal or just a product of the statistics.","Researchers have proven that the correlation is purely a statistical artifact."],"k":2,"e":"have yet to = עדיין לא; artifact = תוצר.","df":"hard"},{"i":"rs304","t":"rst","q":"\"The empire' ,"k":1,"e":"dissolves once = נעלם כאשר.","df":"hard"},{"i":"rs318","t":"rst","q":"\"Some critics argue that the film, however visually stunning, sacrifices narrative coherence for spectacle.\"","o":["Critics argue that the film's visuals suffer because of its narrative coherence.","Critics say the film has a coherent plot but unimpressive visuals.","A few critics claim that, as beautiful as the movie looks, it gives up a clear story in favor of showy effects.","All critics agree that the movie has both a coherent story and stunning visuals."],"k":2,"e":"however + adj = ככל ש; sacrifices X for Y.","df":"hard"},{"i":"rs319","t":"rst","q":"\"The central bank's mandate, which prioritizes price stability, occasionally conflicts with the government's goal of boosting employment.\"","o":["The central bank is tasked mainly with stable prices, which sometimes clashes with the state's aim of raising employment.","The central bank and the government always agree on boosting employment.","The government's mandate prioritizes price stability, and the central bank seeks employment.","The central bank's mandate prioritizes employment, which never conflicts with price stability."],"k":0,"e":"occasionally = לעתים; prioritizes = מעדיף.","df":"medium"},{"i":"rs320","t":"rst","q":"\"Had the engineers heeded the early warnings, the bridge's structural failure could have been prevented.\"","o":["The bridge collapse was avoidable if the engineers had paid attention to the early alerts.","The bridge did not fail because the engineers ignored the warnings.","The bridge will be safe if the engineers heed future warnings.","The engineers heeded the warnings, but the bridge failed anyway."],"k":0,"e":"Had + S + V3 = תנאי סוג 3; heed = לשים לב.","df":"medium"},{"i":"rs321","t":"rst","q":"\"Rarely do economic downturns affect all sectors uniformly; some industries actually thrive while others contract sharply.\"","o":["Economic downturns always cause all industries to contract sharply.","Recessi onsciousness.","Scientists have only just begun researching how anesthetics induce unconsciousness."],"k":0,"e":"Notwithstanding = למרות; remains poorly understood.","df":"medium"},{"i":"rs325","t":"rst","q":"\"The tenant was entitled to withhold rent until the landlord had remedied the defects that rendered the apartment uninhabitable.\"","o":["The tenant was required to keep paying rent until the landlord repaired the apartment.","The renter had the right to stop paying until the owner repaired the faults that made the flat unfit to live in.","The tenant had to repair the defects before the landlord could collect rent.","The landlord was allowed to withhold the deposit until the tenant fixed the defects."],"k":1,"e":"entitled = זכאי; remedied = תיקן; rendered = הפך.","df":"hard"},{"i":"rs326","t":"rst","q":"\"Despite its name, the Hundred Years' War was not a single continuous conflict but a series of intermittent campaigns.\"","o":["The war was a series of campaigns that lasted only a few years in total.","The Hundred Years' War was a single continuous conflict that lasted exactly a century.","The war known as the Hundred Years' War was really a set of separate periods of fighting, not one unbroken struggle.","The Hundred Years' War lasted much longer than a hundred years without pause."],"k":2,"e":"not X but Y; intermittent = לסירוגין.","df":"medium"},{"i":"rs327","t":"rst","q":"\"Scientists remain divided over whether the extinction was triggered by an asteroid impact or by prolonged volcanic activity.\"","o":["Scientists agree that volcanic activity and an asteroid impact were unrelated to the extinction.","There is no consensus among researchers on whether a meteor strike or lengthy eruptions caused the extinction.","Scientists agree that an asteroid impact triggered the extinction.","Scientists believe the extinction was caused by neither asteroids nor volcanoes."],"k":1,"e":"divided over = חלוקים; whether...or.","df":"medium"},{"i":"rs328","t":"rst","q":"\"The startup's valuation, inflated by speculative enthusiasm, plummeted once investors scrutinized its dwindling revenues.\"","o":["The new company's worth, pumped up by hype, dropped sharply when investors examined its shrinking income.","The startup's revenues dwindled because its valuation plummeted.","The startup's valuation was low until speculative enthusiasm inflated it.","The startup's valuation rose when investors examined its growing revenues."],"k":0,"e":"inflated = מנופח; plummeted once = צנח כאשר.","df":"medium"},{"i":"rs329","t":"rst","q":"\"Social scientists increasingly recognize that identity is less a fixed attribute than a fluid construct negotiated through interaction.\"","o":["Researchers in the social sciences more and more see identity as a changing creation shaped in social exchanges, not a set trait.","Social scientists now deny that identity is influenced by social interaction.","Social scientists increasingly believe that identity is a fixed attribute unaffected by interaction.","Social scientists have long recognized that identity is permanent and rigid."],"k":0,"e":"less X than Y; increasingly = יותר ויותר.","df":"hard"},{"i":"rs330","t":"rst","q":"\"Insufficient funding, rather than lack of expertise, is widely regarded as the principal obstacle to the project's completion.\"","o":["The project was completed despite insufficient funding and lack of expertise.","Most people see a shortage of money, not a shortage of skill, as the main barrier to finishing the project.","A lack of expertise is regarded as the main obstacle, more than funding.","Insufficient funding is regarded as an obstacle only because of expertise."],"k":1,"e":"rather than; principal = עיקרי.","df":"medium"},{"i":"rs331","t":"rst","q":"\"Whereas classical physics treats particles as having definite positions, quantum mechanics assigns them only probabilities of being found at given locations.\"","o":["Classical physics assumes particles have exact positions, but quantum y","pid":"p8"},{"i":"rc8b","t":"rc","q":"Where did metal coinage first appear, according to the passage?","o":["China","Egypt","Lydia","Rome"],"k":2,"e":"פסקה 2: מטבעות מתכת הופיעו בליידיה.","df":"easy","pid":"p8"},{"i":"rc8c","t":"rc","q":"The word \"redeemed\" in the second paragraph most nearly means:","o":["Forgiven","Destroyed","Exchanged for its stated value","Counterfeited"],"k":2,"e":"redeemed = נפדה, הומר בערכו המוצהר.","df":"medium","pid":"p8"},{"i":"rc8d","t":"rc","q":"What can be inferred about the anthropologists mentioned in the first paragraph?","o":["They doubt the traditional economic account of barter","They deny that credit ever existed","They study only coins","They believe barter was universal"],"k":0,"e":"פסקה 1: האנתרופולוגים טוענים שאין עדות לחברות שהתבססו על חליפין.","df":"hard","pid":"p8"},{"i":"rc8e","t":"rc","q":"How does the third paragraph relate to the rest of the passage?","o":["It introduces an unrelated topic","It links the historical examples to the present day","It summarizes the barter theory","It contradicts the earlier claims"],"k":1,"e":"פסקה 3 מקשרת את ההיסטוריה (אמון במנפיק) למטבעות של ימינו.","df":"medium","pid":"p8"},{"i":"rc9a","t":"rc","q":"What is the main idea of the passage?","o":["Urban farming is useful but will supplement rather than replace rural farming","Community gardens are better than vertical farms","Urban farming will soon replace traditional agriculture","Urban farming is a failed idea"],"k":0,"e":"פסקה 3: \"complement rather than replace\".","df":"easy","pid":"p9"},{"i":"rc9b","t":"rc","q":"Why are indoor vertical farms economically fragile?","o":["They use too much water","They grow only staple grains","They require large amounts of pesticide","They consume enormous amounts of electricity"],"k":3,"e":"פסקה 2: מתקנים סגורים צורכים הרבה חשמל וכמה חברות פשטו רגל.","df":"medium","pid":"p9"},{"i":"rc9c","t":"rc","q":"The word \"tempered\" in the second paragraph most nearly means:","o":["Moderated","Heated","Ignored","Increased"],"k":0,"e":"tempered = מתון, מרוסן.","df":"medium","pid":"p9"},{"i":"rc9d","t":"rc","q":"What can be inferred from the passage about the crops grown in vertical farms?","o":["They include most of the world's wheat","They are all grown without light","They are unlikely to meet the world's need for staple grains","They are more nutritious than field crops"],"k":2,"e":"פסקה 2: מגדלים בעיקר חסות ועשבי תיבול, לא דגנים.","df":"hard","pid":"p9"},{"i":"rc9e","t":"rc","q":"How would you describe the author's tone?","o":["Enthusiastic and uncritical","Humorous and casual","Balanced and cautious","Dismissive and hostile"],"k":2,"e":"הכותב מציג יתרונות וחסרונות ומתנה את ההתלהבות.","df":"medium","pid":"p9"},{"i":"rc10a","t":"rc","q":"What is the main idea of the passage?","o":["Hiring algorithms can reproduce human bias and require accountability","Regulation has already solved the problem","Algorithms are always fairer than humans","Recruiters should read every résumé"],"k":0,"e":"פסקה 2 ו-3: האלגוריתמים משכפלים הטיות ויש צורך באחריותיות.","df":"easy","pid":"p10"},{"i":"rc10b","t":"rc","q":"Why did the recruiting tool penalize résumés containing the word \"women's\"?","o":["It could not read the word","It was trained on data in which most successful candidates were men","Applicants had requested it","Its programmers deliberately designed it that way"],"k":1,"e":"פסקה 2: האלגוריתם אומן על עשור של מועמדים שרובם גברים.","df":"medium","pid":"p10"},{"i":"rc10c","t":"rc","q":"The word \"proprietary\" in the second paragraph most nearly means:","o":["Illegal","Outdated","Privately owned and undisclosed","Free to use"],"k":2,"e":"proprietary = בבעלות פרטית, ולכן מועמדים לא יכולים לדעת איך הוא פועל.","df":"hard","pid":"p10"},{"i":"rc10d","t":"rc","q":"What can be inferred about rejected candidates?","o":["They are always told the reason","They prefer automated screening","They may appeal to the software","They often cannot find out why they were rejected"],"k":3,"e":"פסקה 2: המערכות סגורות ולכן מועמדים לא יודעים מדוע נדחו.","df":"medium","pid":"p10"},{"i":"rc10e","t":"rc","q":"What is the author's view of the regulatory measures mentioned?","o":["Completely effective","Harmful and unnecessary","Welcome but insufficient","Irrelevant"],"k":2,"e":"פסקה 3: \"welcome, but they address symptoms\".","df":"hard","pid":"p10"},{"i":"rc11a","t":"rc","q":"What is the main idea of the passage?","o":["Pesticides are the only cause of bee decline","Honeybee populations are growing","Bee decline has multiple causes and demands changes in land use","Bees are no longer important for crops"],"k":2,"e":"פסקאות 2 ו-3: גורמים מרובים ושינוי בשימושי קרקע.","df":"easy","pid":"p11"},{"i":"rc11b","t":"rc","q":"According to the passage, what do neonicotinoids do?","o":["Impair bees' navigation and immune function","Replace meadows with monocultures","Spread viruses through hives","Disrupt the timing of flowering"],"k":0,"e":"פסקה 2: הם פוגעים בניווט ובחיסון של דבורים.","df":"easy","pid":"p11"},{"i":"rc11c","t":"rc","q":"The word \"resilience\" in the second paragraph most nearly means:","o":["Cost of upkeep","Speed of flight","Ability to withstand stress","Size of population"],"k":2,"e":"resilience = חוסן, יכולת עמידה בלחץ.","df":"medium","pid":"p11"},{"i":"rc11d","t":"rc","q":"What can be inferred about wild bee species?","o":["They are unaffected by land use","They are thriving compared to honeybees","They are at greater risk than managed honeybees yet get less attention","They are more visible to the public"],"k":2,"e":"פסקה 3: מינים בר פחות נראים אך בסכנה גדולה יותר.","df":"hard","pid":"p11"},{"i":"rc11e","t":"rc","q":"How does the author view conservation efforts so far?","o":["As entirely pointless","As harmful to bees","As a complete success","As encouraging but limited"],"k":3,"e":"פסקה 3: \"modest results\" ו-\"Nevertheless\".","df":"medium","pid":"p11"}],"p":{"p1":{"title":"The Psychology of Procrastination","text":"Procrastination — the act of delaying or postponing tasks despite knowing that doing so will have negative consequences — is one of the most universally human experiences. While most people procrastinate occasionally, research suggests that approximately 20 percent of adults identify as chronic procrastinators, meaning the behavior significantly disrupts their daily lives and long-term goals.\n\nContrary to popular belief, procrastination is not simply a matter of poor time management or laziness. Psychologists increasingly frame it as an emotion regulation problem. When a task generates feelings of anxiety, boredom, self-doubt, or frustration, the human brain naturally seeks relief by directing attention elsewhere. Short-term mood repair — browsing social media, watching television, or engaging in any number of pleasant distractions — takes precedence over long-term productivity. The procrastinator is not choosing to be inefficient; rather, they are choosing immediate emotional comfort over future benefit.\n\nThis perspective helps explain why motivational approaches often fail. Telling chronic procrastinators to \"just start\" or reminding them of deadlines increases the emotional discomfort associated with the task, potentially making avoidance even more tempting. More effective strategies focus instead on reducing the emotional barriers. Breaking tasks into smaller, less threatening components, practicing self-compassion rather than harsh self-criticism, and creating environments with fewer competing distractions have all been shown to reduce procrastination behavior.\n\nRecent neuroimaging studies have added a biological dimension to this understanding. Researchers have observed that individuals who procrastinate more tend to have a larger amygdala — the brain region responsible for processing emotions and perceived threats — and weaker connections between the amygdala and the regions of the brain responsible for action and decision-making. This structural difference may make it harder for some people to override the impulse to avoid discomfort, suggesting that procrastination has genuine neurological roots rather than being a simple character flaw.\n\nUnderstanding procrastination in this nuanced way carries important implications. It shifts responsibility from moral failure to psychological and neurological reality, opening the door to more compassionate and evidence-based interventions."},"p2":{"title":"The Rise and Fall of the Aral Sea","text":"Once the fourth largest lake in the world, the Aral Sea, located between Kazakhstan and Uzbekistan, has undergone one of the most dramatic environmental transformations in recorded history. In the 1960s, Soviet central planners made the fateful decision to divert the two rivers that fed the sea — the Amu Darya and the Syr Darya — to irrigate vast cotton fields across Central Asia. The economic rationale was straightforward: cotton was a valuable export crop, and the region's flat terrain and abundant sunshine made it ideal for cultivation. What the planners failed to adequately consider were the long-term consequences of severing the sea from its primary water sources.\n\nThe results were catastrophic. By the 1980s, the sea had shrunk to roughly half its original surface area. By 2007, it had declined to only 10 percent of its former size, splitting into several disconnected smaller lakes. The fishing industry, which had once supported some 60,000 jobs and produced over 40,000 tons of fish annually, was completely destroyed. Rusting fishing boats became an eerie landmark in what had become a vast salt desert — a haunting symbol of one of the greatest ecological disasters of the 20th century.\n\nThe environmental consequences extended far beyond the loss of the fisheries. As the water retreated, it exposed the lakebed, which had accumulated decades of agricultural runoff containing pesticides, fertilizers, and heavy metals. Winds picked up this toxic residue and carried it across the region, contaminating soil and water for hundreds of kilometers. Rates of respiratory illness, cancer, and infant mortality in surrounding communities increased dramatically. The local climate also shifted, with summers becoming hotter and winters colder, as the sea's moderating influence disappeared.\n\nInternational efforts to restore the Aral Sea have achieved only partial success. Kazakhstan constructed the Kokaral Dam in 2005, partially restoring the smaller northern section of the sea. Water levels rose, salinity decreased, and fish populations began to return in that portion. However, the much larger southern section, primarily within Uzbekistan, has shown no comparable recovery and may be permanently lost. The case of the Aral Sea stands as one of the most instructive examples of how large-scale human intervention in natural systems, without adequate foresight, can produce irreversible and wide-reaching harm."},"p3":{"title":"Behavioral Economics and the Limits of Rational Choice","text":"Classical economic theory rests on a deceptively simple assumption: that human beings are rational actors who consistently make decisions that maximize their own welfare. This model, often called Homo Economicus, treats people as dispassionate calculators, weighing costs and benefits with mathematical precision before selecting the optimal course of action. For much of the 20th century, this framework dominated economic thought and shaped policy decisions across the globe.\n\nBeginning in the 1970s, however, psychologists Daniel Kahneman and Amos Tversky began publishing a series of studies that systematically challenged this premise. Their research demonstrated that human decision-making is riddled with predictable cognitive biases — consistent patterns of irrational behavior that deviate from what economic theory would predict. One of their most influential findings concerned what they called \"loss aversion\": the tendency for people to feel the pain of losing something approximately twice as intensely as they feel the pleasure of gaining something equivalent. Individuals will go to extraordinary lengths to avoid a loss that they would not make comparable efforts to achieve an equivalent gain.\n\nAnother major finding was the \"framing effect\" — the discovery that people's choices are powerfully influenced by how options are presented, rather than solely by the objective features of those options. In one classic experiment, participants were far more likely to choose a medical procedure described as having a \"90 percent survival rate\" than one described as having a \"10 percent mortality rate,\" even though the two descriptions are mathematically identical. The implication is uncomfortable: rational deliberation is perpetually vulnerable to superficial changes in language and presentation.\n\nThese discoveries gave birth to the field of behavioral economics, which seeks to incorporate realistic models of human psychology into economic analysis. Perhaps its most influential practical application has been the concept of \"nudging\" — designing choice architectures that guide people toward better decisions without restricting their freedom to choose otherwise. Placing healthier food options at eye level in a cafeteria, or making pension enrollment automatic rather than opt-in, exploits cognitive tendencies in ways that improve outcomes without coercion.\n\nCritics have raised important concerns about the nudging approach. Some argue that it is inherently paternalistic, assuming that policymakers know better than individuals what constitutes a good decision. Others worry about the potential for nudges to be exploited by corporations or governments for purposes that do not align with citizens' genuine interests. The debate reflects a fundamental tension in behavioral economics: the field is built on evidence that people are not fully rational, but must also grapple with the question of who has the authority and legitimacy to guide those imperfect judgments."},"p4":{"title":"The Economics of Attention","text":"In a world where information is abundant, attention has become the scarce resource. Economist Herbert Simon observed as early as 1971 that a wealth of information creates a poverty of attention, and he warned that organizations would need to allocate this limited resource carefully. Today, that warning seems prophetic. Digital platforms compete fiercely for the few seconds a user is willing to give, and many of them design their products to be as difficult to put down as possible.\n\nCritics argue that this competition does not merely waste time; it reshapes habits. Notifications, endless scrolling and autoplay features exploit psychological tendencies that evolved in a very different environment. Defenders of the industry reply that users remain free to leave at any moment, and that the same technologies connect people and spread knowledge at unprecedented speed.\n\nMost researchers occupy a middle ground. They accept that the tools are valuable but insist that the burden should not fall entirely on individuals. Just as food labels help consumers resist overeating, they suggest, transparent design standards could help users manage their own attention. Whether such regulation is practical, however, remains an open question."},"p5":{"title":"Why Cities Grow Hotter","text":"Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. Dark surfaces such as asphalt and rooftops absorb sunlight during the day and release it slowly at night, so the city never fully cools. In addition, the lack of vegetation reduces the natural cooling that occurs when plants release water vapor.\n\nThe consequences extend beyond discomfort. Higher temperatures raise electricity demand for air conditioning, which in turn increases emissions and worsens air quality. Elderly residents and people with chronic illness are especially vulnerable during heat waves, and studies link extreme urban heat to higher hospital admissions.\n\nPlanners have responded with several strategies. Reflective roofing materials send sunlight back into the atmosphere, while parks and street trees provide shade and moisture. Some cities have gone further, painting roads light colors or creating green roofs. Although these measures are not cheap, supporters argue that the long-term savings in energy and health costs outweigh the initial investment."},"p6":{"title":"The Fate of Dead Languages","text":"Of the roughly seven thousand languages spoken today, linguists estimate that nearly half could disappear by the end of the century. When the last fluent speaker of a language dies, a unique way of describing the world vanishes with them, including names for local plants, traditional medicine and oral histories that were never written down.\n\nSome scholars argue that this loss is a natural consequence of social change. Speakers abandon smaller languages for dominant ones because they offer better access to education and employment. From this perspective, preservation efforts may seem sentimental, even futile.\n\nHowever, recent revival projects suggest otherwise. Hebrew, once confined to prayer and scholarship, became a living national language within a few generations. Welsh and Maori have similarly regained speakers through immersion schools and public support. These examples show that decline is not inevitable when communities and governments commit resources, though success demands decades of sustained effort."},"p7":{"title":"Why We Sleep","text":"For much of the twentieth century, sleep was regarded as a passive state, a nightly shutdown during which the brain simply rested. Recordings of electrical activity overturned that view. During rapid eye movement sleep the brain is nearly as active as it is during waking hours, and even in deep, slow-wave sleep, neurons fire in coordinated waves that appear to serve a purpose rather than reflect idleness.\n\nOne of the most compelling findings concerns memory. Experiments show that people who sleep after learning a new task retain far more than those who stay awake for the same interval. Researchers believe that during slow-wave sleep the brain replays the day's experiences, gradually transferring fragile memories from the hippocampus to the cortex, where they can be stored for the long term. Sleep also appears to clear metabolic waste: fluid flows more freely through the brain at night, washing away proteins that accumulate during the day and that, in excess, are associated with neurodegenerative disease.\n\nThe practical implications are considerable, yet modern societies routinely treat sleep as a luxury. Students sacrifice it before examinations, and employees wear exhaustion as a badge of dedication. The evidence suggests that this habit is self-defeating. A tired mind learns more slowly, regulates emotion poorly and makes riskier decisions. Far from being wasted time, sleep is among the most productive things the brain does."},"p8":{"title":"A Short History of Money","text":"Money is so familiar that it is easy to forget how strange an invention it is. Early societies relied on barter, but exchanging goods directly requires a double coincidence of wants: each party must happen to possess precisely what the other desires. Economists have long assumed that this inconvenience drove people to adopt commodities such as salt, shells or cattle as a shared medium of exchange. Anthropologists, however, note that little evidence exists of any society that operated mainly through barter, and suggest that early economies ran largely on credit and mutual obligation.\n\nMetal coinage appeared in Lydia around the seventh century BCE, and it solved a critical problem: standardized weight and a ruler's stamp made value easy to verify. Paper money followed in China, where merchants grew weary of carrying heavy strings of copper coins. Its success depended on a simple condition: people had to trust the issuer's promise that the paper could be redeemed.\n\nThat dependence on trust remains central today. Modern currencies are no longer backed by gold or silver; they hold value because governments declare them legal tender and because the public expects others to accept them. Money, in this sense, is less a physical object than a shared belief, and its stability rests on the credibility of the institutions that stand behind it."},"p9":{"title":"Farming in the City","text":"Urban farming, once a curiosity associated with rooftop hobbyists, has grown into a serious component of the debate about food security. By 2050, roughly two thirds of humanity is expected to live in cities, and supplying them with fresh produce through long supply chains is costly and energy-intensive. Growing vegetables within or near urban areas shortens the distance between farm and table, reducing spoilage and transport emissions.\n\nProponents point to impressive innovations. Vertical farms stack trays of leafy greens beneath artificial lights, using a fraction of the water that conventional agriculture requires and avoiding pesticides entirely. Community gardens, meanwhile, offer benefits that are harder to quantify, such as green space and neighborhood cohesion. Yet the enthusiasm should be tempered. Indoor facilities consume enormous amounts of electricity, and their economics are fragile; several well-funded companies have already gone bankrupt. Moreover, the crops that thrive in such settings are mostly lettuces and herbs, not the staple grains that feed the world.\n\nA balanced assessment, therefore, is that urban agriculture will complement rather than replace rural farming. It can improve access to fresh food in neighborhoods that lack it and make cities more resilient, but it is unlikely to feed them. Its value lies in supplementing the system, not in transforming it."},"p10":{"title":"Algorithms at the Hiring Desk","text":"Companies increasingly rely on algorithms to screen job applicants, sorting thousands of résumés in the time a human recruiter would need to read a handful. Advocates claim that such systems are not only efficient but fairer, since software does not feel fatigue or harbor personal prejudice. The argument is appealing, but it rests on a questionable assumption: that the data used to train these systems is itself neutral.\n\nIn practice, algorithms learn from historical hiring decisions, and those decisions often reflect the biases of the past. A widely discussed case involved a recruiting tool that penalized résumés containing the word \"women's,\" because it had been trained on a decade of applications in which most successful candidates were men. The software was not malicious; it merely replicated the pattern it was shown. Complicating matters further, many such systems are proprietary, so rejected candidates cannot learn why they were turned down.\n\nThese concerns have prompted calls for regulation. Several jurisdictions now require employers to audit their tools for discriminatory outcomes and to disclose when automation is used. Such measures are welcome, but they address symptoms. The deeper task is to decide which human judgments we are willing to delegate, and to ensure that accountability remains with people rather than with code."},"p11":{"title":"The Quiet Decline of Bees","text":"Bees are responsible for pollinating roughly three quarters of the world's major food crops, from almonds to apples, yet many populations have declined sharply in recent decades. In some regions, beekeepers report losing a third of their colonies each winter, and wild species have fared even worse. The causes are rarely simple, which has made the problem difficult to address and slow to reverse.\n\nScientists identify several interacting pressures. Intensive agriculture has replaced diverse meadows with vast monocultures that offer food for only a short season. Certain pesticides, especially a class known as neonicotinoids, impair bees' navigation and immune function even at low doses. Meanwhile, the parasitic varroa mite spreads viruses through hives, and a warming climate disrupts the timing between flowering and bee emergence. Any one factor might be survivable; together they erode the insects' resilience.\n\nConservation efforts have begun to yield modest results. The European Union has restricted the most harmful pesticides, and cities have planted wildflower corridors that give pollinators refuge. Nevertheless, experts caution that managed honeybees receive disproportionate public attention, while thousands of wild species, which are less visible, are in greater peril. Protecting them will require changes to land use, not merely the installation of more hives."}},"tips":[{"title":"שלילה כפולה","body":"\"Not without merit\" = יש ערך. שני שלילות = חיוב!"},{"title":"מסיחים פונטיים","body":"\"Mitigate\" vs \"Migrate\" -- נשמע דומה, משמעות שונה לגמרי."},{"title":"הקשר מכריע","body":"בהשלמת משפטים, חפש מילות ניגוד (although, despite) ומילות חיזוק (since, because)."},{"title":"Only if / Unless","body":"\"Only if X, Y\" = Y לא יקרה בלי X. \"Unless X, Y\" = אם X לא קורה, Y יקרה."},{"title":"None but / Scarcely","body":"\"None but the best\" = רק הטובים ביותר. \"Scarcely any\" = כמעט אף אחד."},{"title":"אסטרטגיית ביטול","body":"תחילה בטל תשובות ברורות שאינן נכונות. בדרך כלל ישארו 2 אפשרויות."},{"title":"For all its / Despite","body":"\"For all its flaws\" = למרות כל פגמיו. הפסקה עוברת לחיובי לאחר מכן."},{"title":"מורפמות: un-, in-, dis-","body":"מילה עם un/in/dis = שלילה. \"Unprecedented\" = חסר תקדים."}]};

function V(h,keep){const m=$('#m'),y=m.scrollTop;m.innerHTML=h;m.scrollTop=keep?y:0}
function go(f){clearInterval(TMR);f()}
function nav(a){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.a===a))}
function ask(msg,yes,no){V(`<div class=card style="line-height:1.6">${msg}</div><button class=btn id=ay>כן</button><button class="btn s" id=an>ביטול</button>`);$('#ay').onclick=yes;$('#an').onclick=no}
function tick(){if(S.day!==td()){S.day=td();S.dn=0}S.dn++;if(S.last!==td()){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=td()}}
function streak(){const y=new Date(Date.now()-864e5).toDateString();return S.last===td()||S.last===y?S.streak:0}
function est(){const h=S.hist.slice(-80);if(h.length<10)return null;let a=0,b=0;h.forEach(r=>{const w=WT[r.d]||1.5;b+=w;if(r.ok)a+=w});return Math.round(50+100*a/b)}
function theme(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;ST.s('ep_th',t)}
const cnt=o=>Object.keys(o).length;

/* ---- מילים קשות ---- */
function qWord(q){if(q.t==='vq')return WID[q.wid];if(q.t!=='sc'&&q.t!=='mo')return null;return WM[String(q.o[q.k]||'').toLowerCase().trim()]||null}
function addHard(w,manual){const h=S.hard[w.id]||{n:0,ok:0};h.n++;h.ok=0;h.t=Date.now();if(manual)h.m=1;S.hard[w.id]=h}
function easeHard(w){const h=S.hard[w.id];if(!h)return;h.ok=(h.ok||0)+1;if(h.ok>=3&&!h.m)delete S.hard[w.id]}
function hardList(){return Object.keys(S.hard).map(id=>({w:WID[id],h:S.hard[id]})).filter(x=>x.w).sort((a,b)=>b.h.n-a.h.n||(b.h.t||0)-(a.h.t||0))}
function wq(w){const seen=new Set([w.d]),ds=[];for(const x of shuf(W.filter(z=>z.id!==w.id&&z.p===w.p)).concat(shuf(W))){if(ds.length>=3)break;if(x.id!==w.id&&!seen.has(x.d)){seen.add(x.d);ds.push(x.d)}}const o=shuf([w.d,...ds]);return{i:'vq_'+w.id,t:'vq',wid:w.id,q:'מה פירוש המילה: '+w.w+' ?',o,k:o.indexOf(w.d),e:w.w+' = '+w.d+(w.n?' · '+w.n:''),df:'medium'}}

/* ---- רישום תשובה ---- */
function rec(q,ok){
 const w=qWord(q);let note='';
 if(q.t==='vq'){if(w){if(ok)easeHard(w);else{addHard(w)}}tick();save();return ''}
 S.hist.push({t:q.t,ok:ok?1:0,d:q.df,i:q.i});if(S.hist.length>1000)S.hist.shift();
 S.seen[q.i]=(S.seen[q.i]||0)+1;
 if(!ok){const x=S.wrong[q.i]||{n:0};x.n++;x.s=0;S.wrong[q.i]=x;if(w){addHard(w);note=w.w}}
 else{const x=S.wrong[q.i];if(x){x.s=(x.s||0)+1;if(x.s>=2)delete S.wrong[q.i]}if(w)easeHard(w)}
 tick();save();return note}
function prio(pool,n){let u=shuf(pool.filter(q=>!S.seen[q.i])),r=u.slice(0,n);if(r.length<n){pool.forEach(q=>{delete S.seen[q.i]});const ids=new Set(r.map(q=>q.i));r=r.concat(shuf(pool.filter(q=>!ids.has(q.i))).slice(0,n-r.length));save()}return r}
function pick(pool,n){S.cyc=S.cyc||{};let un=pool.filter(q=>!S.cyc[q.i]);if(un.length<n){pool.forEach(q=>delete S.cyc[q.i]);un=pool.slice()}const r=shuf(un).slice(0,n);r.forEach(q=>S.cyc[q.i]=1);save();return r}
function pickPid(){S.cyc=S.cyc||{};const ids=Object.keys(P);let un=ids.filter(id=>!S.cyc['pid'+id]);if(!un.length){ids.forEach(id=>delete S.cyc['pid'+id]);un=ids}const id=shuf(un)[0];S.cyc['pid'+id]=1;save();return id}
function weak(){return TYPES.slice(0,4).map(t=>{const r=S.hist.filter(x=>x.t===t[0]),o=r.filter(x=>x.ok).length;return{t:t[0],label:t[1],ok:o,n:r.length,acc:r.length?o/r.length:null}}).filter(x=>x.n>=5).sort((a,b)=>a.acc-b.acc)}
function rowH(l,o,t,warn){return `<div style="margin:11px 0"><div style="display:flex;justify-content:space-between"><span>${l}${warn?' <span class="tag r">לשיפור</span>':''}</span><span class=mu>${o}/${t}${t?' · '+Math.round(o/t*100)+'%':''}</span></div><div class=bar><i style="width:${t?o/t*100:0}%;${warn?'background:var(--red)':''}"></i></div></div>`}

/* ---- בית ---- */
function home(){nav('home');const now=Date.now(),due=W.filter(w=>S.cards[w.id]&&S.cards[w.id].due<=now).length,e=est(),dn=S.day===td()?S.dn:0,k=Math.floor(now/864e5),wod=W[k%W.length],tip=D.tips[k%D.tips.length],wk=weak(),hn=hardList().length,wn=cnt(S.wrong);
V(`${STOK?'':'<div class=warn>⚠️ הדפדפן חוסם שמירה, ההתקדמות לא תישמר. פתח את האפליקציה ב-Safari רגיל או מהאייקון במסך הבית.</div>'}
<div class=card style="background:linear-gradient(135deg,#0b3d3a,#12305e);color:#fff;border:0"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="opacity:.75;font-size:13px">היי סהר 👋</div><h2 style="margin:2px 0">English Pro · אמירנט</h2></div><button class=x onclick="theme()">◐</button></div>
<div style="display:flex;gap:8px;margin-top:10px"><span class=pill>🔥 ${streak()} ימים</span><span class=pill>ציון משוער: ${e??'—'}</span></div>
<div style="opacity:.8;font-size:12px;margin:12px 0 5px">יעד יומי: ${Math.min(dn,10)}/10</div><div class=bar><i style="width:${Math.min(100,dn*10)}%"></i></div></div>
${wk.length&&wk[0].acc<.8?`<div class=card onclick="startP('${wk[0].t}')"><small>🎯 הכי כדאי לשפר</small><div style="font-weight:800;margin-top:3px">${wk[0].label} · דיוק ${Math.round(wk[0].acc*100)}%</div><div class=mu>לחץ לתרגול ממוקד</div></div>`:''}
<div class=g>
<div class=card onclick="go(vocab)"><div style="font-size:28px">📚</div><b>מילים</b><small>${due?due+' לחזרה':W.length+' מילים'}</small></div>
<div class=card onclick="go(prac)"><div style="font-size:28px">✏️</div><b>תרגול</b><small>${QS.length} שאלות</small></div>
<div class=card onclick="go(sim)"><div style="font-size:28px">⚡</div><b>סימולציה</b><small>23 שאלות · 30 דק׳</small></div>
<div class=card onclick="startP('mo')"><div style="font-size:28px">🔤</div><b>מבנה מילה</b><small>תחיליות וסיומות</small></div>
<div class=card onclick="go(hardw)"><div style="font-size:28px">🔥</div><b>מילים קשות</b><small>${hn} שמורות</small></div>
<div class=card onclick="startW()"><div style="font-size:28px">❗</div><b>שאלות שטעית</b><small>${wn} לחזרה</small></div></div>
<div class=card><small>💡 מילה יומית</small><div style="font-size:24px;font-weight:900;color:var(--teal);direction:ltr;text-align:left;margin:4px 0">${esc(wod.w)}</div><div class=mu>${esc(wod.d)}</div></div>
<div class=card><b>${esc(tip.title)}</b><div class=mu style="margin-top:4px;font-size:13px">${esc(tip.body)}</div></div>`)}

/* ---- מילים ---- */
function vocab(){nav('vocab');const now=Date.now(),due=W.filter(w=>S.cards[w.id]&&S.cards[w.id].due<=now).slice(0,30),nw=W.filter(w=>!S.cards[w.id]).slice(0,10),L=Object.values(S.cards).filter(c=>c.iv>=1).length,hn=hardList().length;
VQ=[...due,...nw];VI=0;
V(`<h2>מילים</h2><div class=card><div class=num>${L}<small> / ${W.length}</small></div><div class=mu>מילים שנלמדו</div><div class=bar style="margin-top:8px"><i style="width:${L/W.length*100}%"></i></div></div>
<div class=card>לחזרה עכשיו: <b>${due.length}</b> · חדשות: <b>${nw.length}</b></div>
${VQ.length?'<button class=btn onclick="card()">התחל ללמוד</button>':'<div class=card>סיימת הכל כרגע 🎉</div>'}
<button class="btn s" onclick="go(hardw)">🔥 מילים קשות (${hn})</button>`)}
function card(){if(VI>=VQ.length)return vocab();const w=VQ[VI],ex=w.x&&!/is an important vocabulary word/.test(w.x),hd=!!S.hard[w.id];
V(`<div class=top><button class=x onclick="go(vocab)">✕</button><div class=bar><i style="width:${VI/VQ.length*100}%"></i></div></div>
<div class="card fc" id=fc><div class=w>${esc(w.w)}</div><div class=mu>${esc(w.p)}</div>
<div id=bk style="display:none;margin-top:14px"><div style="font-size:22px;font-weight:800">${esc(w.d)}</div>${ex?`<div class=mu dir=ltr style="margin-top:8px">${esc(w.x)}</div>`:''}${w.m?`<div class=mu style="margin-top:6px">🧩 ${esc(w.m)}</div>`:''}${w.n?`<div class=mu style="margin-top:6px">💭 ${esc(w.n)}</div>`:''}</div>
<div class=mu id=hint style="margin-top:18px">לחץ כדי לראות תרגום</div>
<button class="star ${hd?'on':''}" id=st>${hd?'⭐ במילים קשות':'☆ סמן כמילה קשה'}</button></div>
<div class=row id=rt style="display:none"><button class="btn s" onclick="rate(0)">שוב</button><button class=btn onclick="rate(1)">טוב</button><button class="btn s" onclick="rate(2)">קל</button></div>`);
$('#fc').onclick=()=>{$('#bk').style.display='block';$('#hint').style.display='none';$('#rt').style.display='flex'};
$('#st').onclick=ev=>{ev.stopPropagation();const b=$('#st');if(S.hard[w.id]){delete S.hard[w.id];b.classList.remove('on');b.textContent='☆ סמן כמילה קשה'}else{addHard(w,true);b.classList.add('on');b.textContent='⭐ במילים קשות'}save()}}
function rate(r){const w=VQ[VI],c=S.cards[w.id]||{ef:2.5,iv:0,due:0,reps:0};
if(r===0){c.iv=0;c.ef=Math.max(1.3,c.ef-.2);c.due=Date.now()+6e5;VQ.push(w);addHard(w)}
else{c.iv=c.iv<1?(r===2?3:1):Math.round(c.iv*c.ef*(r===2?1.4:1));if(r===2)c.ef+=.1;c.due=Date.now()+c.iv*864e5;c.reps++;easeHard(w)}
S.cards[w.id]=c;tick();save();VI++;card()}
function hardw(){nav('vocab');const hs=hardList();
V(`<div class=top><button class=x onclick="go(vocab)">→</button><h2 style="margin:0">מילים קשות (${hs.length})</h2></div>
<div class=card><small>מילים שטעית בהן בתרגול או במבחן, מילים שדירגת "שוב", ומילים שסימנת ⭐. מילה שנוספה אוטומטית יוצאת מהרשימה אחרי 3 תשובות נכונות. מילה שסימנת ידנית נשארת עד שתסיר אותה.</small></div>
${hs.length?`<div class=row><button class=btn onclick="hardCards()">כרטיסיות</button><button class="btn s" onclick="hardQuiz()">חידון</button></div>`:'<div class=card>עוד אין מילים קשות 🎉</div>'}
<div style="height:10px"></div>
${hs.map(x=>`<div class=card style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div dir=ltr style="font-weight:800;color:var(--teal);font-size:18px;text-align:left">${esc(x.w.w)}${x.h.m?' ⭐':''}</div><div class=mu>${esc(x.w.d)}</div></div><div style="text-align:center;flex:none"><small>טעויות</small><div style="font-weight:800;margin-bottom:6px">${x.h.n}</div><button class=x onclick="rmHard('${x.w.id}')">✕</button></div></div>`).join('')}`)}
function rmHard(id){delete S.hard[id];save();hardw()}
function hardCards(){VQ=shuf(hardList().map(x=>x.w));VI=0;card()}
function hardQuiz(){quiz(shuf(hardList().map(x=>x.w)).slice(0,15).map(wq),false)}

/* ---- תרגול ---- */
function prac(){nav('prac');V(`<h2>תרגול</h2><div class=g>${TYPES.map(t=>`<div class=card onclick="startP('${t[0]}')"><div style="font-size:28px">${t[2]}</div><b>${t[1]}</b><small>${t[0]==='all'?QS.filter(q=>q.t!=='rc').length:QS.filter(q=>q.t===t[0]).length} שאלות</small></div>`).join('')}<div class=card onclick="startW()"><div style="font-size:28px">❗</div><b>שאלות שטעית</b><small>${cnt(S.wrong)} לחזרה</small></div></div><div class=mu>10 שאלות בכל סבב · בחירה אקראית, בלי חזרות עד שעוברים על כל המאגר. שאלות שטעית בהן מופיעות רק במסך "שאלות שטעית"</div>`)}
function startP(t){nav('prac');let l;
if(t==='rc'){const pid=pickPid();l=QS.filter(q=>q.pid===pid)}
else l=pick(t==='all'?QS.filter(q=>q.t!=='rc'):QS.filter(q=>q.t===t),10);
quiz(l,false)}
function startW(){nav('prac');const l=QS.filter(q=>S.wrong[q.i]);if(!l.length)return V(`<h2>שאלות שטעית</h2><div class=card>אין כרגע שאלות לחזרה 🎉<br><span class=mu>שאלות שתטעה בהן יישמרו כאן. שאלה יוצאת מהרשימה אחרי 2 תשובות נכונות ברצף.</span></div><button class=btn onclick="go(prac)">חזרה לתרגול</button>`);quiz(shuf(l).slice(0,10),false)}
function sim(){nav('sim');const b=S.sims.length?Math.max(...S.sims.map(s=>s.sc)):null;V(`<h2>סימולציית מבחן</h2><div class=card>23 שאלות · 30 דקות · הסברים רק בסוף, עם סקירה של כל השאלות והתשובות.<br><span class=mu>מבנה משוער בהשראת אמירנט, לא מבחן רשמי. הציון הוא הערכה גסה בלבד.</span></div>${b?`<div class=card>הציון הטוב ביותר: <b>${b}</b> · מבחנים: ${S.sims.length}</div>`:''}${S.sims.slice(-3).reverse().map(s=>`<div class=card>${esc(s.d)} · ציון ${s.sc} · ${s.ok}/${s.n}</div>`).join('')}<button class=btn onclick="startS()">התחל מבחן ⚡</button>`)}
function startS(){const by=(t,n)=>pick(QS.filter(q=>q.t===t),n),pid=pickPid();quiz([...by('sc',10),...by('rst',4),...by('mo',4),...QS.filter(q=>q.pid===pid)],true)}

/* ---- סקירת שאלה ---- */
function rev(r,x){const q=r.q,pa=q.pid?P[q.pid]:null;
return `<div class=card><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap"><b>${x+1}.</b><span class="tag ${r.ok?'g':'r'}">${r.skip?'לא נענתה':r.ok?'נכון':'שגוי'}</span><span class=mu>${TN[q.t]||'חידון מילים'}${q.df&&q.t!=='vq'?' · '+DN[q.df]:''}</span></div>
${pa?`<details style="margin-bottom:8px"><summary class=mu>📖 ${esc(pa.title)} · הצג את הקטע</summary><div class=pass dir=auto style="margin-top:6px">${esc(pa.text)}</div></details>`:''}
<div class=q2 dir=auto>${esc(q.q)}</div>
${q.o.map((o,j)=>{const c=j===q.k?'good':(o===r.pick&&!r.ok?'bad':'');return `<div class="ro ${c}" dir=auto>${j===q.k?'✔ ':c==='bad'?'✖ ':''}${esc(o)}${c==='bad'?' <small>(התשובה שלך)</small>':''}</div>`}).join('')}
${r.skip?'<div class=mu>לא הספקת לענות על שאלה זו</div>':''}
${q.e?`<div class=mu style="margin-top:8px;line-height:1.5">💡 ${esc(q.e)}</div>`:''}</div>`}

/* ---- חידון / מבחן ---- */
function quiz(list,isSim){
let i=0;const res=[],t0=Date.now(),end=t0+30*6e4,added=[];clearInterval(TMR);
function fin(){clearInterval(TMR);
 if(isSim)for(let j=res.length;j<list.length;j++)res.push({q:list[j],ok:false,pick:null,skip:1});
 let a=0,b=0;const bt={},bd={};
 res.forEach(r=>{const w=WT[r.q.df]||1.5,t=r.q.t,d=r.q.df;b+=w;if(r.ok)a+=w;bt[t]=bt[t]||[0,0];bt[t][1]++;if(r.ok)bt[t][0]++;bd[d]=bd[d]||[0,0];bd[d][1]++;if(r.ok)bd[d][0]++});
 const okc=res.filter(r=>r.ok).length,sc=Math.round(50+100*(b?a/b:0)),sec=Math.round((Date.now()-t0)/1000),wl=res.filter(r=>!r.ok).map(r=>r.q);
 if(isSim){S.sims.push({d:new Date().toLocaleDateString('he-IL'),sc,ok:okc,n:res.length,by:bt,bd,sec});if(S.sims.length>30)S.sims.shift();tick();save()}
 function view(f,keep){const wn=res.length-okc,sh=res.map((r,x)=>({r,x})).filter(o=>f==='all'||!o.r.ok);
 V(`<h2>${isSim?'תוצאות המבחן':'סיכום תרגול'}</h2>
<div class=card style="text-align:center"><div class=num>${okc}/${res.length}</div>${isSim?`<div>ציון משוער: <b>${sc}</b></div><small>הערכה גסה בלבד · זמן ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</small>`:`<small>${res.length?Math.round(okc/res.length*100):0}% דיוק</small>`}</div>
<div class=card><b>פילוח לפי סוג שאלה</b>${TYPES.filter(t=>bt[t[0]]).map(t=>rowH(t[1],bt[t[0]][0],bt[t[0]][1],bt[t[0]][1]>=2&&bt[t[0]][0]/bt[t[0]][1]<.6)).join('')}${bt.vq?rowH('חידון מילים',bt.vq[0],bt.vq[1],false):''}
${Object.keys(bd).length>1?`<div style="height:8px"></div><b>לפי רמת קושי</b>${['easy','medium','hard'].filter(d=>bd[d]).map(d=>rowH(DN[d],bd[d][0],bd[d][1],false)).join('')}`:''}</div>
${added.length?`<div class=card>🔥 נוספו למילים קשות: <b dir=ltr>${added.map(esc).join(', ')}</b></div>`:''}
<div class=seg><button class="${f==='all'?'on':''}" onclick="__rv('all',1)">כל השאלות (${res.length})</button><button class="${f==='bad'?'on':''}" onclick="__rv('bad',1)">רק טעויות (${wn})</button></div>
${sh.map(o=>rev(o.r,o.x)).join('')||'<div class=card>אין טעויות 🎉</div>'}
${wn?`<button class=btn onclick="__rt()">תרגל את הטעויות (${Math.min(wn,10)})</button>`:''}
<button class="btn s" onclick="go(${isSim?'sim':'prac'})">${isSim?'חזרה':'תרגול נוסף'}</button><button class="btn s" onclick="go(home)">בית</button>`,keep)}
 window.__rv=view;window.__rt=()=>quiz(shuf(wl.filter(q=>q.t!=='vq')).slice(0,10),false);view('all',0)}
function show(){if(i>=list.length)return fin();const q=list[i],os=shuf(q.o.map((t,j)=>({t,j}))),pa=q.pid?P[q.pid]:null;let done=0;
V(`<div class=top><button class=x id=qx>✕</button><div class=bar><i style="width:${i/list.length*100}%"></i></div><span class=mu>${i+1}/${list.length}</span>${isSim?'<span class=tm id=tm></span>':''}</div>
${pa?`<div class="card pass" dir=auto><b>${esc(pa.title)}</b>\n${esc(pa.text)}</div>`:''}<div class="card q" dir=auto>${esc(q.q)}</div>
${os.map((o,n)=>`<button class=opt dir=auto data-n=${n}>${esc(o.t)}</button>`).join('')}<div id=ex></div><button class=btn id=nx style="display:none">${i+1<list.length?'הבא ←':'סיום'}</button>`);
$('#qx').onclick=()=>isSim?ask('לצאת מהמבחן? התשובות עד עכשיו לא יישמרו.',()=>{clearInterval(TMR);sim()},show):go(prac);
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=1;const n=+b.dataset.n,ok=os[n].j===q.k,note=rec(q,ok);if(note&&!added.includes(note))added.push(note);res.push({q,ok,pick:os[n].t});
 if(isSim){i++;return show()}
 document.querySelectorAll('.opt').forEach((x,m)=>{if(os[m].j===q.k)x.classList.add('good');else if(m===n)x.classList.add('bad')});
 $('#ex').innerHTML=`<div class="ex ${ok?'r':'w'}">${ok?'✅ נכון! ':'❌ לא נכון. '}${esc(q.e||'')}</div>${note?`<div class=mu style="margin:0 0 8px">🔥 "${esc(note)}" נשמרה במילים הקשות</div>`:''}`;
 const nx=$('#nx');nx.style.display='block';nx.onclick=()=>{i++;show()}})}
if(isSim)TMR=setInterval(()=>{const s=Math.max(0,Math.round((end-Date.now())/1000)),t=$('#tm');if(t)t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)fin()},500);
show()}

/* ---- התקדמות ---- */
function stats(){nav('stats');const h=S.hist,n=h.length,ok=h.filter(r=>r.ok).length,wk=weak(),w0=wk[0],hn=hardList().length,wn=cnt(S.wrong);
const byT=TYPES.slice(0,4).map(t=>{const r=h.filter(x=>x.t===t[0]);return rowH(t[1],r.filter(x=>x.ok).length,r.length,!!(w0&&w0.t===t[0]&&w0.acc<.8))}).join('');
const byD=['easy','medium','hard'].map(d=>{const r=h.filter(x=>x.d===d);return rowH(DN[d],r.filter(x=>x.ok).length,r.length,false)}).join('');
const ins=[];
if(n<10)ins.push('ענה על לפחות 10 שאלות כדי לקבל ניתוח אישי.');
else{
 if(w0&&w0.acc<.8)ins.push(`הנושא החלש ביותר: <b>${w0.label}</b> (${Math.round(w0.acc*100)}% דיוק).`);
 const e=h.filter(x=>x.d==='easy');if(e.length>=5&&e.filter(x=>x.ok).length/e.length<.75)ins.push('יש טעויות גם בשאלות קלות. כדאי לקרוא לאט יותר ולא למהר.');
 if(n>=40){const a=h.slice(-20),b=h.slice(-40,-20),pa=a.filter(x=>x.ok).length/20,pb=b.filter(x=>x.ok).length/20;ins.push(pa>pb+.05?'📈 הדיוק ב-20 השאלות האחרונות עלה לעומת הקודמות.':pa<pb-.05?'📉 הדיוק ב-20 השאלות האחרונות ירד לעומת הקודמות.':'הדיוק יציב ב-40 השאלות האחרונות.')}
 if(!ins.length)ins.push('אין כרגע נקודת חולשה בולטת. המשך לתרגל.')}
if(hn)ins.push(`🔥 ${hn} מילים קשות מחכות לחזרה.`);
if(wn)ins.push(`❗ ${wn} שאלות שטעית בהן מחכות לחזרה.`);
const bs=S.sims.length?Math.max(...S.sims.map(s=>s.sc)):null;
V(`<h2>התקדמות</h2><div class=g><div class=card><div class=num>${n}</div><small>שאלות נענו</small></div><div class=card><div class=num>${n?Math.round(ok/n*100):0}%</div><small>דיוק</small></div></div>
<div class=card><b>מה לשפר</b>${ins.map(t=>`<div style="margin-top:8px;line-height:1.5;font-size:14px">• ${t}</div>`).join('')}
${w0&&w0.acc<.8?`<button class=btn onclick="startP('${w0.t}')">תרגל: ${w0.label}</button>`:''}
${wn?`<button class="btn s" onclick="startW()">תרגל שאלות שטעית</button>`:''}${hn?`<button class="btn s" onclick="go(hardw)">מילים קשות (${hn})</button>`:''}</div>
<div class=card><b>לפי סוג שאלה</b>${byT}</div><div class=card><b>לפי רמת קושי</b>${byD}</div>
<div class=card><b>מבחנים אחרונים</b>${bs?`<div class=mu style="margin-top:4px">הטוב ביותר: ${bs}</div>`:''}${S.sims.length?S.sims.slice(-8).reverse().map(s=>`<div class=mu style="margin-top:6px">${esc(s.d)} · ציון ${s.sc} · ${s.ok}/${s.n}</div>`).join(''):'<div class=mu>עוד לא נעשו מבחנים</div>'}</div>
<button class="btn s" onclick="backup()">גיבוי ושחזור נתונים</button>
<button class="btn s" onclick="ask('למחוק את כל ההתקדמות, כולל מילים קשות וטעויות?',()=>{S=fresh();save();stats()},stats)">איפוס התקדמות</button>`)}
function backup(){V(`<div class=top><button class=x onclick="go(stats)">→</button><h2 style="margin:0">גיבוי ושחזור</h2></div>
<div class=card><small>העתק את הטקסט ושמור אותו (למשל בהערות). כך אפשר לשחזר את ההתקדמות גם אחרי מעבר לכתובת אחרת.</small></div>
<textarea id=bk readonly>${esc(JSON.stringify(S))}</textarea><button class=btn id=cp>העתק</button>
<h2 style="margin-top:18px">שחזור</h2><textarea id=rs placeholder="הדבק כאן גיבוי"></textarea><button class="btn s" id=rb>שחזר</button><div id=msg class=mu style="margin-top:8px"></div>`);
$('#cp').onclick=()=>{const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}try{document.execCommand('copy')}catch(e){}$('#msg').textContent='הועתק. אם לא עבד, לחץ לחיצה ארוכה על הטקסט ובחר העתק.'};
$('#rb').onclick=()=>{try{const o=JSON.parse($('#rs').value);if(!o||typeof o!=='object'||!o.cards)throw 0;S=Object.assign(fresh(),o);save();$('#msg').textContent='שוחזר ✅'}catch(e){$('#msg').textContent='הטקסט לא תקין'}}}

try{const t=ST.g('ep_th');if(t)document.documentElement.dataset.theme=t}catch(e){}
home();
</script></body></html>
